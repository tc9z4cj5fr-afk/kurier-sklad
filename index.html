<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Магазин Века</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-2: #eef0f2;
    --text: #14171c;
    --muted: #5b6472;
    --border: #dee2e6;
    --accent: #2b3648;
    --accent-strong: #171d28;
    --accent-soft: #e9ebee;
    --shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 4px 16px rgba(20, 23, 28, 0.05);
    --ok: #1f7a52;
    --ok-bg: #e6f4ee;
    --warn: #9a6a10;
    --warn-bg: #f7f0dd;
    --info: #2f5aa3;
    --info-bg: #e9eefb;
    --danger: #ac3038;
    --danger-bg: #fbe9ea;
    --radius-lg: 14px;
    --radius: 10px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  :root[data-theme="dark"] {
    --bg: #101216;
    --surface: #171a1f;
    --surface-2: #1f232a;
    --text: #edeff2;
    --muted: #8b93a1;
    --border: #2a2f37;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    --accent: #c3cbdb;
    --accent-strong: #eef1f7;
    --accent-soft: #232833;
    --ok-bg: #12301f;
    --warn-bg: #332a10;
    --info-bg: #16233c;
    --danger-bg: #3a1a1d;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --surface: #171a1f;
      --surface-2: #1f232a;
      --text: #edeff2;
      --muted: #8b93a1;
      --border: #2a2f37;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
      --accent: #c3cbdb;
      --accent-strong: #eef1f7;
      --accent-soft: #232833;
      --ok-bg: #12301f;
      --warn-bg: #332a10;
      --info-bg: #16233c;
      --danger-bg: #3a1a1d;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #root { min-height: 100%; display: flex; justify-content: center; }

  .shell {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  @media (min-width: 600px) {
    body { background: var(--surface-2); padding: 24px 0; }
    .shell {
      min-height: calc(100vh - 48px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }
  }

  button, select, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Login / role screen ---------- */
  .login {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    color: var(--text);
    padding: 40px 24px 28px;
  }
  .login-head { margin-bottom: 30px; }
  .login-head .mark {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; margin-bottom: 16px; color: var(--text);
  }
  .login-head .mark svg { width: 44px; height: 44px; display: block; }
  .login-head .eyebrow { display: block; margin-bottom: 8px; }
  .login-head h1 { font-size: 21px; font-weight: 700; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  .login-head p { margin: 0; font-size: 13px; color: var(--muted); }

  .role-list {
    display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .role-card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface);
    color: var(--text);
    border: none; border-bottom: 1px solid var(--border);
    padding: 15px 16px; text-align: left; cursor: pointer;
    width: 100%;
  }
  .role-card:last-child { border-bottom: none; }
  .role-card:hover { background: var(--surface-2); }
  .role-card .mark-sm {
    width: 34px; height: 34px; border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--text);
  }
  .role-card .mark-sm svg { width: 17px; height: 17px; display: block; }
  .role-card .body { flex: 1; min-width: 0; }
  .role-card .label { font-weight: 600; font-size: 14.5px; }
  .role-card .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .role-card .chev { color: var(--muted); font-size: 15px; flex-shrink: 0; }

  .id-field {
    margin-top: 22px; border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    background: var(--surface-2);
  }
  .id-field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .id-field input {
    width: 100%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px;
  }
  .id-field .hint { font-size: 11px; color: var(--muted); margin-top: 7px; }

  /* ---------- App shell after login ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface); z-index: 5;
  }
  .topbar .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0;
  }
  .topbar .avatar svg { width: 16px; height: 16px; display: block; }
  .topbar .who { flex: 1; min-width: 0; }
  .topbar .who .name { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .topbar .who .role { font-size: 11px; color: var(--muted); }
  .topbar .switch-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px; cursor: pointer;
  }
  .topbar .switch-btn:hover { background: var(--surface-2); }

  .status-banner {
    font-size: 11px; padding: 6px 16px; text-align: center;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .status-banner .dot { width: 6px; height: 6px; border-radius: 50%; }
  .status-banner.ok { color: var(--ok); }
  .status-banner.ok .dot { background: var(--ok); }
  .status-banner.warn { color: var(--warn); }
  .status-banner.warn .dot { background: var(--warn); }

  main { flex: 1; padding: 18px 16px; padding-bottom: 88px; overflow-y: auto; }
  .screen-title {
    font-size: 17px; font-weight: 700; margin: 2px 0 4px; text-wrap: balance; letter-spacing: -0.01em;
  }
  .screen-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .screen-title + .screen-sub { margin-top: 0; }
  .screen-title-row { margin-bottom: 16px; }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    position: sticky; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0 4px calc(0px + env(safe-area-inset-bottom));
    z-index: 5;
  }
  nav.tabbar button {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-top: 2px solid transparent; color: var(--muted); font-size: 11.5px; font-weight: 500;
    padding: 13px 2px 11px; cursor: pointer; position: relative;
  }
  nav.tabbar button.active { color: var(--text); font-weight: 700; border-top-color: var(--accent); }
  nav.tabbar .badge {
    position: absolute; top: 7px; right: 16%;
    background: var(--danger); color: #fff; font-size: 9px; font-weight: 700;
    min-width: 15px; height: 15px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center; padding: 0 3px;
  }

  /* ---------- Cards / lists ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .product {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface);
  }
  .product .thumb {
    aspect-ratio: 1.5; border-radius: var(--radius-sm); background: var(--surface-2);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--muted);
  }
  .product .name { font-size: 13px; font-weight: 600; line-height: 1.25; min-height: 2.4em; }
  .product .meta { display: flex; justify-content: space-between; align-items: baseline; }
  .product .price { font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .product .stock { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .product .stock.low { color: var(--danger); }
  .product button.add {
    border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 600;
    font-size: 12.5px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer;
  }
  .product button.add:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .product button.add:disabled { background: var(--surface-2); border-color: var(--border); color: var(--muted); cursor: default; }
  .product .stepper {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px;
  }
  .product .stepper button {
    border: none; background: none; font-size: 16px; width: 24px; color: var(--text); cursor: pointer;
  }
  .product .stepper .qty { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 13px; }

  .row-list { display: flex; flex-direction: column; gap: 10px; }
  .row-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
    display: flex; flex-direction: column; gap: 8px; background: var(--surface);
  }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .row-top .id { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-top .date { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    padding: 4px 9px 4px 7px; border-radius: 999px; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pill.waiting { background: var(--warn-bg); color: var(--warn); }
  .pill.waiting .dot { background: var(--warn); }
  .pill.transit { background: var(--info-bg); color: var(--info); }
  .pill.transit .dot { background: var(--info); }
  .pill.delivered { background: var(--ok-bg); color: var(--ok); }
  .pill.delivered .dot { background: var(--ok); }
  .pill.cancelled { background: var(--danger-bg); color: var(--danger); }
  .pill.cancelled .dot { background: var(--danger); }

  .row-sum { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; }
  .row-sum .addr { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sum .amt { font-weight: 700; font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row-actions select {
    font-size: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    padding: 6px 8px; background: var(--surface); color: var(--text); cursor: pointer;
  }
  .row-actions .act-btn {
    font-size: 12px; font-weight: 600; border-radius: var(--radius-sm);
    border: 1px solid var(--border); padding: 6px 10px;
    background: var(--surface); color: var(--text); cursor: pointer;
  }
  .row-actions .act-btn:hover { background: var(--surface-2); }
  .row-actions .act-btn.danger { color: var(--danger); }

  /* ---------- Cart ---------- */
  .cart-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cart-item:last-child { border-bottom: none; }
  .cart-item .thumb {
    width: 38px; height: 38px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); flex-shrink: 0;
  }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .info .name { font-size: 13px; font-weight: 600; }
  .cart-item .info .unit-price { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cart-item .stepper { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; }
  .cart-item .stepper button { border: none; background: none; font-size: 15px; color: var(--text); cursor: pointer; }
  .cart-item .remove { border: none; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px; }
  .cart-item .remove:hover { color: var(--danger); }

  .summary-row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--muted); }
  .summary-row.total { font-size: 16px; font-weight: 700; color: var(--text); padding-top: 10px; border-top: 1px solid var(--border); margin-top: 6px; }
  .summary-row.total span:last-child { font-variant-numeric: tabular-nums; }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
  .field input, .field textarea, .field select {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 13.5px; background: var(--surface); color: var(--text); font-family: inherit;
  }
  .btn-primary {
    width: 100%; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700;
    font-size: 14px; padding: 13px; border-radius: var(--radius); cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-weight: 600; font-size: 13px; padding: 10px 14px; border-radius: var(--radius); cursor: pointer;
  }

  .seg { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button {
    flex: 1; border: none; background: var(--surface); color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 10px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.active { background: var(--accent); color: #fff; font-weight: 700; }

  .chips { display: flex; gap: 6px; }
  .chip {
    flex: 1; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-size: 11.5px; font-weight: 600; padding: 6px 4px; border-radius: var(--radius-sm);
    cursor: pointer; font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .chip:hover { background: var(--surface-2); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .weight-pick { display: flex; flex-direction: column; gap: 6px; }
  .weight-pick .custom-w { display: flex; gap: 6px; }
  .weight-pick .custom-w input {
    flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 8px; font-size: 12px; background: var(--surface); color: var(--text);
  }
  .weight-pick .custom-w .chip { flex: 0 0 auto; padding: 6px 8px; }

  .empty-state { text-align: center; padding: 52px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-state .eyebrow { display: block; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; margin: 0; }

  /* ---------- Metrics ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-card .val { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .bars { display: flex; flex-direction: column; gap: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-row .lbl { width: 92px; font-size: 11.5px; color: var(--muted); flex-shrink: 0; }
  .bar-track { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .bar-row .num { width: 44px; text-align: right; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ---------- Products management table ---------- */
  .prod-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .prod-row:last-child { border-bottom: none; }
  .prod-row .name { font-size: 12.5px; font-weight: 600; }
  .prod-row .sku { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .prod-row .editable {
    font-size: 12.5px; font-weight: 700; border: 1px solid var(--border);
    background: var(--surface); border-radius: var(--radius-sm); padding: 6px 8px;
    width: 64px; text-align: right; font-variant-numeric: tabular-nums;
  }
  .prod-row .editable:focus { border-color: var(--accent); }
  .col-caption { font-size: 10px; color: var(--muted); text-align: right; text-transform: uppercase; letter-spacing: 0.03em; }
  .prod-head { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 2px; }
  .prod-head .editable-w { width: 64px; }

  .section-gap { margin-top: 24px; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--accent-strong); color: var(--surface); font-size: 12.5px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius-sm); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 20; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
</head>
<body>
<div id="root"><div class="shell" id="shell"></div></div>

<script>
(function () {
  "use strict";

  var API_URL = "https://script.google.com/macros/s/AKfycbyJERQB9Gh087cRwav4RsMevwp3p1LnZWmoqVK4G8OqidhXML8RPC1GEmSBBJUEyaJo/exec";

  var ICONS = {

      try { h = JSON.parse(localStorage.getItem("ppm_pokaz_h") || "") || h; } catch (e) {}
      if (!h.s || Date.now() - h.s > 3600000) h = { s: Date.now(), n: 0 };

    if (list.length === 1 && list[0] === "crypto") return "Криптовалюта не может быть единственным способом оплаты: оставьте ещё наличные или QR";
    return "";
  }
  function payMethodLabel(code) {
    code = PAY_LEGACY[code] || code;
    for (var i = 0; i < PAY_CATALOG.length; i++) if (PAY_CATALOG[i].code === code) return PAY_CATALOG[i].label;
    return code || "";
  }
  // Включённые способы в демо: по умолчанию только наличные; сломанный набор читается как «только наличные»
  function payMethodsDemoRead() {
    var list = kassaStoreGet_(PAYM_DEMO_KEY, ["cash"]);
    if (!Array.isArray(list)) list = ["cash"];
    list = PAY_CATALOG.map(function (m) { return m.code; }).filter(function (c) { return list.indexOf(c) !== -1; });
    return payMethodsCheck(list) ? ["cash"] : list;
  }
  function payFieldsDemoRead() { return kassaStoreGet_(PAYM_FIELDS_DEMO_KEY, {}); }

  // Пульт: все способы с галочкой и реквизитами. Promise<{methods, catalog:[{code,label,enabled,fields:[{key,label,value}]}]}>
  function payMethodsLoad() {
    if (KASSA_DEMO) {
      var on = payMethodsDemoRead(), vals = payFieldsDemoRead();
      return Promise.resolve({
        methods: on,
        catalog: PAY_CATALOG.map(function (m) {
          return { code: m.code, label: m.label, enabled: on.indexOf(m.code) !== -1, fields: m.fields.map(function (f) { return { key: f[0], label: f[1], value: vals[f[0]] || "" }; }) };
        })
      });
    }
    return apiPost("getPayMethods", {}).then(assertOk);
  }
  function payMethodsSave(list) {
    var err = payMethodsCheck(list);
    if (err) return Promise.reject(new Error(err));
    if (KASSA_DEMO) { kassaStoreSet_(PAYM_DEMO_KEY, list); return Promise.resolve({ success: true, methods: list }); }
    return apiPost("setPayMethods", { methods: list }).then(assertOk);
  }
  // Реквизит способа (поле под галочкой): в демо в браузере, иначе обычная настройка setText
  function payFieldSave(key, value) {
    if (KASSA_DEMO) { var v = payFieldsDemoRead(); v[key] = value; kassaStoreSet_(PAYM_FIELDS_DEMO_KEY, v); return Promise.resolve(); }
    return apiPost("setText", { key: key, value: value }).then(assertOk);
  }
  // Ответ getPaymentInfo в демо: включённые способы и их реквизиты (клиент видит только отмеченные)
  function payInfoDemo() {
    var on = payMethodsDemoRead(), vals = payFieldsDemoRead(), details = {}, labels = {};
    PAY_CATALOG.forEach(function (m) {
      labels[m.code] = m.label;
      if (m.code !== "cash" && on.indexOf(m.code) !== -1) {
        details[m.code] = { label: m.label, fields: m.fields.map(function (f) { return { key: f[0], label: f[1], value: vals[f[0]] || "" }; }) };
      }
    });
    return { success: true, methods: on, labels: labels, details: details, qrEnabled: on.indexOf("qr_vn") !== -1, bankDetails: vals.pay_bank_details || "", qrImage: vals.pay_qr_image || "", usdtAddress: vals.pay_usdt_address || "", usdtNetwork: vals.pay_usdt_network || "", rates: {} };
  }

  // ---------------- Касса пункта ----------------
  // Журнал: prihod (выдача за наличные, status provedeno), sdacha (ozhidaet -> prinyato | otkloneno).
  // Наличных на пункте = приходы минус принятые сдачи. Ожидающая сдача кассу не меняет.
  function kassaSums(rows) {
    var m = {};
    rows.forEach(function (r) {
      var s = m[r.punkt_id] || (m[r.punkt_id] = { prihod: 0, sdano: 0, ozhidaet: 0, saldo: 0 });
      if (r.tip === "prihod" && r.status === "provedeno") s.prihod += r.summa;
      if (r.tip === "sdacha" && r.status === "prinyato") s.sdano += r.summa;
      if (r.tip === "sdacha" && r.status === "ozhidaet") s.ozhidaet += r.summa;
    });
    Object.keys(m).forEach(function (k) { m[k].saldo = Math.round((m[k].prihod - m[k].sdano) * 100) / 100; });
    return m;
  }
  function kassaDemoRows() {
    var rows = kassaStoreGet_(KASSA_DEMO_KEY, null);
    if (!Array.isArray(rows)) {
      // начальный набор: заказ D-3002 уже выдан за наличные на втором пункте
      rows = [{ id: "KDEMO1", data: new Date(Date.now() - 26 * 3600000).toISOString(), punkt_id: "P-DEMO-2", tip: "prihod", summa: 300000, order_id: "D-3002", kto: "demo", status: "provedeno", podtverdil: "", podtverzhdeno: "" }];
      kassaStoreSet_(KASSA_DEMO_KEY, rows);
    }
    return rows;
  }
  // Демо: выдача заказа за наличные кладёт сумму на пункт (зовёт issueOrder отдела 05). Повтор по тому же заказу ничего не добавляет.
  function kassaDemoVnesti(punktId, orderId, summa) {
    var rows = kassaDemoRows();
    if (!(Number(summa) > 0) || !punktId) return;
    if (rows.some(function (r) { return r.tip === "prihod" && r.order_id === String(orderId); })) return;
    rows.push({ id: "K" + Date.now().toString(36).toUpperCase(), data: new Date().toISOString(), punkt_id: String(punktId), tip: "prihod", summa: Number(summa), order_id: String(orderId), kto: String(state.telegramId || "demo"), status: "provedeno", podtverdil: "", podtverzhdeno: "" });
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
  }
  function kassaPunktNames_() {
    return (typeof loadPunkty === "function" ? loadPunkty() : Promise.resolve([])).then(function (list) {
      var names = {}, ids = [];
      (list || []).forEach(function (p) { names[String(p.id)] = p.nazvanie || p.id; ids.push(String(p.id)); });
      return { names: names, ids: ids };
    }).catch(function () { return { names: {}, ids: [] }; });
  }
  function kassaViewRow_(r, names) {
    return { id: r.id, data: r.data, punktId: r.punkt_id, punktNazvanie: names[r.punkt_id] || r.punkt_id, tip: r.tip, summa: r.summa, orderId: r.order_id, kto: r.kto, ktoImya: r.kto, status: r.status, podtverdil: r.podtverdil, podtverdilImya: r.podtverdil, podtverzhdeno: r.podtverzhdeno };
  }
  // Promise<{punkty:[{punktId, punktNazvanie, saldo, ozhidaet, mozhnoSdat}], total, waiting:[], history:[]}>
  function kassaLoad() {
    if (!KASSA_DEMO) return apiPost("getKassa", {}).then(assertOk);
    return kassaPunktNames_().then(function (pn) {
      var rows = kassaDemoRows(), sums = kassaSums(rows), ids = pn.ids.slice();
      Object.keys(sums).forEach(function (k) { if (ids.indexOf(k) === -1) ids.push(k); });
      var list = ids.map(function (id) {
        var s = sums[id] || { prihod: 0, sdano: 0, ozhidaet: 0, saldo: 0 };
        return { punktId: id, punktNazvanie: pn.names[id] || id, saldo: s.saldo, ozhidaet: s.ozhidaet, prihod: s.prihod, sdano: s.sdano, mozhnoSdat: Math.round((s.saldo - s.ozhidaet) * 100) / 100 };
      }).sort(function (a, b) { return b.saldo - a.saldo; });
      return {
        success: true, punkty: list,
        total: Math.round(list.reduce(function (n, p) { return n + p.saldo; }, 0) * 100) / 100,
        waiting: rows.filter(function (r) { return r.tip === "sdacha" && r.status === "ozhidaet"; }).map(function (r) { return kassaViewRow_(r, pn.names); }),
        history: rows.slice(-40).reverse().map(function (r) { return kassaViewRow_(r, pn.names); })
      };
    });
  }
  // «Сдал»: хозяин пункта или курьер
  function kassaSdat(punktId, summa) {
    summa = Math.round((Number(summa) || 0) * 100) / 100;
    if (!KASSA_DEMO) return apiPost("sdatNalichnye", { punktId: punktId, summa: summa }).then(assertOk);
    if (!(summa > 0)) return Promise.reject(new Error("Сумма сдачи: число больше нуля"));
    var rows = kassaDemoRows(), s = kassaSums(rows)[punktId] || { saldo: 0, ozhidaet: 0 };
    var free = Math.round((s.saldo - s.ozhidaet) * 100) / 100;
    if (summa > free) return Promise.reject(new Error(free > 0 ? "На пункте можно сдать не больше " + free : "На пункте нет наличных к сдаче"));
    rows.push({ id: "K" + Date.now().toString(36).toUpperCase(), data: new Date().toISOString(), punkt_id: punktId, tip: "sdacha", summa: summa, order_id: "", kto: String(state.telegramId || "demo"), status: "ozhidaet", podtverdil: "", podtverzhdeno: "" });
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true, summa: summa });
  }
  // «Принял» (владелец): только теперь сумма списывается с пункта
  function kassaPrinyat(id) {
    if (!KASSA_DEMO) return apiPost("prinyatNalichnye", { id: id }).then(assertOk);
    var rows = kassaDemoRows(), r = rows.filter(function (x) { return x.id === id && x.tip === "sdacha"; })[0];
    if (!r) return Promise.reject(new Error("Сдача не найдена"));
    if (r.status !== "ozhidaet") return Promise.reject(new Error("Сдача уже закрыта"));
    var s = kassaSums(rows)[r.punkt_id] || { saldo: 0 };
    if (r.summa > s.saldo) return Promise.reject(new Error("На пункте меньше наличных, чем в сдаче: отклоните её и сдайте заново"));
    r.status = "prinyato"; r.podtverdil = String(state.telegramId || "demo"); r.podtverzhdeno = new Date().toISOString();
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true });
  }
  // «Не сошлось» (владелец): сдача закрыта, касса не меняется
  function kassaOtklonit(id) {
    if (!KASSA_DEMO) return apiPost("otklonitSdachu", { id: id }).then(assertOk);
    var rows = kassaDemoRows(), r = rows.filter(function (x) { return x.id === id && x.tip === "sdacha"; })[0];
    if (!r) return Promise.reject(new Error("Сдача не найдена"));
    if (r.status !== "ozhidaet") return Promise.reject(new Error("Сдача уже закрыта"));
    r.status = "otkloneno"; r.podtverdil = String(state.telegramId || "demo"); r.podtverzhdeno = new Date().toISOString();
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true });
  }

  // ---------------- «Что требует внимания» ----------------
  // Сырые данные: {pustye:[{punktId,punktNazvanie}], prosrochennye:[{orderId,punktId,punktNazvanie,bronDo}], istekshie:n,
  //                kassa:[{punktId,punktNazvanie,saldo,ozhidaet}], sdachi:[ожидающие сдачи]}
  function attentionLoad() {
    if (!KASSA_DEMO) return apiPost("getAttention", {}).then(assertOk);
    return Promise.all([
      kassaPunktNames_(),
      typeof ostatkiPunkty === "function" ? ostatkiPunkty() : Promise.resolve([]),
      kassaLoad(),
      typeof pickupDemoOrders === "function" ? Promise.resolve(pickupDemoOrders()) : Promise.resolve([])
    ]).then(function (r) {
      var punkty = r[1] || [];
      return (typeof ostatkiLoad === "function" ? ostatkiLoad(punkty) : Promise.resolve([])).then(function (rows) {
        var dost = {};
        (rows || []).forEach(function (o) { dost[o.punkt_id] = (dost[o.punkt_id] || 0) + Math.max(0, Number(o.dostupno != null ? o.dostupno : o.kolichestvo - o.bron) || 0); });
        var out = { success: true, pustye: [], prosrochennye: [], istekshie: 0, kassa: [], sdachi: r[2].waiting };
        punkty.forEach(function (p) { if (!(dost[String(p.id)] > 0)) out.pustye.push({ punktId: String(p.id), punktNazvanie: p.nazvanie || p.id }); });
        var now = Date.now();
        r[3].forEach(function (o) {
          if (o.status === "bron_istekla") out.istekshie++;
          if (o.status === "zabronirovan" && Date.parse(o.bronDo) <= now) out.prosrochennye.push({ orderId: o.orderId, punktId: o.punktId, punktNazvanie: r[0].names[o.punktId] || o.punktNazvanie, bronDo: o.bronDo });
        });
        out.kassa = r[2].punkty.filter(function (p) { return p.saldo > 0; }).map(function (p) { return { punktId: p.punktId, punktNazvanie: p.punktNazvanie, saldo: p.saldo, ozhidaet: p.ozhidaet }; });
        return out;
      });
    });
  }
  // Сырые данные -> строки экрана [{kind: "warn" | "info", text}] (общая для демо и боя)
  function attentionItems(a) {
    var out = [];
    (a.pustye || []).forEach(function (p) { out.push({ kind: "warn", text: "На пункте «" + p.punktNazvanie + "» нет товара" }); });
    (a.prosrochennye || []).forEach(function (o) { out.push({ kind: "warn", text: "Бронь " + o.orderId + " просрочена (пункт «" + o.punktNazvanie + "»), товар ещё не вернулся на полку" }); });
    if (Number(a.istekshie) > 0) out.push({ kind: "info", text: "Броней закрыто по сроку: " + a.istekshie });
    (a.sdachi || []).forEach(function (s) { out.push({ kind: "warn", text: "Ждёт вашего «Принял»: сдача " + money(s.summa) + " с пункта «" + s.punktNazvanie + "»" }); });
    (a.kassa || []).forEach(function (p) { out.push({ kind: "info", text: "Наличные на пункте «" + p.punktNazvanie + "»: " + money(p.saldo) }); });
    return out;
  }
  // Касса пункта и «Что требует внимания» (отдел 09): экраны, одинаковые в витрине и в пульте.
  // Данные и связь с сервером: kassa-dannye.js. kassaPanelMount(root, opts): opts = { canAccept, canHandover }.
  var KASSA_INPUT_STYLE_ = "background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font:inherit;text-align:right;";

  function kassaWhen_(iso) {
    var d = new Date(iso);
    return isNaN(d.getTime()) ? "" : d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }) + " " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  }
  function kassaEventText_(h) {
    if (h.tip === "prihod") return "Выдан заказ " + esc(h.orderId) + " за наличные: +" + money(h.summa);
    var who = h.ktoImya ? " (сдал " + esc(h.ktoImya) + ")" : "";
    if (h.status === "prinyato") return "Сдача принята: −" + money(h.summa) + who;
    if (h.status === "otkloneno") return "Сдача не сошлась, касса не менялась: " + money(h.summa) + who;
    return "Сдача ждёт «Принял»: " + money(h.summa) + who;
  }

  // Блок «Что требует внимания»: строки из attentionItems()
  function attentionHTML(items) {
    if (!items.length) return '<div style="background:var(--ok-bg);color:var(--ok);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;">Всё спокойно: пунктов без товара, просроченных броней и наличных к приёму нет</div>';
    return items.map(function (it) {
      var warn = it.kind === "warn";
      return '<div data-attention="' + it.kind + '" style="background:' + (warn ? "var(--warn-bg)" : "var(--surface-2)") + ';color:' + (warn ? "var(--warn)" : "var(--text)") + ';border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;font-size:13px;">' + esc(it.text) + '</div>';
    }).join("");
  }
  function attentionMount(root) {
    root.innerHTML = '<p class="hint-note">Проверяем…</p>';
    return attentionLoad().then(function (a) {
      root.innerHTML = attentionHTML(attentionItems(a));
    }).catch(function (e) {
      root.innerHTML = '<p class="hint-note">Не удалось загрузить: ' + esc(e && e.message ? e.message : "ошибка") + '</p>';
    });
  }

  function kassaPanelHTML(d, opts) {
    var h = '<div class="card" style="margin-bottom:12px;"><span class="eyebrow">Наличные на пунктах</span>' +
      '<div style="font-size:22px;font-weight:600;margin-top:6px;" data-kassa-total>' + money(d.total) + '</div>' +
      '<p class="hint-note">Деньги лежат у хозяев пунктов. Сумма уходит с пункта только после «Сдал» и вашего «Принял».</p></div>';

    if (d.waiting.length) {
      h += '<div class="card" style="margin-bottom:12px;"><span class="eyebrow">Ждут подтверждения</span>' + d.waiting.map(function (w) {
        return '<div style="padding:8px 0;border-top:1px solid var(--border);" data-waiting="' + esc(w.id) + '">' +
          '<div class="name">' + money(w.summa) + ' · ' + esc(w.punktNazvanie) + '</div>' +
          '<div class="sku">сдал(а) ' + esc(w.ktoImya || w.kto || "—") + ' · ' + esc(kassaWhen_(w.data)) + '</div>' +
          (opts.canAccept
            ? '<div style="display:flex;gap:8px;margin-top:8px;"><button class="btn-primary" data-accept="' + esc(w.id) + '" style="flex:1;">Принял</button>' +
              '<button class="act-btn" data-reject="' + esc(w.id) + '">Не сошлось</button></div>'
            : '<div class="sku">Ждёт, пока владелец нажмёт «Принял»</div>') +
          '</div>';
      }).join("") + '</div>';
    }

    h += d.punkty.map(function (p) {
      return '<div class="card" style="margin-bottom:12px;" data-punkt="' + esc(p.punktId) + '">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
          '<div style="min-width:0;"><div class="name" style="font-weight:600;">' + esc(p.punktNazvanie) + '</div>' +
          '<div class="sku">принято наличными ' + money(p.prihod) + ' · сдано ' + money(p.sdano) + (p.ozhidaet > 0 ? ' · ждёт подтверждения ' + money(p.ozhidaet) : '') + '</div></div>' +
          '<div style="text-align:right;"><span class="eyebrow">Сейчас на пункте</span><br><b data-saldo="' + esc(p.punktId) + '">' + money(p.saldo) + '</b></div>' +
        '</div>' +
        (opts.canHandover && p.mozhnoSdat > 0
          ? '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;">' +
              '<input type="number" min="1" step="any" data-sum="' + esc(p.punktId) + '" value="' + p.mozhnoSdat + '" style="flex:1;min-width:0;' + KASSA_INPUT_STYLE_ + '" />' +
              '<button class="btn-primary" data-sdal="' + esc(p.punktId) + '" style="width:auto;flex:none;padding:8px 18px;">Сдал</button></div>'
          : '') +
        '</div>';
    }).join("");
    if (!d.punkty.length) h += '<div class="empty-state"><span class="eyebrow">Пунктов нет</span><p>Наличные появятся после первой выдачи заказа за наличные.</p></div>';

    if (d.history.length) {
      h += '<div class="card"><span class="eyebrow">История кассы</span>' + d.history.slice(0, 15).map(function (e) {
        return '<div style="padding:6px 0;border-top:1px solid var(--border);font-size:12px;"><div>' + kassaEventText_(e) + '</div>' +
          '<div class="sku">' + esc(e.punktNazvanie) + ' · ' + esc(kassaWhen_(e.data)) + '</div></div>';
      }).join("") + '</div>';
    }
    return h;
  }

  function kassaPanelMount(root, opts) {
    function draw() {
      return kassaLoad().then(function (d) {
        root.innerHTML = kassaPanelHTML(d, opts);
        root.querySelectorAll("[data-sdal]").forEach(function (b) {
          b.addEventListener("click", function () {
            var pid = b.getAttribute("data-sdal");
            var inp = root.querySelector('[data-sum="' + pid + '"]');
            b.disabled = true;
            kassaSdat(pid, inp ? inp.value : 0).then(function () { toast("Сдача записана, ждёт подтверждения владельца"); return draw(); })
              .catch(function (e) { toast(e && e.message ? e.message : "Не удалось сдать"); b.disabled = false; });
          });
        });
        root.querySelectorAll("[data-accept]").forEach(function (b) {
          b.addEventListener("click", function () {
            b.disabled = true;
            kassaPrinyat(b.getAttribute("data-accept")).then(function () { toast("Принято, касса пункта уменьшена"); return draw(); })
              .catch(function (e) { toast(e && e.message ? e.message : "Не удалось принять"); b.disabled = false; });
          });
        });
        root.querySelectorAll("[data-reject]").forEach(function (b) {
          b.addEventListener("click", function () {
            b.disabled = true;
            kassaOtklonit(b.getAttribute("data-reject")).then(function () { toast("Сдача отклонена, касса не менялась"); return draw(); })
              .catch(function (e) { toast(e && e.message ? e.message : "Не удалось отклонить"); b.disabled = false; });
          });
        });
        if (opts.onDraw) opts.onDraw(d);
      }).catch(function (e) {
        root.innerHTML = '<div class="empty-state"><span class="eyebrow">Ошибка</span><p>' + esc(e && e.message ? e.message : "Не удалось загрузить кассу") + '</p></div>';
      });
    }
    root.innerHTML = '<div class="empty-state"><span class="eyebrow">Касса</span><p>Загрузка…</p></div>';
    return draw();
  }
  // ---------------- helpers ----------------
  function money(n) {
    return fmtMoney(n);
  }
  function fmtDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short" });
    } catch (e) { return iso || ""; }
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initial(s) {
    s = String(s || "").trim();
    return s ? esc(s.charAt(0).toUpperCase()) : "—";
  }
  function t(key) {
    var v = state.texts[key];
    if (typeof v === "string" && v.trim() !== "") return v;
    return DEFAULT_TEXTS[key] || "";
  }
  // Ссылка «Карта» на точку выдачи (только если координаты заданы в текстах)
  function pickupMapLink() {
    var lat = String(t("pickup_lat") || "").trim();
    var lng = String(t("pickup_lng") || "").trim();
    if (!lat || !lng) return "";
    return '<a class="act-btn" style="text-decoration:none;" href="https://www.google.com/maps/search/?api=1&amp;query=' + esc(encodeURIComponent(lat + "," + lng)) + '" target="_blank" rel="noopener">Карта</a>';
  }
  function roleIcon(roleId, size) {
    var url = t("icon_" + roleId);
    var px = size || 17;
    if (url) return '<img src="' + esc(url) + '" alt="" style="width:' + px + 'px;height:' + px + 'px;object-fit:contain;">';
    return ICONS[roleId] || "";
  }
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2200);
  }

  function cartCount() {
    return state.cart.reduce(function (n, i) { return n + i.qty; }, 0);
  }
  function cartTotal() {
    return state.cart.reduce(function (n, i) { return n + i.qty * i.price; }, 0);
  }
  function addToCart(p, weight) {
    var item = state.cart.find(function (i) { return i.tovarId === p.tovarId && Number(i.weight) === Number(weight); });
    if (item) item.qty += 1;
    else state.cart.push({
      tovarId: p.tovarId, name: p.name, pricePerGram: p.price, weight: Number(weight),
      price: Math.round(p.price * weight * 100) / 100, qty: 1, image: p.image || ""
    });
    saveCart();
  }
  function setQty(idx, qty) {
    if (qty <= 0) state.cart.splice(idx, 1);
    else if (state.cart[idx]) state.cart[idx].qty = qty;
    saveCart();
  }
  function setLocalStatus(oid, status) {
    var ord = state.orders.find(function (o) { return String(o.orderId) === String(oid); });
    if (ord) ord.status = status;
  }

  // ---------------- rendering ----------------
  var shell = document.getElementById("shell");

  function render() {
    // Доступ берётся только из базы по Telegram ID (getUserByTelegramId). Старое значение роли
    // из памяти телефона ничего не открывает: его проверяем заново. Исключение: ?demo=1.
    if (DEMO && state.role && !state.perms) applyAccess(presetAccess(["client"]));
    if (!DEMO && state.role && !state.perms) {
      if (!state.telegramId) { state.role = null; localStorage.removeItem("ppm_role"); }
      else {
        if (!state.accessChecking) { state.accessChecking = true; loginById(state.telegramId); }
        renderChecking();
        return;
      }
    }
    // Магазин можно закрыть из ЦУБ (ключ site_locked в листе «Тексты») —
    // блокируется только клиентский вход, сотрудники продолжают работать.
    if (state.role === "client" && t("site_locked") === "1") { renderLocked(); return; }
    if (!state.role) { renderLogin(); return; }
    renderApp();
  }

  function renderChecking() {
    shell.innerHTML =
      '<div class="login">' +
        '<div class="login-head">' +
          '<span class="eyebrow">' + esc(t("app_tagline")) + '</span>' +
          '<div class="mark">' + ICONS.logo + '</div>' +
          '<h1>' + esc(t("app_name")) + '</h1>' +
          '<p>Проверяем доступ…</p>' +
        '</div>' +
      '</div>';
  }

  function renderLocked() {
    shell.innerHTML =
      '<div class="login">' +
        '<div class="login-head">' +
          '<span class="eyebrow">' + esc(t("app_tagline")) + '</span>' +
          '<div class="mark">' + ICONS.logo + '</div>' +
          '<h1>' + esc(t("app_name")) + '</h1>' +
          '<p>' + esc(t("lock_message") || "Магазин временно закрыт. Загляните позже.") + '</p>' +
        '</div>' +
        '<button class="btn-secondary" id="lock-switch">Сменить роль</button>' +
      '</div>';
    document.getElementById("lock-switch").addEventListener("click", changeRole);
  }

  function renderLogin() {
    var idVal = esc(state.telegramId);
    shell.innerHTML =
      '<div class="login">' +
        '<div class="login-head">' +
          '<span class="eyebrow">' + esc(t("app_tagline")) + '</span>' +
          '<div class="mark">' + (t("logo_image") ? '<img src="' + esc(t("logo_image")) + '" alt="" style="width:44px;height:44px;object-fit:contain;">' : ICONS.logo) + '</div>' +
          '<h1>' + esc(t("app_name")) + '</h1>' +
          '<p>' + esc(t("login_subtitle")) + '</p>' +
        '</div>' +
        // Карточки входа без пароля только в демо (?demo=1); обычный вход идёт по Telegram ID
        (DEMO
          ? '<div class="role-list">' +
              ROLES.map(function (r) {
                return '<button class="role-card" data-role="' + esc(r.id) + '">' +
                  '<div class="mark-sm">' + roleIcon(r.icon) + '</div>' +
                  '<div class="body"><div class="label">' + esc(r.label) + '</div><div class="sub">' + esc(r.sub) + '</div></div>' +
                  '<div class="chev">›</div>' +
                '</button>';
              }).join("") +
            '</div>'
          : '') +
        '<div class="id-field">' +
          '<label>Telegram ID' + (tg ? " · определён автоматически" : "") + '</label>' +
          '<input id="tgid-input" type="text" inputmode="numeric" placeholder="Например, 123456789" value="' + idVal + '" ' + (tg && idVal ? "readonly" : "") + ' />' +
          '<button class="btn-primary" id="login-by-id" style="margin-top:10px;">Войти — должность определит база</button>' +
          '<div class="hint">ID сверяется с листом «Пользователи»: сотрудник получает свои разделы, незнакомый ID входит клиентом. Разделы сотрудников работают только при открытии через Telegram-бота — в обычном браузере сервер их не пустит.' + (DEMO ? ' Карточки выше — вход для показа, без базы.' : '') + '</div>' +
        '</div>' +
      '</div>';

    document.getElementById("login-by-id").addEventListener("click", function () {
      var idInput = document.getElementById("tgid-input");
      var idv = idInput ? idInput.value.trim() : "";
      if (!idv) { toast("Введите Telegram ID"); return; }
      var btn = document.getElementById("login-by-id");
      btn.disabled = true; btn.textContent = "Проверяем…";
      loginById(idv);
    });

    shell.querySelectorAll(".role-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!DEMO) return;
        var idInput = document.getElementById("tgid-input");
        var idv = idInput ? idInput.value.trim() : "";
        // Демо: должность выбирается карточкой, в базу ничего не пишется и не читается
        enterAs(presetAccess([btn.getAttribute("data-role")]), idv, false);
      });
    });
  }

  // Вход по базе: должности и разрешения берутся из листов «Должности» и «Пользователи»;
  // незнакомый ID = клиент. Роль и должности со страницы на сервер не передаются.
  function loginById(idv) {
    apiPost("getUserByTelegramId", { telegramId: idv })
      .then(function (res) {
        var acc = res && res.success ? accessFromUser(res.user) : null;
        if (!acc) {
          acc = presetAccess(["client"]);
          if (!(res && res.success && res.user)) {
            apiPost("createOrUpdateUser", { telegramId: idv, name: state.name || "" }).catch(function () {});
          }
        }
        enterAs(acc, idv, !!(res && res.user && res.user.trusted));
        toast(state.role === "client" ? "Вход клиентом" : "Вход: " + ROLE_MAP[state.role].label);
      })
      .catch(function () {
        enterAs(presetAccess(["client"]), idv, false);
        toast("База недоступна — вход клиентом");
      });
  }

  function enterAs(acc, idv, trusted) {
    applyAccess(acc);
    state.accessChecking = false;
    state.telegramId = idv;
    state.trusted = !!trusted;
    state.tab = NAV_BY_ROLE[state.role][0];
    state.ordersLoaded = false;
    state.metrics = null;
    state.sotrudnikiLoaded = false;
    localStorage.setItem("ppm_role", state.role);
    localStorage.setItem("ppm_tgid", idv);
    render();
  }

  function changeRole() {
    state.role = null;
    state.perms = null;
    state.accessChecking = false;
    state.ordersLoaded = false;
    state.metrics = null;
    state.sotrudnikiLoaded = false;
    localStorage.removeItem("ppm_role");
    render();
  }
  // «Смотреть как…» для владельца вне демо: показывает вкладки и кнопки выбранной должности. Только вид:
  // сервер узнаёт человека по подписи Telegram и проверяет права владельца, как обычно. Другим должностям переключателя нет.
  function viewAsCapture_() {
    if (state.viewAs) return;
    state.realAcc = can("people_manage") ? { tid: state.telegramId, positions: state.positions, perms: Object.keys(state.perms) } : null;
  }
  function viewAsSet_(id) {
    var r = state.realAcc;
    if (!r || r.tid !== state.telegramId) return;
    state.viewAs = id || "";
    applyAccess(id ? presetAccess([id]) : { positions: r.positions, perms: r.perms });
    state.tab = NAV_BY_ROLE[state.role][0];
    state.ordersLoaded = false;
    state.metrics = null;
    state.sotrudnikiLoaded = false;
    renderApp();
  }
  function viewAsHTML_() {
    var r = state.realAcc;
    if (DEMO || !r || r.tid !== state.telegramId) return "";
    return '<select class="switch-btn" id="view-as" title="Смотреть как…">' +
      '<option value="">' + (state.viewAs ? "← Я, владелец" : "Смотреть как…") + '</option>' +
      POSITION_PRESETS.filter(function (p) { return p.id !== "owner"; }).map(function (p) {
        return '<option value="' + p.id + '"' + (state.viewAs === p.id ? " selected" : "") + '>' + esc(p.name) + '</option>';
      }).join("") + '</select>';
  }
  function logoutClick_() { state.viewAs = ""; state.realAcc = null; changeRole(); }

  function renderApp() {
    if (!DEMO) viewAsCapture_();
    var tabs = NAV_BY_ROLE[state.role];
    if (!state.tab || tabs.indexOf(state.tab) === -1) state.tab = tabs[0];
    var role = ROLE_MAP[state.role];

    shell.innerHTML =
      '<div class="topbar">' +
        '<div class="avatar">' + roleIcon(role.id, 16) + '</div>' +
        '<div class="who"><div class="name">' + (state.telegramId ? "ID " + esc(state.telegramId) : "Без ID") + '</div><div class="role">' + role.label + (state.viewAs ? ' · просмотр' : '') + '</div></div>' +
        viewAsHTML_() +
        '<button class="switch-btn" id="switch-role">' + (DEMO ? "Сменить роль" : "Выйти") + '</button>' +
      '</div>' +
      '<div class="status-banner" id="status-banner"></div>' +
      '<main id="main"></main>' +
      '<nav class="tabbar">' +
        tabs.map(function (t) {
          var meta = TAB_META[t];
          var badge = (t === "cart" && cartCount() > 0) ? '<span class="badge">' + cartCount() + '</span>' : "";
          return '<button data-tab="' + t + '" class="' + (t === state.tab ? "active" : "") + '">' +
            badge + '<span>' + meta.label + '</span></button>';
        }).join("") +
      '</nav>' +
      '<div class="toast" id="toast"></div>';

    document.getElementById("switch-role").addEventListener("click", DEMO ? changeRole : logoutClick_);
    var va = document.getElementById("view-as");
    if (va) va.addEventListener("change", function () { viewAsSet_(va.value); });
    shell.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        renderApp();
      });
    });

    if (state.apiOk !== null) markApi(state.apiOk);
    else document.getElementById("status-banner").innerHTML = "";

    renderTab();
  }

  function renderTab() {
    var main = document.getElementById("main");
    if (!main) return;
    main.innerHTML = '<div class="empty-state"><span class="eyebrow">Загрузка</span><p>Запрашиваем данные…</p></div>';

    if (state.tab === "svodka") return renderSvodka(main);
    if (state.tab === "catalog") return renderCatalog(main);
    if (state.tab === "cart") return renderCart(main);
    if (state.tab === "orders") return renderOrders(main);
    if (state.tab === "quicksale") return renderQuickSale(main);
    if (state.tab === "products") return renderProducts(main);
    if (state.tab === "delivery") return renderDelivery(main);
    if (state.tab === "sotrudniki") return renderSotrudniki(main);
    if (state.tab === "metrics") return renderMetrics(main);
    if (state.tab === "punkty") return renderPunkty(main);
    if (state.tab === "kassa") return renderKassa(main);
  }

  // Остатки по пунктам выдачи (отдел 03): данные, демо-набор подарков, связь с сервером.
  // Общий блок обеих страниц (витрина и пульт). Контракт: otdely/MVP-1.md, лист «Остатки»
  // (tovar_id, punkt_id, kolichestvo, bron; доступно = kolichestvo - bron), dogovor/03-ostatki.md.
  // Для других отделов: ostatkiLoad(), ostatkiDostupno(rows, tovarId, punktId), ostatokSet(), giftsLoad(),
  // katalogSPunktami(); в демо-режиме зеркало серверных операций: ostatkiDemoZabronirovat, ostatkiDemoSnyatBron,
  // ostatkiDemoVydat, ostatkiDemoPrihod (то же, что zabronirovat_, snyatBron_, spisatVydannoe_, prihodNaPunkt_).
  var OSTATKI_DEMO = /[?&]demo=1/.test(location.search);
  var OSTATKI_DEMO_KEY = "kurier_demo_ostatki";

  // Заглушка списка пунктов, пока блок пунктов (отдел 07, punkty-dannye.js) не подключён в страницу
  var PUNKTY_ZAGLUSHKA_ = [
    { id: "p1", nazvanie: "Пункт 1", adres: "", chasy: "" },
    { id: "p2", nazvanie: "Пункт 2", adres: "", chasy: "" },
    { id: "p3", nazvanie: "Пункт 3", adres: "", chasy: "" },
    { id: "p4", nazvanie: "Пункт 4", adres: "", chasy: "" }
  ];

  // Демо-набор: 8 подарков, цена в донгах. q — сколько на 1-м, 2-м, 3-м, 4-м пункте списка.
  // Набор рассчитан на показ: один товар по одной штуке (последняя штука), один нигде не лежит (уходит из каталога).
  var GIFTS_DEMO_ = [
    { tovarId: 1, name: "Чайный набор в коробке", price: 250000, q: [5, 3, 0, 2] },
    { tovarId: 2, name: "Ароматическая свеча", price: 180000, q: [1, 0, 4, 6] },
    { tovarId: 3, name: "Кружка с гравировкой", price: 220000, q: [0, 2, 2, 1] },
    { tovarId: 4, name: "Шёлковый шарф", price: 450000, q: [1, 1, 0, 0] },
    { tovarId: 5, name: "Открытки ручной работы", price: 90000, q: [10, 8, 6, 4] },
    { tovarId: 6, name: "Кокосовое мыло, подарочная коробка", price: 160000, q: [0, 0, 3, 0] },
    { tovarId: 7, name: "Бамбуковая шкатулка", price: 380000, q: [2, 0, 0, 5] },
    { tovarId: 8, name: "Брелок «Нячанг»", price: 70000, q: [0, 0, 0, 0] }
  ];

  function ostatkiRound_(x) { return Math.round(x * 1000) / 1000; }

  // Цены, изменённые руками в демо, лежат в памяти браузера (общие для витрины и пульта)
  var OSTATKI_DEMO_CENY_KEY = "kurier_demo_ceny";
  function giftPricesDemo_() {
    try { return JSON.parse(localStorage.getItem(OSTATKI_DEMO_CENY_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function giftPriceDemoSet(tovarId, price) {
    var m = giftPricesDemo_();
    m[String(tovarId)] = Number(price);
    try { localStorage.setItem(OSTATKI_DEMO_CENY_KEY, JSON.stringify(m)); } catch (e) {}
  }

  // Подарки для демо в том виде, в каком товары лежат в витрине
  function demoGifts() {
    var over = giftPricesDemo_();
    return GIFTS_DEMO_.map(function (g) {
      var price = isFinite(over[String(g.tovarId)]) && over[String(g.tovarId)] >= 0 ? over[String(g.tovarId)] : g.price;
      return { tovarId: g.tovarId, name: g.name, price: price, stock: g.q.reduce(function (a, b) { return a + b; }, 0), image: "" };
    });
  }

  // Витрина в демо-режиме берёт подарки отсюда, а не из старого набора (другие экраны видят тот же список)
  if (OSTATKI_DEMO && typeof state === "object" && state && "productsLoaded" in state) {
    state.products = demoGifts();
    state.productsLoaded = true;
  }

  // Пункты для остатков: из блока пунктов (отдел 07), если он есть, иначе заглушка. Promise<[{id, nazvanie, adres, chasy}]>
  function ostatkiPunkty() {
    var keep = function (list) { state.punktyDlyaOstatkov = list; return list; };
    if (typeof loadPunkty === "function") {
      return loadPunkty().then(function (list) { return keep(list || []); }).catch(function () { return keep(OSTATKI_DEMO ? PUNKTY_ZAGLUSHKA_.slice() : []); });
    }
    return Promise.resolve(keep(OSTATKI_DEMO ? PUNKTY_ZAGLUSHKA_.slice() : []));
  }

  // ---- демо-хранилище (localStorage, общее для витрины и пульта) ----
  function ostatkiDemoRead_(punkty) {
    var rows = null;
    try { rows = JSON.parse(localStorage.getItem(OSTATKI_DEMO_KEY) || "null"); } catch (e) { rows = null; }
    var ids = (punkty || []).map(function (p) { return String(p.id); });
    var fits = Array.isArray(rows) && rows.some(function (r) { return ids.indexOf(String(r.punkt_id)) !== -1; });
    if (!fits) {
      rows = [];
      GIFTS_DEMO_.forEach(function (g) {
        ids.slice(0, 4).forEach(function (pid, i) {
          if (g.q[i] > 0) rows.push({ tovar_id: String(g.tovarId), punkt_id: pid, kolichestvo: g.q[i], bron: 0 });
        });
      });
      ostatkiDemoWrite_(rows);
    }
    return rows;
  }
  function ostatkiDemoWrite_(rows) {
    try { localStorage.setItem(OSTATKI_DEMO_KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function ostatkiDemoNames_() {
    var m = {};
    GIFTS_DEMO_.forEach(function (g) { m[String(g.tovarId)] = g.name; });
    return m;
  }

  // Строки с посчитанным «доступно». Promise<[{tovar_id, punkt_id, kolichestvo, bron, dostupno}]>
  function ostatkiLoad(punkty) {
    var finish = function (rows) {
      state.ostatki = rows.map(function (r) {
        var k = Number(r.kolichestvo) || 0, b = Number(r.bron) || 0;
        return { tovar_id: String(r.tovar_id), punkt_id: String(r.punkt_id), kolichestvo: k, bron: b, dostupno: ostatkiRound_(k - b) };
      });
      return state.ostatki;
    };
    if (OSTATKI_DEMO) {
      var have = punkty ? Promise.resolve(punkty) : ostatkiPunkty();
      return have.then(function (pl) { return finish(ostatkiDemoRead_(pl)); });
    }
    return apiPost("getOstatki", {}).then(assertOk).then(function (res) {
      if (!res || !Array.isArray(res.data)) throw new Error("bad shape");
      return finish(res.data);
    });
  }

  // Доступно товара на пункте (0, если строки нет)
  function ostatkiDostupno(rows, tovarId, punktId) {
    for (var i = 0; i < rows.length; i++) {
      if (String(rows[i].tovar_id) === String(tovarId) && String(rows[i].punkt_id) === String(punktId)) return rows[i].dostupno;
    }
    return 0;
  }

  // Ручная правка остатка. Promise<строка>. Меньше брони нельзя (так же отвечает сервер).
  function ostatokSet(tovarId, punktId, kol) {
    var q = Number(kol);
    if (String(kol) === "" || kol == null || !isFinite(q) || q < 0) return Promise.reject(new Error("Количество: число от нуля"));
    if (OSTATKI_DEMO) {
      var rows = ostatkiDemoRead_(state.punktyDlyaOstatkov || []), hit = null;
      rows.forEach(function (r) { if (String(r.tovar_id) === String(tovarId) && String(r.punkt_id) === String(punktId)) hit = r; });
      if (hit) {
        if (q < hit.bron - 1e-9) return Promise.reject(new Error("Нельзя поставить меньше брони: забронировано " + hit.bron));
        hit.kolichestvo = ostatkiRound_(q);
      } else {
        hit = { tovar_id: String(tovarId), punkt_id: String(punktId), kolichestvo: ostatkiRound_(q), bron: 0 };
        rows.push(hit);
      }
      ostatkiDemoWrite_(rows);
      return Promise.resolve(hit);
    }
    return apiPost("setOstatok", { tovar_id: tovarId, punkt_id: punktId, kolichestvo: q }).then(assertOk).then(function (res) { return res.data; });
  }

  // Подарки (товары) для экранов: [{tovarId, name, price, image, stock}]. В демо - демо-набор.
  function giftsLoad() {
    if (OSTATKI_DEMO) return Promise.resolve(demoGifts());
    if (typeof loadProducts === "function") return loadProducts();
    return apiPost("getTovary", {}).then(assertOk).then(function (res) {
      return ((res && res.data) || []).map(function (t) { return { tovarId: t.id, name: t.name, price: t.price, stock: t.ostatok, image: t.image || "" }; });
    });
  }

  // Чистая функция каталога: подарки + остатки + активные пункты -> подарки с пунктами.
  // У каждого: punkty = [{id, nazvanie, adres, chasy, dostupno}] только там, где доступно > 0 и пункт активен;
  // stock = сумма доступного. Подарки без единого пункта убираются, если onlyAvailable не false.
  function katalogSPunktami(gifts, rows, punkty, onlyAvailable) {
    var out = [];
    (gifts || []).forEach(function (g) {
      var pl = [], total = 0;
      (punkty || []).forEach(function (p) {
        var d = ostatkiDostupno(rows || [], g.tovarId, p.id);
        if (d > 0) { pl.push({ id: String(p.id), nazvanie: p.nazvanie, adres: p.adres || "", chasy: p.chasy || "", dostupno: d }); total += d; }
      });
      var c = {};
      for (var k in g) c[k] = g[k];
      c.punkty = pl;
      c.stock = ostatkiRound_(total);
      if (pl.length || onlyAvailable === false) out.push(c);
    });
    return out;
  }

  // ---- демо-зеркало серверных операций (для отделов 04, 05, 08 в режиме ?demo=1) ----
  // items: [{tovarId, kolichestvo}] (понимаются и tovar_id/id, qty/quantity); Promise.resolve({success, error?, data?})
  function ostatkiDemoChange_(items, punktId, op) {
    if (!Array.isArray(items) || !items.length) return { success: false, error: "Нет позиций" };
    var pid = String(punktId == null ? "" : punktId).trim();
    if (!pid) return { success: false, error: "Не указан пункт" };
    var sums = {}, order = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      var id = it.tovarId != null ? it.tovarId : (it.tovar_id != null ? it.tovar_id : it.id);
      var raw = it.kolichestvo != null ? it.kolichestvo : (it.qty != null ? it.qty : (it.quantity != null ? it.quantity : 1));
      var n = Number(raw);
      if (id == null || id === "") return { success: false, error: "У позиции нет товара" };
      if (!isFinite(n) || n <= 0) return { success: false, error: "Количество должно быть больше нуля" };
      var key = String(id);
      if (!(key in sums)) { sums[key] = 0; order.push(key); }
      sums[key] = ostatkiRound_(sums[key] + n);
    }
    var rows = ostatkiDemoRead_(state.punktyDlyaOstatkov || []);
    var names = ostatkiDemoNames_(), unit = (typeof unitShort === "function" ? unitShort() : "") || "шт";
    var plan = [];
    for (var j = 0; j < order.length; j++) {
      var tid = order[j], n2 = sums[tid], row = null;
      rows.forEach(function (r) { if (String(r.tovar_id) === tid && String(r.punkt_id) === pid) row = r; });
      var name = names[tid] || ("товар " + tid);
      if (!row) {
        if (op !== "prihod") return { success: false, error: "«" + name + "» на этом пункте нет" };
        row = { tovar_id: tid, punkt_id: pid, kolichestvo: 0, bron: 0, fresh: true };
      }
      var c = { ref: row, kolichestvo: row.kolichestvo, bron: row.bron };
      if (op === "bron") {
        var free = ostatkiRound_(c.kolichestvo - c.bron);
        if (n2 > free + 1e-9) return { success: false, error: "Не хватает «" + name + "» на пункте: доступно " + free + " " + unit + ", нужно " + n2 };
        c.bron += n2;
      } else if (op === "snyat") {
        c.bron = Math.max(0, c.bron - n2);
      } else if (op === "vydat") {
        if (n2 > c.kolichestvo + 1e-9) return { success: false, error: "На пункте нет столько «" + name + "»: есть " + c.kolichestvo + " " + unit + ", нужно " + n2 };
        c.kolichestvo -= n2;
        c.bron = Math.max(0, c.bron - n2);
      } else if (op === "prihod") {
        c.kolichestvo += n2;
      }
      plan.push(c);
    }
    plan.forEach(function (c) {
      c.ref.kolichestvo = ostatkiRound_(c.kolichestvo);
      c.ref.bron = ostatkiRound_(c.bron);
      if (c.ref.fresh) { delete c.ref.fresh; rows.push(c.ref); }
    });
    ostatkiDemoWrite_(rows);
    return { success: true };
  }
  function ostatkiDemoZabronirovat(items, punktId) { return ostatkiDemoChange_(items, punktId, "bron"); }
  function ostatkiDemoSnyatBron(items, punktId) { return ostatkiDemoChange_(items, punktId, "snyat"); }
  function ostatkiDemoVydat(items, punktId) { return ostatkiDemoChange_(items, punktId, "vydat"); }
  function ostatkiDemoPrihod(items, punktId) { return ostatkiDemoChange_(items, punktId, "prihod"); }

  // Панель «Остатки по пунктам» (отдел 03): одна и та же на экране склада витрины и во вкладке «Товары» пульта.
  // Данные и связь с сервером: ostatki-dannye.js. Загрузка: ostatkiPanelLoad() -> Promise<{gifts, punkty, rows}>.
  function ostatkiPanelLoad() {
    return Promise.all([giftsLoad(), ostatkiPunkty()]).then(function (r) {
      return ostatkiLoad(r[1]).then(function (rows) { return { gifts: r[0], punkty: r[1], rows: rows }; });
    });
  }
  function ostatkiRow_(d, g, p) {
    for (var i = 0; i < d.rows.length; i++) {
      if (String(d.rows[i].tovar_id) === String(g) && String(d.rows[i].punkt_id) === String(p)) return d.rows[i];
    }
    return null;
  }
  // Поля берут цвета темы (в пульте у голого input иначе белый фон)
  var OSTATKI_INPUT_STYLE_ = "background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font:inherit;text-align:right;";
  // opts: { canStock, canPrice }
  function ostatkiPanelHTML(d, opts) {
    var priceLabel = "Цена" + (currencySym() ? ", " + esc(currencySym()) : "") + (unitShort() ? "/" + esc(unitShort()) : "");
    return (!d.punkty.length
        ? '<div class="empty-state"><span class="eyebrow">Пунктов нет</span><p>Остатки хранятся по пунктам выдачи. Пункты ставит картограф.</p></div>'
        : '') +
      (!d.gifts.length ? '<div class="empty-state"><span class="eyebrow">' + esc(t("pub_item_many")) + '</span><p>' + esc(t("empty_catalog")) + '</p></div>' : '') +
      d.gifts.map(function (g) {
        var total = d.punkty.reduce(function (n, p) { var r = ostatkiRow_(d, g.tovarId, p.id); return n + (r ? r.dostupno : 0); }, 0);
        return '<div class="card" style="margin-bottom:12px;" data-g="' + esc(g.tovarId) + '">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
            '<div><div class="name" style="font-weight:600;">' + esc(g.name) + '</div><div class="sku">ID ' + esc(g.tovarId) + ' · всего доступно <span data-total="' + esc(g.tovarId) + '">' + fmtQty(total) + '</span></div></div>' +
            '<div style="text-align:right;"><span class="eyebrow">' + priceLabel + '</span><br>' +
            '<input class="editable" data-price="' + esc(g.tovarId) + '" type="number" min="0" step="any" value="' + Number(g.price) + '"' + (opts.canPrice ? "" : " disabled") + ' style="width:100px;' + OSTATKI_INPUT_STYLE_ + '" /></div>' +
          '</div>' +
          d.punkty.map(function (p) {
            var r = ostatkiRow_(d, g.tovarId, p.id);
            return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);">' +
              '<div style="min-width:0;"><div class="name">' + esc(p.nazvanie) + '</div>' +
                '<div class="sku" data-info="' + esc(g.tovarId) + '|' + esc(p.id) + '">в брони ' + fmtQty(r ? r.bron : 0) + ' · доступно ' + fmtQty(r ? r.dostupno : 0) + '</div></div>' +
              '<input class="editable" data-stock="' + esc(g.tovarId) + '" data-punkt="' + esc(p.id) + '" type="number" min="0" step="' + qtyStep() + '" value="' + (r ? r.kolichestvo : 0) + '"' + (opts.canStock ? "" : " disabled") + ' style="width:90px;' + OSTATKI_INPUT_STYLE_ + '" />' +
            '</div>';
          }).join("") +
        '</div>';
      }).join("");
  }
  // opts: { savePrice(tovarId, price) -> Promise }
  function ostatkiPanelBind(root, d, opts) {
    root.querySelectorAll("[data-stock]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var g = inp.getAttribute("data-stock"), p = inp.getAttribute("data-punkt");
        var before = ostatkiRow_(d, g, p);
        ostatokSet(g, p, inp.value).then(function (res) {
          var k = Number(res.kolichestvo), b = Number(res.bron) || 0;
          if (before) { before.kolichestvo = k; before.bron = b; before.dostupno = ostatkiRound_(k - b); }
          else d.rows.push({ tovar_id: String(g), punkt_id: String(p), kolichestvo: k, bron: b, dostupno: ostatkiRound_(k - b) });
          var cur = ostatkiRow_(d, g, p);
          var info = root.querySelector('[data-info="' + g + "|" + p + '"]');
          if (info && cur) info.textContent = "в брони " + fmtQty(cur.bron) + " · доступно " + fmtQty(cur.dostupno);
          var tot = root.querySelector('[data-total="' + g + '"]');
          if (tot) tot.textContent = fmtQty(d.punkty.reduce(function (n, pp) { var r = ostatkiRow_(d, g, pp.id); return n + (r ? r.dostupno : 0); }, 0));
          toast("Сохранено");
        }).catch(function (err) {
          inp.value = before ? before.kolichestvo : 0;
          toast(err && err.message ? err.message : "Не удалось сохранить");
        });
      });
    });
    root.querySelectorAll("[data-price]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-price"), val = Number(inp.value);
        if (!(val >= 0)) { toast("Цена: число от нуля"); return; }
        var p = opts.savePrice ? opts.savePrice(id, val) : Promise.reject(new Error("Цену здесь менять нельзя"));
        p.then(function () { toast("Сохранено"); }).catch(function (err) { toast(err && err.message ? err.message : "Не удалось сохранить цену"); });
      });
    });
  }
  // Сохранение цены: в демо в памяти браузера, иначе действие updateTovaryPrice
  function giftPriceSave(tovarId, price) {
    if (OSTATKI_DEMO) { giftPriceDemoSet(tovarId, price); return Promise.resolve(); }
    return apiPost("updateTovaryPrice", { tovarId: tovarId, newPrice: price }).then(assertOk).then(function () {
      if (state.products) state.products.forEach(function (p) { if (String(p.tovarId) === String(tovarId)) p.price = price; });
    });
  }
  // Каталог клиента (отдел 03). Подарок показывает, в каких пунктах выдачи он есть (доступно больше нуля).
  // Пункт без остатка у подарка не показывается, подарок без остатков нигде уходит из каталога.
  // В корзину подарок кладётся уже с пунктом: поле punktId (и punktName) у позиции, в корзине один пункт.
  var catalogPunkt_ = ""; // выбранный фильтр по пункту, пусто = все пункты

  function addGiftToCart_(p, punkt) {
    var other = state.cart.some(function (i) { return String(i.punktId || "") !== String(punkt.id); });
    if (other) { toast("В корзине подарки из другого пункта: оформите их или очистите корзину"); return false; }
    var item = state.cart.find(function (i) { return String(i.tovarId) === String(p.tovarId) && String(i.punktId) === String(punkt.id); });
    if (item) {
      if (item.qty + 1 > punkt.dostupno) { toast("Больше нет в этом пункте: доступно " + fmtQty(punkt.dostupno)); return false; }
      item.qty += 1;
    } else {
      state.cart.push({
        tovarId: p.tovarId, name: p.name, pricePerGram: p.price, weight: 1, price: p.price, qty: 1,
        image: p.image || "", punktId: String(punkt.id), punktName: punkt.nazvanie
      });
    }
    saveCart();
    toast("В корзине: " + p.name + " · " + punkt.nazvanie);
    return true;
  }

  function renderCatalog(main) {
    Promise.all([giftsLoad(), ostatkiPunkty()]).then(function (r) {
      return ostatkiLoad(r[1]).then(function (rows) { return { gifts: r[0], punkty: r[1], rows: rows }; });
    }).then(function (d) {
      if (state.tab !== "catalog") return;
      var all = katalogSPunktami(d.gifts, d.rows, d.punkty);
      if (!all.length) {
        main.innerHTML = '<div class="empty-state"><span class="eyebrow">' + esc(t("catalog_title")) + '</span><p>' + esc(t("empty_catalog")) + '</p></div>';
        return;
      }

      var seen = {}, chips = [];
      all.forEach(function (p) { p.punkty.forEach(function (x) { if (!seen[x.id]) { seen[x.id] = true; chips.push(x); } }); });
      if (catalogPunkt_ && !seen[catalogPunkt_]) catalogPunkt_ = "";
      var list = all.filter(function (p) { return !catalogPunkt_ || p.punkty.some(function (x) { return x.id === catalogPunkt_; }); });
      var isClient = can("order_create") && !can("orders_view");
      var pmap = {};
      d.punkty.forEach(function (p) { pmap[String(p.id)] = p; });

      main.innerHTML =

          '<button class="chip' + (catalogPunkt_ ? "" : " active") + '" data-pf="">Все пункты</button>' +
          chips.map(function (x) {

          }).join("") +

        list.map(function (p) {

          // место клиента известно (кнопка «Рядом со мной»): ближайший пункт сверху, у каждого расстояние
          if (state.clientGeo && typeof punktDistanceM === "function") {
            shown = shown.map(function (x) {
              var c = {}; for (var k in x) c[k] = x[k];
              c.dist = punktDistanceM(pmap[x.id], state.clientGeo.lat, state.clientGeo.lng);
              return c;
            }).sort(function (a, b) { return (a.dist == null ? 1e12 : a.dist) - (b.dist == null ? 1e12 : b.dist); });
          }
          var total = shown.reduce(function (n, x) { return n + x.dostupno; }, 0);

          return '<div class="product" data-g="' + esc(p.tovarId) + '">' +

            '<div class="name">' + esc(p.name) + '</div>' +
            '<div class="meta"><span class="price">' + unitPrice(p.price) + '</span><span class="stock ' + (low ? "low" : "") + '">' + fmtQty(total) + '</span></div>' +
            '<div class="eyebrow" style="margin:8px 0 4px;">Есть в пунктах</div>' +
            shown.map(function (x, n) {
              var label = '<span style="font-weight:600;">' + esc(x.nazvanie) + '</span> · ' + fmtQty(x.dostupno) +
                (x.dist != null ? ' · ' + esc(bronDistLabel_(x.dist)) + (n === 0 ? ' · ближайший' : '') : '') +
                (x.adres ? '<span style="display:block;font-size:11px;color:var(--muted);">' + esc(x.adres) + (x.chasy ? " · " + esc(x.chasy) : "") + '</span>' : "");
              return isClient
                ? '<button class="chip" style="display:block;width:100%;text-align:left;margin-bottom:4px;" data-add="' + esc(p.tovarId) + '" data-punkt="' + esc(x.id) + '">' + label + '</button>'
                : '<div style="font-size:12px;margin-bottom:4px;">' + label + '</div>';
            }).join("") +

        }).join("") +

      main.querySelector("[data-geo]").addEventListener("click", function () {

        clientGeoAsk().then(function () { renderCatalog(main); }).catch(function (e) { toast(e && e.message ? e.message : "Не удалось определить место"); });
      });
      main.querySelectorAll("[data-pf]").forEach(function (b) {
        b.addEventListener("click", function () { catalogPunkt_ = b.getAttribute("data-pf"); renderCatalog(main); });
      });
      main.querySelectorAll("[data-add]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var p = all.find(function (x) { return String(x.tovarId) === btn.getAttribute("data-add"); });
          var punkt = p && p.punkty.find(function (x) { return x.id === btn.getAttribute("data-punkt"); });
          if (!p || !punkt) return;
          // выбрал пункт: сразу экран оформления с карточкой пункта и кнопкой «Забронировать»
          if (addGiftToCart_(p, punkt)) { state.tab = "cart"; renderApp(); }

      main.innerHTML = '<div class="empty-state"><span class="eyebrow">' + esc(t("catalog_title")) + '</span><p>' + esc(e && e.message ? e.message : "Не удалось загрузить") + '</p></div>';
    });
  }
  // Оформление с бронью в пункте выдачи (отдел 04, MVP-1): корзина с одним пунктом, карточка пункта до брони
  // (название, адрес, часы, фото, «Маршрут»), кнопка «Забронировать», экран с кодом выдачи и сроком брони.
  // Оплата одна: наличными при получении. Сервер: createOrder с punkt_id (server/04-korzina-i-oformlenie.gs).
  // В ?demo=1 весь путь идёт без сервера: бронь считает demoBookPickup_ через демо-склад отдела 03.
  // Старое оформление (доставка до двери, зоны, оплата по скрину) осталось в pokupatel-korzina.js и включается
  // настройкой pub_legacy_checkout = 1.
  var BRON_NHA_TRANG_ = { lat: 12.2388, lng: 109.1967 };
  var BRON_KOD_ALPHABET_ = "23456789ABCDEFGHJKMNPQRSTUVWXYZ";

  function bronLegacyOn_() { return String(t("pub_legacy_checkout") || "").trim() === "1"; }
  function bronDemoMax_() {
    var n = Math.floor(Number(String(t("pub_bron_max_active") || "").trim()));
    return n >= 1 && n <= 50 ? n : 2;
  }
  function bronHours_() {
    var h = Number(String(t("pub_bron_hours") || "").trim());
    return h > 0 && h <= 720 ? h : 24;
  }
  function bronRouteUrl(p) {
    if (!p || p.lat === "" || p.lng === "" || p.lat == null || p.lng == null || !isFinite(Number(p.lat)) || !isFinite(Number(p.lng))) return "";
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(Number(p.lat) + "," + Number(p.lng));
  }
  function bronDt_(iso) {
    try { return new Date(iso).toLocaleString("ru-RU", { day: "2-digit", month: "long", hour: "2-digit", minute: "2-digit" }); } catch (e) { return String(iso || ""); }
  }
  function bronKod_(taken) {
    for (var n = 0; n < 50; n++) {
      var k = "";
      for (var i = 0; i < 6; i++) k += BRON_KOD_ALPHABET_.charAt(Math.floor(Math.random() * BRON_KOD_ALPHABET_.length));
      if (taken.indexOf(k) === -1) return k;
    }
    return "ZZZZZZ";
  }

  // Место клиента для «ближайший пункт сверху»: спрашиваем только по нажатию, не при открытии. В демо без разрешения берётся центр Нячанга.
  function clientGeoAsk() {
    if (state.clientGeo) return Promise.resolve(state.clientGeo);
    return new Promise(function (resolve, reject) {
      var fallback = function () {
        if (DEMO) { state.clientGeo = { lat: BRON_NHA_TRANG_.lat, lng: BRON_NHA_TRANG_.lng, demo: true }; resolve(state.clientGeo); }
        else reject(new Error("Не удалось определить, где вы. Разрешите доступ к геопозиции"));
      };
      if (!(typeof navigator !== "undefined" && navigator.geolocation)) return fallback();
      navigator.geolocation.getCurrentPosition(function (pos) {
        state.clientGeo = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        resolve(state.clientGeo);
      }, fallback, { enableHighAccuracy: false, timeout: 6000 });
    });
  }
  function bronDistLabel_(m) {
    if (m == null) return "";
    return m < 1000 ? Math.round(m / 10) * 10 + " м" : (Math.round(m / 100) / 10).toString().replace(".", ",") + " км";
  }

  // Бронь в демо: те же правила, что на сервере (лимит броней, отказ при нехватке, код, срок). Promise<ответ createOrder>
  function demoBookPickup_(d) {
    var cart = d.cart || [];
    return Promise.all([ostatkiPunkty(), loadOrders()]).then(function (r) {
      var punkt = null;
      r[0].forEach(function (p) { if (String(p.id) === String(d.punktId)) punkt = p; });
      if (!punkt) return { success: false, error: "Этот пункт сейчас недоступен, выберите другой" };
      if (!cart.length) return { success: false, error: "В заказе нет позиций" };
      var list = r[1];
      if (typeof seedPickupDemo === "function") seedPickupDemo(list);
      var now = Date.now(), max = bronDemoMax_();
