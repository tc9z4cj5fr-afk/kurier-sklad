        deliveryType: deliveryType,
        paymentMethod: payMethod
      };
      if (deliveryType === "courier") {
        payload.latitude = parseFloat(document.getElementById("geo-lat").value);
        payload.longitude = parseFloat(document.getElementById("geo-lng").value);
      }
      apiPost("createOrder", payload)
        .then(assertOk)
        .then(function () {
          toast(payMethod === "cash" ? "Заказ оформлен" : "Заказ оформлен — оплатите его в списке заказов");
          state.cart = [];
          saveCart();
          state.ordersLoaded = false;
          state.tab = "orders";
          renderApp();
        })
        .catch(function (err) {
          // при ошибке (в т.ч. недостаче остатка или отказе «только доверенным») корзину не чистим
          toast(err && err.message ? err.message : "Не удалось отправить заказ");
          btn.disabled = false;
          btn.textContent = t("checkout_button") + " · " + money(cartTotal());
        });
    });
  }

  // Самовывоз из пункта на экране заказов (отдел 05, MVP-1): блок пункта, код и срок брони, выдача по коду,
  // отмена брони. Экран заказов (zakazy.js) зовёт эти функции. Статусы и демо-заказы — yadro-statusy-zakaza.js.

  // Кто есть кто на экране заказов: по разрешениям (отдел 01), не по старой роли
  function ordersIsClient() { return can("order_create") && !can("orders_view"); }
  // Выдать заказ по коду: владелец, курьер, хозяин пункта. До правки отдела 01 разрешения orders_issue
  // у владельца и курьера в странице нет, поэтому им хватает people_manage (владелец) и courier_work (курьер).
  function canIssue() { return can("orders_issue") || can("people_manage") || can("courier_work"); }

  function pickupTime(iso) {
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
    } catch (e) { return ""; }
  }
  // «осталось 19 ч 40 мин» или «срок вышел»
  function bronLeft(iso) {
    var ms = new Date(iso).getTime() - Date.now();
    if (isNaN(ms)) return "";
    if (ms <= 0) return "срок вышел";
    var m = Math.floor(ms / 60000), hh = Math.floor(m / 60);
    return "осталось " + (hh ? hh + " ч " : "") + (m % 60) + " мин";
  }
  function pickupMapHref(o) {
    if (o.punktLat == null || o.punktLng == null || o.punktLat === "" || o.punktLng === "") return "";
    return '<a class="act-btn" style="text-decoration:none;" href="https://www.google.com/maps/search/?api=1&amp;query=' + esc(encodeURIComponent(o.punktLat + "," + o.punktLng)) + '" target="_blank" rel="noopener">Карта</a>';
  }

  // Блок самовывоза в карточке заказа: пункт, адрес, часы, код и срок брони (клиент), ввод кода (выдающий)
  function pickupBlock(o, isClient, issuer) {
    var s = 'font-size:12px;color:var(--muted);';
    var h = '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">';
    h += '<div style="font-size:13px;font-weight:600;">Пункт выдачи: ' + esc(o.punktNazvanie || "пункт " + (o.punktId || "")) + '</div>';
    h += '<div style="' + s + 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>' + esc(o.punktAdres || "") + (o.punktChasy ? " · часы: " + esc(o.punktChasy) : "") + '</span>' + pickupMapHref(o) + '</div>';
    if (o.tovary && o.tovary.length) {
      h += '<div style="' + s + '">' + o.tovary.map(function (i) { return esc(i.name || ("№" + i.tovarId)) + " × " + (Number(i.quantity) || 1); }).join(", ") + '</div>';
    }
    if (o.status === "zabronirovan") {
      if (isClient && o.kodVydachi) {
        h += '<div style="margin:8px 0 2px;"><div style="' + s + '">Код выдачи: назовите его в пункте</div>' +
          '<div style="font-family:monospace;font-size:26px;font-weight:700;letter-spacing:0.18em;">' + esc(o.kodVydachi) + '</div></div>';
      }
      if (o.bronDo) h += '<div style="' + s + '">Бронь до ' + esc(pickupTime(o.bronDo)) + ' · ' + esc(bronLeft(o.bronDo)) + '</div>';
      if (issuer) {
        var cashNeeded = (o.payMethod || "cash") === "cash" && o.payStatus !== "Оплачено";
        h += '<div class="field" style="margin:10px 0 4px;"><label>Код от клиента</label>' +
          '<input class="issue-kod" maxlength="10" autocomplete="off" autocapitalize="characters" placeholder="например, K7M2QX" style="font-family:monospace;letter-spacing:0.1em;" /></div>' +
          (cashNeeded ? '<label style="display:flex;gap:8px;align-items:center;font-size:13px;margin:4px 0 8px;"><input type="checkbox" class="issue-cash" /> Получено наличными: ' + money(o.total) + '</label>' : '') +
          (DEMO && o.kodVydachi ? '<div style="' + s + 'margin-bottom:6px;">Демо: код этого заказа ' + esc(o.kodVydachi) + '</div>' : '') +
          '<button class="act-btn" data-act="issue">Выдано</button> ';
      }
    } else if (o.status === "vydan") {
      h += '<div style="' + s + '">Заказ выдан клиенту</div>';
    } else if (o.status === "otmenen") {
      h += '<div style="' + s + '">Бронь отменена, товар вернулся на пункт</div>';
    } else if (o.status === "bron_istekla") {
      h += '<div style="' + s + '">Срок брони вышел, товар вернулся на пункт</div>';
    }
    return h + '</div>';
  }

  // Выдача и отмена брони. В демо всё считается здесь, на странице (с теми же правилами, что на сервере);
  // иначе зовём vydatPoKodu и otmenitBron.
  function demoNormKod(s) { return String(s == null ? "" : s).toUpperCase().replace(/[\s\-]/g, ""); }
  function issueOrder(o, kod, cash) {
    if (DEMO && o.demoPickup) {
      if (o.status !== "zabronirovan") return Promise.reject(new Error("Заказ уже закрыт"));
      if ((o._fails || 0) >= 5) return Promise.reject(new Error("Слишком много неверных попыток. Подождите 15 минут"));
      if (demoNormKod(kod) !== demoNormKod(o.kodVydachi)) {
        o._fails = (o._fails || 0) + 1;
        return Promise.reject(new Error("Неверный код. Осталось попыток: " + (5 - o._fails)));
      }
      var needCash = (o.payMethod || "cash") === "cash" && o.payStatus !== "Оплачено";
      if (needCash && !cash) return Promise.reject(new Error("Отметьте, что получили наличные"));
      o.status = "vydan"; o.payStatus = "Оплачено"; o.kodVydachi = "";
      // наличные ложатся на счёт пункта (касса, отдел 09)
      if (needCash && typeof kassaDemoVnesti === "function") kassaDemoVnesti(o.punktId, o.orderId, o.total);
      return Promise.resolve({ success: true });
    }
    return apiPost("vydatPoKodu", { orderId: o.orderId, kod: kod, cash: cash }).then(assertOk);
  }
  function cancelBron(o) {
    if (DEMO && o.demoPickup) {
      if (o.status !== "zabronirovan") return Promise.reject(new Error("Бронь уже закрыта"));
      o.status = "otmenen"; o.kodVydachi = "";
      return Promise.resolve({ success: true });
    }
    return apiPost("otmenitBron", { orderId: o.orderId }).then(assertOk);
  }

  // Реквизиты и загрузка скрина — для неоплаченных заказов клиента (QR/USDT)
  function payBlockClient(o) {
    if (o.payMethod === "cash" || !o.payStatus) return "";
    var pi = state.payInfo || {};
    if (o.payStatus !== "Не оплачено") return "";
    var req = "";
    var copyVal = "";
    var newCode = ({ qr: "qr_vn", usdt: "crypto" })[o.payMethod] || o.payMethod;
    if (pi.details && pi.details[newCode]) {
      // способы волны Б (QR Вьетнам, Казахстан, Россия, криптовалюта): реквизиты берутся из getPaymentInfo.details
      req = payDetailsHTML(pi, newCode) || '<div style="font-size:12px;color:var(--muted);">Реквизиты ещё не заполнены — свяжитесь с продавцом</div>';
      var firstField = pi.details[newCode].fields.filter(function (f) { return f.value && !/^https?:/.test(f.value); })[0];
      copyVal = firstField ? firstField.value : "";
    } else if (o.payMethod === "qr") {
      copyVal = pi.bankDetails || "";
      req = (pi.qrImage ? '<img src="' + esc(pi.qrImage) + '" alt="QR для оплаты" style="max-width:180px;border-radius:8px;display:block;margin:6px 0;">' : "") +
        (pi.bankDetails ? '<div style="font-size:12px;white-space:pre-line;">' + esc(pi.bankDetails) + '</div>' : '<div style="font-size:12px;color:var(--muted);">Реквизиты ещё не заполнены — свяжитесь с продавцом</div>');
    } else {
      copyVal = pi.usdtAddress || "";
      req = pi.usdtAddress
        ? '<div style="font-size:12px;">Кошелёк USDT' + (pi.usdtNetwork ? " (" + esc(pi.usdtNetwork) + ")" : "") + ':</div><div style="font-size:12px;word-break:break-all;font-family:monospace;">' + esc(pi.usdtAddress) + '</div>'
        : '<div style="font-size:12px;color:var(--muted);">Адрес кошелька ещё не заполнен — свяжитесь с продавцом</div>';
    }
    return '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px;">' +
      '<div style="font-size:12px;font-weight:600;margin-bottom:2px;">Оплата: ' + (PAY_METHOD_LABEL[o.payMethod] || o.payMethod) + ' · ' + money(o.total) + '</div>' +
      convertHint(Number(o.total) || 0, o.payMethod) +
      req +
      '<div class="row-actions" style="margin-top:8px;">' +
        (copyVal ? '<button class="act-btn" data-act="pay-copy" data-copy="' + esc(copyVal) + '">Копировать реквизиты</button>' : '') +
      '</div>' +
      '<div class="field" style="margin:8px 0 0;"><label>Скрин оплаты</label><input type="file" accept="image/*" class="pay-file" /></div>' +
      '<button class="act-btn" data-act="pay-send" style="margin-top:6px;">Отправить скрин</button>' +
    '</div>';
  }

  // Кнопка «Задать вопрос магазину» у клиента: ведёт в чат с ботом, где вопрос
  // пересылается владельцу/продавцу. Появляется, когда чат включён на сервере
  // (setupClientChat ставит chat_enabled=1 в «Текстах»).
  function askShopButton() {
    if (!ordersIsClient()) return "";
    if (t("chat_enabled") !== "1" || !t("bot_main_username")) return "";
    return '<div style="margin:-4px 0 12px;"><a class="act-btn" href="https://t.me/' + esc(t("bot_main_username")) + '" target="_blank" rel="noopener">Задать вопрос магазину</a></div>';
  }

  function renderOrders(main) {
    Promise.all([loadOrders(), loadPayInfo()]).then(function (rs) {
      var list = rs[0];
      if (state.tab !== "orders") return;
      seedPickupDemo(list);
      if (!list.length) {
        main.innerHTML = '<div class="screen-title-row"><div class="screen-title">' + esc(t("orders_title")) + '</div></div>' + askShopButton() + '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Заказов пока нет</p></div>';
        return;
      }
      var isOwner = can("orders_manage");
      var isSeller = can("payment_confirm");
      var isClient = ordersIsClient();
      var issuer = canIssue();
      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">' + esc(t("orders_title")) + '</div><div class="screen-sub">' + list.length + ' записей</div></div>' +
        askShopButton() +
        '<div class="row-list">' +
        list.map(function (o) {
          var sm = statusMeta(o.status);
          var clientInfo = "";
          if (isClient) {
            if ((o.status === "Курьер выбран" || o.status === "В пути") && o.courierName) {
              clientInfo += '<div style="font-size:12px;color:var(--muted);">Курьер: ' + esc(o.courierName) + ' · выполнено доставок: ' + (Number(o.courierDeliveries) || 0) + ' · ожидание: ' + esc(o.zoneNote || "2–3 часа") + '</div>';
            }
            if (o.deliveryType === "pickup" && !isPickupOrder(o) && CANCELLABLE_STATUSES.indexOf(o.status) !== -1) {
              clientInfo += '<div style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span>Самовывоз: ' + esc(t("pickup_address")) + '</span>' + pickupMapLink() + '</div>';
            }
          }
          var psm = PAY_STATUS_META[o.payStatus];
          var pickup = isPickupOrder(o);
          return '<div class="row-card" data-oid="' + esc(o.orderId) + '">' +
            '<div class="row-top"><span class="id">№ ' + esc(o.orderId) + '</span><span class="date">' + fmtDate(o.date) + '</span></div>' +
            '<div class="row-sum"><span class="addr">' + esc(pickup ? (o.punktNazvanie || "Самовывоз из пункта") : (o.address || "")) + '</span><span class="amt">' + money(o.total) + '</span></div>' +
            (pickup ? pickupBlock(o, isClient, issuer) : '') +
            clientInfo +
            (isClient ? payBlockClient(o) : '') +
            '<div class="row-actions">' +
              '<span class="pill ' + sm.cls + '"><span class="dot"></span>' + sm.label + '</span>' +
              (psm ? '<span class="pill ' + psm.cls + '"><span class="dot"></span>' + (PAY_METHOD_LABEL[o.payMethod] || o.payMethod) + ' · ' + psm.label + '</span>' : '') +
              ((isOwner || isSeller) && o.payProof
                ? '<a class="act-btn" href="' + esc(o.payProof) + '" target="_blank" rel="noopener">Скрин оплаты</a>' : '') +
              ((isOwner || isSeller) && (o.payStatus === "Ожидает подтверждения" || o.payStatus === "Не оплачено")
                ? '<button class="act-btn" data-act="pay-confirm">Оплата подтверждена</button>' : '') +
              (isOwner && !pickup ? '<select data-act="status">' +
                Object.keys(STATUS_META).filter(function (k) { return PICKUP_STATUSES.indexOf(k) === -1; }).map(function (k) {
                  return '<option value="' + k + '"' + (k === o.status ? " selected" : "") + '>' + STATUS_META[k].label + '</option>';
                }).join("") + '</select>' : '') +
              ((isClient || isOwner) && o.status === "zabronirovan"
                ? '<button class="act-btn danger" data-act="cancel-bron">Отменить бронь</button>' : '') +
              (isClient && !pickup && CANCELLABLE_STATUSES.indexOf(o.status) !== -1
                ? '<button class="act-btn danger" data-act="cancel">Отменить заказ</button>' : '') +
              (isClient && ["Успех", "Не успех", "Отменено", "vydan", "otmenen", "bron_istekla"].indexOf(o.status) !== -1
                ? '<button class="act-btn" data-act="repeat">Повторить</button>' : '') +
              (isOwner && o.status === "Отменено"
                ? '<button class="act-btn" data-act="refund">Возврат реализован</button>' : '') +
            '</div>' +
          '</div>';
        }).join("") +
        '</div>';

      // самовывоз: выдача по коду и отмена брони
      function orderOf(el) {
        var oid = el.closest(".row-card").getAttribute("data-oid");
        return list.find(function (x) { return String(x.orderId) === String(oid); });
      }
      main.querySelectorAll("[data-act=issue]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var card = btn.closest(".row-card"), o = orderOf(btn);
          if (!o) return;
          var kod = (card.querySelector(".issue-kod").value || "").trim();
          var cashEl = card.querySelector(".issue-cash");
          if (!kod) { toast("Введите код от клиента"); return; }
          btn.disabled = true;
          issueOrder(o, kod, !!(cashEl && cashEl.checked))
            .then(function () { toast("Выдано"); state.ordersLoaded = !!DEMO; setLocalStatus(o.orderId, "vydan"); renderApp(); })
            .catch(function (err) { toast(err && err.message ? err.message : "Не удалось выдать"); btn.disabled = false; });
        });
      });
      main.querySelectorAll("[data-act=cancel-bron]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var o = orderOf(btn);
          if (!o) return;
          btn.disabled = true;
          cancelBron(o)
            .then(function () { toast("Бронь отменена, товар вернулся на пункт"); state.ordersLoaded = !!DEMO; setLocalStatus(o.orderId, "otmenen"); renderApp(); })
            .catch(function (err) { toast(err && err.message ? err.message : "Не удалось отменить"); btn.disabled = false; });
        });
      });

      if (isOwner) {
        main.querySelectorAll("[data-act=status]").forEach(function (sel) {
          sel.addEventListener("change", function () {
            var oid = sel.closest(".row-card").getAttribute("data-oid");
            apiPost("updateOrderStatus", { orderId: oid, status: sel.value })
              .then(assertOk)
              .then(function () { toast("Статус обновлён"); })
              .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
              .then(function () { setLocalStatus(oid, sel.value); renderApp(); });
          });
        });
        main.querySelectorAll("[data-act=refund]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var oid = btn.closest(".row-card").getAttribute("data-oid");
            btn.disabled = true;
            apiPost("completeRefund", { orderId: oid })
              .then(assertOk)
              .then(function () { toast("Возврат оформлен"); })
              .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
              .then(function () { setLocalStatus(oid, "Не успех"); renderApp(); });
          });
        });
      }
      if (isOwner || isSeller) {
        main.querySelectorAll("[data-act=pay-confirm]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var oid = btn.closest(".row-card").getAttribute("data-oid");
            btn.disabled = true;
            apiPost("confirmPayment", { orderId: oid })
              .then(assertOk)
              .then(function () { toast("Оплата подтверждена"); state.ordersLoaded = false; renderApp(); })
              .catch(function (err) { toast(err && err.message ? err.message : "Ошибка"); btn.disabled = false; });
          });
        });
      }
      if (isClient) {
        main.querySelectorAll("[data-act=pay-copy]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var v = btn.getAttribute("data-copy") || "";
            var done = function () { toast("Скопировано"); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(v).then(done).catch(function () { fallbackCopy(v); done(); });
            } else { fallbackCopy(v); done(); }
          });
        });
        main.querySelectorAll("[data-act=pay-send]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var card = btn.closest(".row-card");
            var oid = card.getAttribute("data-oid");
            var input = card.querySelector(".pay-file");
            var file = input && input.files && input.files[0];
            if (!file) { toast("Сначала выберите скрин оплаты"); return; }
            btn.disabled = true; btn.textContent = "Отправляем…";
            var reader = new FileReader();
            reader.onload = function () {
              var base64 = String(reader.result).split(",")[1] || "";
              apiPost("uploadPaymentProof", { orderId: oid, telegramId: state.telegramId, base64: base64, mimeType: file.type })
                .then(assertOk)
                .then(function () { toast("Скрин отправлен — ждём подтверждения"); state.ordersLoaded = false; renderApp(); })
                .catch(function (err) { toast(err && err.message ? err.message : "Не удалось отправить"); btn.disabled = false; btn.textContent = "Отправить скрин"; });
            };
            reader.onerror = function () { toast("Не удалось прочитать файл"); btn.disabled = false; btn.textContent = "Отправить скрин"; };
            reader.readAsDataURL(file);
          });
        });
        main.querySelectorAll("[data-act=cancel]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var oid = btn.closest(".row-card").getAttribute("data-oid");
            btn.disabled = true;
            apiPost("requestCancellation", { orderId: oid, telegramId: state.telegramId })
              .then(assertOk)
              .then(function () { toast("Заказ отменён"); })
              .catch(function (err) { toast(err && err.message ? err.message : "Отменено локально (демо)"); })
              .then(function () { setLocalStatus(oid, "Отменено"); renderApp(); });
          });
        });
        main.querySelectorAll("[data-act=repeat]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            var oid = btn.closest(".row-card").getAttribute("data-oid");
            var ord = list.find(function (x) { return String(x.orderId) === String(oid); });
            if (ord) repeatOrder(ord);
          });
        });
      }
    });
  }

  // Повтор заказа: позиции прошлого заказа кладём в корзину по текущим ценам и остаткам
  function repeatOrder(o) {
    var items = (o && o.tovary) || [];
    if (!items.length) { toast("Состав заказа недоступен"); return; }
    var ready = state.productsLoaded ? Promise.resolve(state.products) : loadProducts();
    ready.then(function (products) {
      var added = 0;
      items.forEach(function (i) {
        var p = products.find(function (x) { return String(x.tovarId) === String(i.tovarId); });
        if (!p) { toast("Товара №" + i.tovarId + " больше нет в каталоге"); return; }
        var weight = Number(i.weight) || 0;
        var qty = Number(i.quantity) || 1;
        if (p.stock < weight * qty) { toast(p.name + ": не хватает остатка"); return; }
        state.cart.push({
          tovarId: p.tovarId, name: p.name, pricePerGram: p.price, weight: weight,
          price: Math.round(p.price * weight * 100) / 100, qty: qty, image: p.image || ""
        });
        added++;
      });
      if (!added) return;
      saveCart();
      toast("Добавлено позиций: " + added);
      state.tab = "cart";
      renderApp();
    });
  }

  function deliveryRow(o, actionsHtml, preHtml, postHtml) {
    var sm = statusMeta(o.status);
    return '<div class="row-card" data-oid="' + esc(o.orderId) + '">' +
      '<div class="row-top"><span class="id">№ ' + esc(o.orderId) + '</span><span class="date">' + fmtDate(o.date) + '</span></div>' +
      '<div class="row-sum"><span class="addr">' + esc(o.address || "") + '</span><span class="amt">' + money(o.total) + '</span></div>' +
      (preHtml || "") +
      '<div class="row-actions"><span class="pill ' + sm.cls + '"><span class="dot"></span>' + sm.label + '</span>' + (actionsHtml || "") + '</div>' +
      (postHtml || "") +
    '</div>';
  }
  function sectionTitle(txt) {
    return '<div class="screen-title" style="font-size:15px;margin-bottom:12px;">' + txt + '</div>';
  }

  // Доставка до двери (очередь заказов, «Беру», заработок, заказы на рассмотрении, зоны) спрятана за настройкой
  // pub_door_delivery: "1" включает, по умолчанию выключена (MVP-1: подарки забирают на пунктах).
  function doorDeliveryOn() { return String(t("pub_door_delivery") || "").trim() === "1"; }

  // Владелец и диспетчер видят завозы всех курьеров за день с картой и ссылками на фото
  function renderZavozyManage(box) {
    renderMarshrutDnya(box, { kurierId: "", who: true, canPhoto: can("proof_view"), tabId: "delivery", title: "Завозы курьеров за день" });
  }

  // Кто курьер, решает разрешение courier_work, а не старая роль (отдел 01). У кого есть и courier_work, и orders_manage
  // (владелец), экран переключается кнопками «Управление» и «Экран курьера».
  function renderDelivery(main) {
    var isCourier = can("courier_work"), isManager = can("orders_manage");
    var view = state.deliveryView || (isManager ? "manage" : "courier");
    if (view === "courier" && !isCourier) view = "manage";
    if (view === "manage" && !isManager) view = "courier";
    main.innerHTML =
      (isCourier && isManager ? '<div class="seg" style="margin-bottom:12px;display:flex;gap:8px;">' +
        '<button class="act-btn" data-dv="manage"' + (view === "manage" ? ' style="font-weight:700;"' : '') + '>Управление</button>' +
        '<button class="act-btn" data-dv="courier"' + (view === "courier" ? ' style="font-weight:700;"' : '') + '>Экран курьера</button></div>' : '') +
      '<div id="dl-zavoz"></div><div id="dl-door"></div>';
    main.querySelectorAll("[data-dv]").forEach(function (b) {
      b.addEventListener("click", function () { state.deliveryView = b.getAttribute("data-dv"); renderDelivery(main); });
    });
    var zbox = main.querySelector("#dl-zavoz"), dbox = main.querySelector("#dl-door");
    if (view === "courier") {
      renderZavozCourier(zbox);
      if (doorDeliveryOn()) renderDeliveryCourier(dbox);
    } else {
      renderZavozyManage(zbox);
      if (doorDeliveryOn()) renderDeliveryManage(dbox);
    }
  }

  function renderDeliveryCourier(main) {
    Promise.all([
      loadOrders(),
      apiPost("getQueue", {}).then(assertOk).then(function (res) {
        var raw = (res && res.orders) || [];
        return raw.map(function (o) {
          return {
            orderId: o.orderId,
            date: o.createdAt || o.date,
            status: o.status || "Ожидание курьера",
            total: o.totalPrice != null ? o.totalPrice : o.total,
            address: o.deliveryAddress || o.address || "",
            checkpointAt: o.checkpointAt || ""
          };
        });
      }).catch(function () { return null; }),
      apiPost("courierEarnings", { telegramId: state.telegramId }).then(assertOk).catch(function () { return null; })
    ]).then(function (r) {
      if (state.tab !== "delivery") return;
      var list = r[0];
      var queue = r[1];
      var earnings = r[2] || { count: 0, earned: 0 };
      if (queue === null) {
        // демо-режим: свободные заказы из общего списка
        queue = list.filter(function (o) { return o.status === "Ожидание курьера" && !o.courier; });
      }
      var mine = list.filter(function (o) {
        var active = o.status === "Курьер выбран" || o.status === "В пути";
        var isMine = o.courier == null || o.courier === "" || String(o.courier) === String(state.telegramId);
        return active && isMine;
      });

      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Доставка</div><div class="screen-sub">Очередь, мои рейсы, заработок</div></div>' +
        sectionTitle("Очередь") +
        (queue.length
          ? '<div class="row-list">' + queue.map(function (o) {
              return deliveryRow(o, '<button class="act-btn" data-act="take">Беру</button>');
            }).join("") + '</div>'
          : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Свободных заказов нет</p></div>') +
        '<div class="section-gap">' +
          sectionTitle("Мои доставки") +
          (mine.length
            ? '<div class="row-list">' + mine.map(function (o) {
                var actions = "";
                if (o.status === "Курьер выбран") actions = '<button class="act-btn" data-act="start">Начать доставку</button>';
                else if (o.status === "В пути") actions = '<button class="act-btn" data-act="finish">Завершить</button><button class="act-btn danger" data-act="finish-debt">Клиент должен</button>';
                actions += '<button class="act-btn" data-act="transfer">Передать</button>';
                var coords = String(o.coordinates || "").trim();
                if (coords) actions += '<a class="act-btn" style="text-decoration:none;display:inline-block;" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(coords) + '&travelmode=driving">Маршрут в Google Maps</a>';
                var pre = "";
                var cpMs = o.checkpointAt ? Date.now() - new Date(o.checkpointAt).getTime() : 0;
                if (o.checkpointAt && cpMs > 30 * 60000) {
                  pre += '<div style="background:var(--warn-bg);color:var(--warn);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;margin-top:8px;">Прошло ' + Math.floor(cpMs / 60000) + ' мин без подтверждения — успеваешь?' +
                    '<div style="display:flex;gap:8px;margin-top:8px;"><button class="act-btn" data-act="cp-ok">Успеваю</button><button class="act-btn" data-act="cp-no">Не успеваю</button></div></div>';
                }
                if (o.deliveryType === "pickup" && o.status === "В пути") {
                  pre += '<div style="margin-top:8px;"><input type="file" accept="image/*" capture="environment" class="pickup-photo" style="display:block;width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;background:var(--surface);color:var(--text);">' +
                    '<div style="font-size:12px;color:var(--muted);margin-top:4px;">Фото передачи — обязательно</div></div>';
                }
                var post = '<div class="transfer-box" style="display:none;margin-top:8px;">' +
                  '<select style="width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:12px;background:var(--surface);color:var(--text);"></select>' +
                  '<button class="act-btn" data-act="transfer-confirm" style="margin-top:8px;">Подтвердить</button></div>';
                return deliveryRow(o, actions, pre, post);
              }).join("") + '</div>'
            : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Активных доставок нет</p></div>') +
        '</div>' +
        '<div class="section-gap">' +
          sectionTitle("Заработок за сегодня") +
          '<div class="stat-card"><div class="val">' + Number(earnings.count || 0) + ' доставок · ' + Number(earnings.earned || 0).toLocaleString("ru-RU") + ' ₫</div><div class="lbl">300 ₫ за оплачиваемый рейс</div></div>' +
          (Array.isArray(earnings.days) && earnings.days.length
            ? '<div style="margin-top:8px;">' + earnings.days.map(function (d, i) {
                return '<div style="font-size:12px;padding:8px 0;' + (i ? 'border-top:1px solid var(--border);' : '') + '">' + esc(d.date) + ' · ' + Number(d.count || 0) + ' доставок · ' + Number(d.earned || 0).toLocaleString("ru-RU") + ' ₫</div>';
              }).join("") + '</div>'
            : '') +
        '</div>';

      function bindAction(selector, handler) {
        main.querySelectorAll(selector).forEach(function (btn) {
          btn.addEventListener("click", function () {
            var oid = btn.closest(".row-card").getAttribute("data-oid");
            btn.disabled = true;
            handler(oid, btn);
          });
        });
      }
      bindAction("[data-act=take]", function (oid) {
        apiPost("takeOrder", { orderId: oid, telegramId: state.telegramId })
          .then(assertOk)
          .then(function () { toast("Заказ закреплён за вами"); state.ordersLoaded = false; })
          .catch(function (err) {
            toast(err && err.message ? err.message : "Взято локально (демо)");
            var ord = state.orders.find(function (o) { return String(o.orderId) === String(oid); });
            if (ord) { ord.status = "Курьер выбран"; ord.courier = state.telegramId; }
          })
          .then(function () { renderApp(); });
      });
      bindAction("[data-act=start]", function (oid) {
        apiPost("startDelivery", { orderId: oid })
          .then(assertOk)
          .then(function () { toast("Доставка началась"); })
          .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
          .then(function () { setLocalStatus(oid, "В пути"); renderApp(); });
      });
      bindAction("[data-act=cp-ok]", function (oid) {
        apiPost("confirmCheckpoint", { orderId: oid })
          .then(assertOk)
          .then(function () {
            toast("Подтверждено");
            var ord = state.orders.find(function (x) { return String(x.orderId) === String(oid); });
            if (ord) ord.checkpointAt = new Date().toISOString();
          })
          .catch(function (err) { toast(err && err.message ? err.message : "Ошибка"); })
          .then(function () { renderApp(); });
      });
      bindAction("[data-act=cp-no]", function (oid) {
        apiPost("releaseOrder", { orderId: oid })
          .then(assertOk)
          .then(function () { toast("Заказ вернулся в очередь"); })
          .catch(function (err) { toast(err && err.message ? err.message : "Ошибка"); })
          .then(function () { state.ordersLoaded = false; renderApp(); });
      });
      main.querySelectorAll("[data-act=transfer]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var box = btn.closest(".row-card").querySelector(".transfer-box");
          if (!box) return;
          if (box.style.display !== "none") { box.style.display = "none"; return; }
          btn.disabled = true;
          apiPost("getCouriers", {})
            .then(assertOk)
            .then(function (res) {
              var others = ((res && res.couriers) || []).filter(function (c) { return String(c.telegramId) !== String(state.telegramId); });
              if (!others.length) { toast("Других курьеров нет"); return; }
              box.querySelector("select").innerHTML = others.map(function (c) {
                return '<option value="' + esc(c.telegramId) + '">' + esc(c.name) + '</option>';
              }).join("");
              box.style.display = "";
            })
            .catch(function (err) { toast(err && err.message ? err.message : "Не удалось получить курьеров"); })
            .then(function () { btn.disabled = false; });
        });
      });
      bindAction("[data-act=transfer-confirm]", function (oid, btn) {
        var sel = btn.closest(".transfer-box").querySelector("select");
        var toId = sel.value;
        var name = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].textContent : "";
        if (!toId) { btn.disabled = false; return; }
        apiPost("transferOrder", { orderId: oid, toTelegramId: toId })
          .then(assertOk)
          .then(function () { toast("Передано " + name); state.ordersLoaded = false; renderApp(); })
          .catch(function (err) { toast(err && err.message ? err.message : "Ошибка"); btn.disabled = false; });
      });
      function doFinish(oid, debt, photoUrl) {
        var payload = { orderId: oid, debt: debt };
        if (photoUrl) payload.photoUrl = photoUrl;
        apiPost("finishDelivery", payload)
          .then(assertOk)
          .then(function () { toast(debt ? "Завершено: клиент должен" : "Доставка завершена"); })
          .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
          .then(function () { setLocalStatus(oid, debt ? "Должники" : "Успех"); renderApp(); });
      }
      function finish(oid, debt, btn) {
        var card = btn ? btn.closest(".row-card") : null;
        var photoInput = card ? card.querySelector(".pickup-photo") : null;
        if (!photoInput) { doFinish(oid, debt); return; }
        var file = photoInput.files && photoInput.files[0];
        if (!file) { toast("Сначала прикрепите фото передачи"); btn.disabled = false; return; }
        var origText = btn.textContent;
        btn.textContent = "Загружаем фото…";
        var reader = new FileReader();
        reader.onload = function () {
          var base64 = String(reader.result).split(",")[1] || "";
          apiPost("uploadPhoto", { orderId: oid, base64: base64, mimeType: file.type })
            .then(assertOk)
            .then(function (res) { doFinish(oid, debt, res && res.url); })
            .catch(function (err) {
              toast(err && err.message ? err.message : "Не удалось загрузить фото");
              btn.disabled = false; btn.textContent = origText;
            });
        };
        reader.onerror = function () {
          toast("Не удалось прочитать файл");
          btn.disabled = false; btn.textContent = origText;
        };
        reader.readAsDataURL(file);
      }
      bindAction("[data-act=finish]", function (oid, btn) { finish(oid, false, btn); });
      bindAction("[data-act=finish-debt]", function (oid, btn) { finish(oid, true, btn); });
    });
  }

  function renderDeliveryManage(main) {
    Promise.all([
      loadOrders(),
      apiPost("getZones", {}).then(assertOk).then(function (res) { return (res && res.zones) || []; }).catch(function () { return []; })
    ]).then(function (r) {
      if (state.tab !== "delivery") return;
      var pending = r[0].filter(function (o) { return o.status === "На рассмотрении"; });
      var refunds = r[0].filter(function (o) { return o.status === "Отменено"; });
      var zones = r[1];

      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Доставка</div><div class="screen-sub">Заявки вне зон и зоны доставки</div></div>' +
        sectionTitle("На рассмотрении") +
        (pending.length
          ? '<div class="row-list">' + pending.map(function (o) {
              return deliveryRow(o,
                '<button class="act-btn" data-act="approve">Одобрить</button>' +
                '<button class="act-btn danger" data-act="reject">Отклонить</button>');
            }).join("") + '</div>'
          : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Заказов на рассмотрении нет</p></div>') +
        '<div class="section-gap">' +
          sectionTitle("Возвраты") +
          '<div style="font-size:12px;color:var(--muted);margin:-6px 0 12px;">Отменённые заказы, ожидающие возврата денег клиенту</div>' +
          (refunds.length
            ? '<div class="row-list">' + refunds.map(function (o) {
                return deliveryRow(o, '<button class="act-btn" data-act="refund-done">Возврат реализован</button>');
              }).join("") + '</div>'
            : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Возвратов нет</p></div>') +
        '</div>' +
        '<div class="section-gap">' +
          sectionTitle("Доверенные клиенты") +
          '<div id="trusted-block"></div>' +
        '</div>' +
        '<div class="section-gap">' +
          sectionTitle("Зоны доставки") +
          (zones.length
            ? '<div class="card">' + zones.map(function (z) {
                return '<div class="summary-row"><span>' + esc(z.name) + '</span><span>' + esc(z.radiusKm) + ' км · ' + esc(z.etaText) + '</span></div>';
              }).join("") + '</div>'
            : '<div class="empty-state"><span class="eyebrow">Нет данных</span><p>Зоны не загружены</p></div>') +
          '<div class="screen-sub" style="margin:8px 0 0;">Только просмотр — зоны редактируются в Google Таблице.</div>' +
        '</div>';

      main.querySelectorAll("[data-act=approve]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var oid = btn.closest(".row-card").getAttribute("data-oid");
          btn.disabled = true;
          apiPost("approveOrder", { orderId: oid })
            .then(assertOk)
            .then(function () { toast("Заказ одобрен"); })
            .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
            .then(function () { setLocalStatus(oid, "Ожидание курьера"); renderApp(); });
        });
      });
      main.querySelectorAll("[data-act=reject]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var oid = btn.closest(".row-card").getAttribute("data-oid");
          btn.disabled = true;
          apiPost("rejectOrder", { orderId: oid })
            .then(assertOk)
            .then(function () { toast("Заказ отклонён"); })
            .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
            .then(function () { setLocalStatus(oid, "Не успех"); renderApp(); });
        });
      });
      main.querySelectorAll("[data-act=refund-done]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var oid = btn.closest(".row-card").getAttribute("data-oid");
          btn.disabled = true;
          apiPost("completeRefund", { orderId: oid })
            .then(assertOk)
            .then(function () { toast("Возврат закрыт"); })
            .catch(function (err) { toast(err && err.message ? err.message : "Обновлено локально (демо)"); })
            .then(function () { state.ordersLoaded = false; renderApp(); });
        });
      });
      renderTrustedSection(main);
    });
  }

  // Секция «Доверенные клиенты»: кандидаты с покупками выше порога, вручную получают доступ к курьеру
  function renderTrustedSection(main) {
    var box = main.querySelector("#trusted-block");
    if (!box) return;
    box.innerHTML = '<div class="empty-state"><span class="eyebrow">Загрузка</span><p>Загружаем кандидатов…</p></div>';
    apiPost("getTrustedCandidates", {})
      .then(assertOk)
      .then(function (res) {
        if (state.tab !== "delivery" || !document.body.contains(box)) return;
        var list = (res && res.candidates) || [];
        if (!list.length) {
          box.innerHTML = '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Кандидатов нет (порог: ' + money((res && res.threshold) || 0) + ')</p></div>';
          return;
        }
        box.innerHTML = '<div class="card">' + list.map(function (c) {
          return '<div class="summary-row">' +
            '<span>' + esc(c.name || "Без имени") +
              '<span style="display:block;font-size:12px;color:var(--muted);">ID ' + esc(c.telegramId) + ' · покупки: ' + money(c.total) + '</span>' +
            '</span>' +
            '<button class="act-btn" data-tid="' + esc(c.telegramId) + '">Сделать доверенным</button>' +
          '</div>';
        }).join("") + '</div>';
        box.querySelectorAll("[data-tid]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            btn.disabled = true;
            apiPost("setTrusted", { telegramId: btn.getAttribute("data-tid"), trusted: true })
              .then(assertOk)
              .then(function () { toast("Клиент теперь доверенный"); })
              .catch(function (err) { toast(err && err.message ? err.message : "Не удалось обновить"); })
              .then(function () { renderTrustedSection(main); });
          });
        });
      })
      .catch(function () {
        if (!document.body.contains(box)) return;
        box.innerHTML = '<div class="empty-state"><span class="eyebrow">Нет данных</span><p>Кандидаты не загружены</p></div>';
      });
  }

  function renderQuickSale(main) {
    loadProducts().then(function (list) {
      if (state.tab !== "quicksale") return;
      if (!list.length) {
        main.innerHTML = '<div class="screen-title-row"><div class="screen-title">Быстрая продажа</div></div><div class="empty-state"><span class="eyebrow">Пусто</span><p>' + esc(t("empty_catalog")) + '</p></div>';
        return;
      }
      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Быстрая продажа</div><div class="screen-sub">Продажа на месте, статус сразу «Успех»</div></div>' +
        '<div class="card">' +
          '<div class="field"><label>Камень</label><select id="qs-tovar">' +
            list.map(function (p) { return '<option value="' + esc(p.tovarId) + '">' + esc(p.name) + ' · ' + money(p.price) + '/г</option>'; }).join("") +
          '</select></div>' +
          '<div class="field"><label>Вес</label>' +
            '<div class="chips" id="qs-chips">' +
              '<button type="button" class="chip active" data-w="0.25">0.25 г</button>' +
              '<button type="button" class="chip" data-w="0.5">0.5 г</button>' +
              '<button type="button" class="chip" data-w="1">1 г</button>' +
            '</div>' +
          '</div>' +
          '<div class="field"><label>Свой вес, г</label><input id="qs-custom" type="number" step="0.05" min="0.05" placeholder="Например, 0.75" /></div>' +
          '<div class="field"><label>Количество</label><input id="qs-qty" type="number" step="1" min="1" value="1" /></div>' +
          '<div class="field"><label>Способ оплаты</label><select id="qs-pay">' +
            '<option>Наличные</option><option>Перевод</option><option>USDT</option>' +
          '</select></div>' +
          '<div class="summary-row total"><span>Итого</span><span id="qs-total"></span></div>' +
          '<div style="height:12px;"></div>' +
          '<button class="btn-primary" id="qs-submit">Провести продажу</button>' +
        '</div>';

      function currentProduct() {
        var id = document.getElementById("qs-tovar").value;
        return list.find(function (p) { return String(p.tovarId) === String(id); });
      }
      function currentWeight() {
        var custom = parseFloat(document.getElementById("qs-custom").value);
        if (isFinite(custom) && custom >= 0.05) return custom;
        var act = main.querySelector("#qs-chips .chip.active");
        return act ? parseFloat(act.getAttribute("data-w")) : 0.25;
      }
      function currentQty() {
        return Math.max(1, Math.round(Number(document.getElementById("qs-qty").value) || 1));
      }
      function updateTotal() {
        var p = currentProduct();
        var sum = p ? Math.round(p.price * currentWeight() * currentQty() * 100) / 100 : 0;

  function positionChipsHTML(all, selected, cls) {

      });
    });
  }

  // ---- хранилище демо-режима (localStorage) и кэш последних загруженных пунктов ----
  function punktyDemoRead_() {

      if (Array.isArray(list)) return list;
    } catch (e) {}

  function punktPoId(id) {
    var list = punktyCache_();
    for (var i = 0; i < list.length; i++) if (String(list[i].id) === String(id)) return list[i];
    return null;
