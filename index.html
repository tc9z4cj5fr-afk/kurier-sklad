  // Загрузка: all=true -> все пункты, включая выключенные, с телефоном (нужно points_edit); иначе активные без телефона
  function loadPunkty(all) {
    var fromList = function (list) {
      list = list.map(function (p) {
        var q = {}; for (var k in p) q[k] = p[k];
        q.lat = Number(q.lat); q.lng = Number(q.lng);
        if (!all) { delete q.hozyain_telefon; delete q.sozdal; delete q.sozdan; }
        return q;
      }).filter(function (p) { return all || p.aktiven !== false; });
      state.punkty = list;
      return list;
    };
    if (PUNKTY_DEMO) return Promise.resolve(fromList(punktyDemoRead_()));
    return apiPost(all ? "getPunktyAll" : "getPunkty", {})
      .then(assertOk)
      .then(function (res) {
        if (!res || !Array.isArray(res.punkty)) throw new Error("bad shape");
        state.punkty = res.punkty.map(function (p) { p.lat = Number(p.lat); p.lng = Number(p.lng); return p; });
        return state.punkty;
      });
  }

  // Те же проверки, что на сервере (validatePunkt_): пункт только с адресом, точкой и живым хозяином
  function punktValidate(d) {
    if (!String(d.nazvanie || "").trim()) return "Укажите название пункта";
    var lat = Number(d.lat), lng = Number(d.lng);
    if (d.lat === "" || d.lat == null || d.lng === "" || d.lng == null || !isFinite(lat) || !isFinite(lng)) return "Поставьте точку на карте";
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return "Координаты вне карты";
    if (!String(d.adres || "").trim()) return "Укажите адрес";
    if (!String(d.hozyain_imya || "").trim()) return "Укажите, кто хозяин места (имя)";
    if (String(d.hozyain_telefon || "").replace(/\D/g, "").length < 7) return "Укажите телефон хозяина места";
    return "";
  }

  // Сохранить пункт (создать без id, обновить с id). Возвращает Promise<пункт>.
  function punktSave(d) {
    var err = punktValidate(d);
    if (err) return Promise.reject(new Error(err));
    if (PUNKTY_DEMO) {
      var list = punktyDemoRead_(), saved = null;
      var base = {
        nazvanie: String(d.nazvanie).trim(), adres: String(d.adres).trim(), lat: Number(d.lat), lng: Number(d.lng),
        hozyain_imya: String(d.hozyain_imya).trim(), hozyain_telefon: String(d.hozyain_telefon).trim(),
        chasy: String(d.chasy || "").trim(), aktiven: d.aktiven !== false
      };
      if (d.id) {
        for (var i = 0; i < list.length; i++) {
          if (list[i].id === d.id) {
            for (var k in base) list[i][k] = base[k];
            if (d.foto != null) list[i].foto = d.foto;
            saved = list[i];
          }
        }
        if (!saved) return Promise.reject(new Error("Пункт не найден"));
      } else {
        saved = base;
        saved.id = "P-" + Date.now().toString(36).toUpperCase();
        saved.foto = d.foto || "";
        saved.sozdal = state.telegramId || "demo";
        saved.sozdan = new Date().toISOString();
        list.push(saved);
      }
      punktyDemoWrite_(list);
      return Promise.resolve(saved);
    }
    return apiPost("upsertPunkt", d).then(assertOk).then(function (res) { return res.punkt; });
  }

  // Фото места: в демо кладётся прямо в пункт (data-адрес), на сервере уходит в Drive. Promise<url>
  function punktUploadFoto(id, foto) {
    if (PUNKTY_DEMO) {
      var list = punktyDemoRead_();
      for (var i = 0; i < list.length; i++) if (list[i].id === id) list[i].foto = foto.dataUrl;
      punktyDemoWrite_(list);
      return Promise.resolve(foto.dataUrl);
    }
    return apiPost("uploadPunktFoto", { id: id, base64: foto.base64, mimeType: "image/jpeg" }).then(assertOk).then(function (res) { return res.url; });
  }

  // Файл из камеры или галереи -> JPEG до 900 px: { dataUrl, base64 }
  function punktFotoFromFile(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("Не удалось прочитать фото")); };
      reader.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error("Это не картинка")); };
        img.onload = function () {
          var max = 900, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL("image/jpeg", 0.75);
          resolve({ dataUrl: url, base64: url.split(",")[1] });
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  // ---- расстояния и проверка геометки (для отдела 08, «ближайший пункт» для отдела 04) ----
  function punktDistanceM(p, lat, lng) {
    if (!p || lat == null || lng == null || lat === "" || lng === "") return null;
    lat = Number(lat); lng = Number(lng);
    if (!isFinite(lat) || !isFinite(lng)) return null;
    var R = 6371000, rad = Math.PI / 180;
    var dLat = (Number(p.lat) - lat) * rad, dLng = (Number(p.lng) - lng) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat * rad) * Math.cos(Number(p.lat) * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }
  // Геометка в радиусе пункта? Возвращает { ok, distanceM, radiusM }. Проверку дублирует сервер (geometkaVPunkte_).
  function geometkaVPunkte(id, lat, lng, radiusM) {
    var r = Number(radiusM) > 0 ? Number(radiusM) : PUNKT_RADIUS_M;
    var d = punktDistanceM(punktPoId(id), lat, lng);
    if (d == null) return { ok: false, distanceM: null, radiusM: r };
    return { ok: d <= r, distanceM: Math.round(d), radiusM: r };
  }
  // Пункты по удалённости от точки (ближайший первым): [{ punkt, distanceM }]
  function punktyPoUdalennosti(lat, lng) {
    return punktyCache_().map(function (p) { return { punkt: p, distanceM: punktDistanceM(p, lat, lng) }; })
      .filter(function (x) { return x.distanceM != null; })
      .sort(function (a, b) { return a.distanceM - b.distanceM; });
  }
  // Пункты выдачи (отдел 07): экран картографа. Общий для витрины («Пункты») и ЦУБа («Пункты»).
  // Карта Leaflet/OSM подключена в скелете витрины; в скелете ЦУБа её нет (обращение отделу 10),
  // поэтому там точка задаётся числами, а карта появится сама, когда Leaflet подключат.
  function renderPunktyEditor(main, tabId) {
    var ed = null;   // правка: { id, nazvanie, adres, chasy, hozyain_imya, hozyain_telefon, lat, lng, foto, fotoNew }
    var busy = false;

    function mapOn() { return typeof L !== "undefined" && !!document.getElementById("punkty-map"); }
    function killMap() { if (window.__punktyMap) { try { window.__punktyMap.remove(); } catch (e) {} window.__punktyMap = null; } }
    function alive() { return state.tab === tabId && document.body.contains(main); }

    function fieldRow(label, inner) { return '<div class="field"><label>' + label + '</label>' + inner + '</div>'; }
    function inp(f, v, attrs) { return '<input data-pf="' + f + '" value="' + esc(v == null ? "" : v) + '" ' + (attrs || "") + ' />'; }

    function load() {
      loadPunkty(true).then(function (list) { if (alive()) draw(list); })
        .catch(function (e) { if (alive()) main.innerHTML = '<div class="empty-state"><span class="eyebrow">Ошибка</span><p>' + esc(e && e.message ? e.message : "Не удалось загрузить пункты") + '</p></div>'; });
    }

    function mapLink(p) { return "https://www.openstreetmap.org/?mlat=" + p.lat + "&mlon=" + p.lng + "#map=18/" + p.lat + "/" + p.lng; }

    function draw(list) {
      killMap();
      var cur = ed || { id: "", nazvanie: "", adres: "", chasy: "", hozyain_imya: "", hozyain_telefon: "", lat: "", lng: "", foto: "" };
      var active = list.filter(function (p) { return p.aktiven !== false; }).length;
      var shownFoto = cur.fotoNew ? cur.fotoNew.dataUrl : cur.foto;
      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Пункты выдачи</div>' +
        '<div class="screen-sub">' + active + ' активных · ' + (list.length - active) + ' выключено · известные места с живым хозяином</div></div>' +

        '<div class="card" style="margin-bottom:16px;">' +
          '<span class="eyebrow">' + (cur.id ? "Правка пункта" : "Новый пункт") + '</span>' +
          '<div style="margin-top:12px;">' +
            '<div id="punkty-map" style="height:260px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:8px;isolation:isolate;display:' + (typeof L !== "undefined" ? "block" : "none") + ';"></div>' +
            '<div class="row-actions" style="margin-bottom:12px;"><button class="act-btn" id="pf-here" type="button">Я на месте: взять мою геопозицию</button>' +
              '<span class="screen-sub" id="pf-hint" style="margin:0;">' + (typeof L !== "undefined" ? "Нажмите на карту или перетащите метку" : "Карта недоступна: введите широту и долготу") + '</span></div>' +
            '<div class="grid-2">' + fieldRow("Широта", inp("lat", cur.lat, 'type="number" step="any" inputmode="decimal"')) +
              fieldRow("Долгота", inp("lng", cur.lng, 'type="number" step="any" inputmode="decimal"')) + '</div>' +
            fieldRow("Название места", inp("nazvanie", cur.nazvanie, 'placeholder="Например, Магазин «Лотос»"')) +
            fieldRow("Адрес", inp("adres", cur.adres, 'placeholder="Улица, дом, как найти вход"')) +
            fieldRow("Часы работы", inp("chasy", cur.chasy, 'placeholder="08:00–22:00"')) +
            '<div class="grid-2">' + fieldRow("Хозяин места (имя)", inp("hozyain_imya", cur.hozyain_imya)) +
              fieldRow("Телефон хозяина", inp("hozyain_telefon", cur.hozyain_telefon, 'type="tel" inputmode="tel" placeholder="+84…"')) + '</div>' +
            fieldRow("Фото места", '<input type="file" id="pf-file" accept="image/*" />' +
              (shownFoto ? '<img id="pf-preview" src="' + esc(shownFoto) + '" alt="Фото места" style="margin-top:8px;max-width:100%;max-height:180px;border-radius:var(--radius-sm);border:1px solid var(--border);" />' : "")) +
            '<div class="row-actions"><button class="btn-primary" id="pf-save" type="button">' + (cur.id ? "Сохранить изменения" : "Добавить пункт") + '</button>' +
              (cur.id ? '<button class="act-btn" id="pf-cancel" type="button">Отмена</button>' : "") + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="row-list">' +
          (list.length ? list.map(function (p) {
            var on = p.aktiven !== false;
            return '<div class="row-card" data-id="' + esc(p.id) + '">' +
              '<div class="row-top"><span class="id" style="font-size:14px;">' + esc(p.nazvanie) + '</span>' +
                '<span class="pill ' + (on ? "delivered" : "cancelled") + '"><span class="dot"></span>' + (on ? "Активен" : "Выключен") + '</span></div>' +
              (p.foto ? '<img src="' + esc(p.foto) + '" alt="" style="width:100%;max-height:150px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);" />' : "") +
              '<div class="row-sum"><span class="addr" style="white-space:normal;">' + esc(p.adres) + '</span></div>' +
              '<div class="screen-sub" style="margin:0;">' + esc(p.chasy || "часы не указаны") + ' · ' + esc(p.hozyain_imya) + (p.hozyain_telefon ? ' · <a href="tel:' + esc(String(p.hozyain_telefon).replace(/[^\d+]/g, "")) + '">' + esc(p.hozyain_telefon) + '</a>' : '') + '</div>' +
              '<div class="row-actions"><button class="act-btn" data-act="edit">Править</button>' +
                '<button class="act-btn' + (on ? " danger" : "") + '" data-act="toggle">' + (on ? "Выключить" : "Включить") + '</button>' +
                '<a class="act-btn" style="text-decoration:none;" href="' + esc(mapLink(p)) + '" target="_blank" rel="noopener">Маршрут</a></div>' +
            '</div>';
          }).join("") : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>Пунктов пока нет: поставьте первый на карте</p></div>') +
        '</div>';

      bindForm(list);
      if (mapOn()) buildMap(list, cur);

      main.querySelectorAll(".row-card[data-id]").forEach(function (card) {
        var id = card.getAttribute("data-id");
        var p = list.filter(function (x) { return x.id === id; })[0];
        card.querySelector('[data-act="edit"]').addEventListener("click", function () {
          ed = { id: p.id, nazvanie: p.nazvanie, adres: p.adres, chasy: p.chasy, hozyain_imya: p.hozyain_imya, hozyain_telefon: p.hozyain_telefon, lat: p.lat, lng: p.lng, foto: p.foto };
          draw(list);
          window.scrollTo(0, 0);
        });
        card.querySelector('[data-act="toggle"]').addEventListener("click", function () {
          var next = p.aktiven === false;
          var d = { id: p.id, nazvanie: p.nazvanie, adres: p.adres, lat: p.lat, lng: p.lng, chasy: p.chasy, hozyain_imya: p.hozyain_imya, hozyain_telefon: p.hozyain_telefon, aktiven: next };
          punktSave(d).then(function () { toast(next ? "Пункт включён" : "Пункт выключен"); load(); })
            .catch(function (e) { toast(e && e.message ? e.message : "Не удалось сохранить"); });
        });
      });
    }

    function readForm() {
      var v = {};
      main.querySelectorAll("[data-pf]").forEach(function (i) { v[i.getAttribute("data-pf")] = i.value; });
      return v;
    }
    // Значения полей запоминаем в ed, чтобы перерисовка (смена точки) их не стирала
    function keep() {
      var v = readForm();
      ed = ed || { id: "", foto: "" };
      ["nazvanie", "adres", "chasy", "hozyain_imya", "hozyain_telefon"].forEach(function (k) { ed[k] = v[k]; });
      ed.lat = v.lat; ed.lng = v.lng;
    }

    function setPoint(lat, lng) {
      var la = main.querySelector('[data-pf="lat"]'), lo = main.querySelector('[data-pf="lng"]');
      if (la) la.value = Number(lat).toFixed(6);
      if (lo) lo.value = Number(lng).toFixed(6);
      var mk = window.__punktyMap && window.__punktyMap.__mk;
      if (mk) mk.setLatLng([lat, lng]);
    }

    function bindForm(list) {
      var la = main.querySelector('[data-pf="lat"]'), lo = main.querySelector('[data-pf="lng"]');
      function fromInputs() {
        var a = parseFloat(la.value), b = parseFloat(lo.value);
        if (isFinite(a) && isFinite(b) && window.__punktyMap && window.__punktyMap.__mk) {
          window.__punktyMap.__mk.setLatLng([a, b]); window.__punktyMap.setView([a, b]);
        }
      }
      la.addEventListener("change", fromInputs); lo.addEventListener("change", fromInputs);

      document.getElementById("pf-here").addEventListener("click", function () {
        if (!navigator.geolocation) { toast("Геопозиция недоступна на этом устройстве"); return; }
        navigator.geolocation.getCurrentPosition(function (pos) {
          setPoint(pos.coords.latitude, pos.coords.longitude);
          if (window.__punktyMap) window.__punktyMap.setView([pos.coords.latitude, pos.coords.longitude], 17);
          toast("Точка поставлена по вашей геопозиции");
        }, function () { toast("Не удалось определить место: разрешите доступ к геопозиции или нажмите на карту"); }, { enableHighAccuracy: true, timeout: 10000 });
      });

      document.getElementById("pf-file").addEventListener("change", function (e) {
        var f = e.target.files && e.target.files[0];
        if (!f) return;
        punktFotoFromFile(f).then(function (foto) {
          keep(); ed.fotoNew = foto; draw(list);
        }).catch(function (err) { toast(err && err.message ? err.message : "Фото не принято"); });
      });

      var cancel = document.getElementById("pf-cancel");
      if (cancel) cancel.addEventListener("click", function () { ed = null; draw(list); });

      document.getElementById("pf-save").addEventListener("click", function () {
        if (busy) return;
        keep();
        var d = { id: ed.id || undefined, nazvanie: ed.nazvanie, adres: ed.adres, lat: ed.lat, lng: ed.lng, chasy: ed.chasy, hozyain_imya: ed.hozyain_imya, hozyain_telefon: ed.hozyain_telefon, aktiven: true };
        if (ed.id) { var old = list.filter(function (x) { return x.id === ed.id; })[0]; if (old) d.aktiven = old.aktiven !== false; }
        var err = punktValidate(d);
        if (err) { toast(err); return; }
        busy = true;
        var btn = document.getElementById("pf-save"); btn.disabled = true; btn.textContent = "Сохраняем…";
        var fotoNew = ed.fotoNew;
        punktSave(d).then(function (p) {
          return fotoNew ? punktUploadFoto(p.id, fotoNew) : null;
        }).then(function () {
          toast(ed.id ? "Пункт сохранён" : "Пункт добавлен");
          ed = null; busy = false; load();
        }).catch(function (e) {
          busy = false; btn.disabled = false; btn.textContent = ed.id ? "Сохранить изменения" : "Добавить пункт";
          toast(e && e.message ? e.message : "Не удалось сохранить");
        });
      });
    }

    function buildMap(list, cur) {
      var hasPt = isFinite(parseFloat(cur.lat)) && isFinite(parseFloat(cur.lng));
      var c = hasPt ? [parseFloat(cur.lat), parseFloat(cur.lng)] : (list[0] ? [list[0].lat, list[0].lng] : PUNKTY_NHA_TRANG);
      var map = L.map("punkty-map").setView(c, hasPt ? 17 : 14);
      window.__punktyMap = map;
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      list.forEach(function (p) {
        if (p.id === cur.id) return;
        // серые кружки: уже стоящие пункты (метка = радиус допуска курьера)
        L.circle([p.lat, p.lng], { radius: PUNKT_RADIUS_M, color: p.aktiven === false ? "#9aa0a6" : "#5b6472", weight: 1, fillOpacity: 0.12 })
          .bindTooltip(esc(p.nazvanie)).addTo(map);
      });
      var mk = L.marker(c, { draggable: true, opacity: hasPt ? 1 : 0.6 }).addTo(map);
      map.__mk = mk;
      mk.on("dragend", function () { var ll = mk.getLatLng(); setPoint(ll.lat, ll.lng); mk.setOpacity(1); });
      map.on("click", function (e) { setPoint(e.latlng.lat, e.latlng.lng); mk.setOpacity(1); });
      setTimeout(function () { if (window.__punktyMap === map) map.invalidateSize(); }, 60);
    }

    load();
  }
  // Витрина, вкладка «Пункты» (картограф и владелец, разрешение points_edit).
  // Вся работа в общем редакторе otdely/07-punkty-zony-marshrut/obshchee/punkty-redaktor.js
  function renderPunkty(main) {
    if (!can("points_edit")) {
      main.innerHTML = '<div class="empty-state"><span class="eyebrow">Нет доступа</span><p>Пункты ставит картограф или владелец</p></div>';
      return;
    }
    renderPunktyEditor(main, "punkty");
  }
  // Завоз на пункт (отдел 08): данные, демо и связь с сервером. Общий блок обеих страниц (витрина и пульт).
  // Контракт: dogovor/08-zavoz.md, лист «Завозы». Сервер сам проверяет расстояние до пункта и ставит время.
  // Демо (?demo=1): всё идёт без сервера, завоз проверяется той же геометкой (geometkaVPunkte, отдел 07),
  // товар добавляется на пункт через ostatkiDemoPrihod (отдел 03), записи лежат в localStorage.
  var ZAVOZ_DEMO = /[?&]demo=1/.test(location.search);
  var ZAVOZ_DEMO_KEY = "kurier_demo_zavozy";

  function zavozLocalDay(v) {
    var d = v instanceof Date ? v : new Date(v);
    if (isNaN(d.getTime())) return "";
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  // Кто курьер в этом окне: свой Telegram id, в демо без id — «demo»
  function zavozKurierId() { return state.telegramId ? String(state.telegramId) : "demo"; }

  // Демо-история на сегодня (два завоза «Демо-курьера»), чтобы владелец сразу видел маршрут и карту
  function zavozDemoSeed_() {
    function at(h, m) { var d = new Date(); d.setHours(h, m, 0, 0); return d.toISOString(); }
    var ph = "data:image/svg+xml;utf8," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160"><rect width="240" height="160" fill="#cfd8dc"/><text x="120" y="88" font-size="18" text-anchor="middle" fill="#455a64" font-family="sans-serif">фото завоза</text></svg>');
    return [
      { id: "Z-DEMO-1", vremya: at(9, 10), kurier_id: "D-SEED", kurier_imya: "Демо-курьер", punkt_id: "P-DEMO-1", punkt_nazvanie: "Магазин «Лотос»",
        tovary: [{ tovarId: "1", nazvanie: "Чайный набор в коробке", kolichestvo: 5 }, { tovarId: "5", nazvanie: "Открытки ручной работы", kolichestvo: 10 }],
        foto: ph, lat: 12.2432, lng: 109.1963, rasstoyanie_m: 14, dopusk_m: 150, status: "prinyat", prichina: "", punkt_lat: 12.2431, punkt_lng: 109.1962 },
      { id: "Z-DEMO-2", vremya: at(10, 25), kurier_id: "D-SEED", kurier_imya: "Демо-курьер", punkt_id: "P-DEMO-2", punkt_nazvanie: "Кафе «Бамбук»",
        tovary: [{ tovarId: "3", nazvanie: "Кружка с гравировкой", kolichestvo: 2 }],
        foto: ph, lat: 12.2380, lng: 109.1961, rasstoyanie_m: 14, dopusk_m: 150, status: "prinyat", prichina: "", punkt_lat: 12.2379, punkt_lng: 109.1960 }
    ];
  }
  function zavozDemoRead_() {
    try {
      var raw = localStorage.getItem(ZAVOZ_DEMO_KEY);
      var list = raw ? JSON.parse(raw) : null;
      if (Array.isArray(list)) return list;
    } catch (e) {}
    var seed = zavozDemoSeed_();
    zavozDemoWrite_(seed);
    return seed;
  }
  function zavozDemoWrite_(list) {
    try { localStorage.setItem(ZAVOZ_DEMO_KEY, JSON.stringify(list)); } catch (e) {}
  }

  // Товары для формы завоза. Promise<[{tovarId, name}]>. Курьеру каталог закрыт, поэтому свой список имён с сервера.
  function zavozTovary() {
    if (ZAVOZ_DEMO) {
      if (typeof giftsLoad === "function") return giftsLoad().then(function (l) { return (l || []).map(function (g) { return { tovarId: g.tovarId, name: g.name }; }); });
      return Promise.resolve([]);
    }
    return apiPost("getZavozTovary", {}).then(assertOk).then(function (res) {
      return ((res && res.data) || []).map(function (t) { return { tovarId: t.id, name: t.name }; });
    });
  }

  // Отправить завоз. d = {punkt_id, items:[{tovarId, kolichestvo}], foto:{base64, dataUrl}, lat, lng}.
  // Promise<ответ>; отказ бросает Error с понятным текстом (e.otkaz = true, если далеко от пункта).
  function zavozSend(d) {
    if (!ZAVOZ_DEMO) {
      return apiPost("zavozNaPunkt", {
        telegramId: state.telegramId, punkt_id: d.punkt_id, items: d.items,
        foto: { base64: d.foto.base64, mimeType: "image/jpeg" }, lat: d.lat, lng: d.lng
      }).then(function (res) {
        if (res && res.success === false) { var e = new Error(res.error || "Завоз не принят"); e.otkaz = !!res.otkaz; throw e; }
        return res;
      });
    }
    return Promise.resolve().then(function () {
      var p = punktPoId(d.punkt_id);
      if (!p || p.aktiven === false) throw new Error("Пункт не найден или выключен");
      if (!d.items || !d.items.length) throw new Error("Отметьте, какие товары привезли и сколько");
      if (!d.foto) throw new Error("Сделайте фото места: без фото завоз не принимается");
      if (d.lat == null || d.lng == null) throw new Error("Нет геометки: нажмите «Я у пункта» (в демо) или разрешите геопозицию");
      var geo = geometkaVPunkte(d.punkt_id, d.lat, d.lng);
      var list = zavozDemoRead_();
      var names = {};
      (state.zavozTovary || []).forEach(function (t) { names[String(t.tovarId)] = t.name; });
      var rec = {
        id: "Z-" + Date.now().toString(36).toUpperCase(), vremya: new Date().toISOString(), kurier_id: zavozKurierId(), kurier_imya: "Вы",
        punkt_id: p.id, punkt_nazvanie: p.nazvanie,
        tovary: d.items.map(function (i) { return { tovarId: String(i.tovarId), nazvanie: names[String(i.tovarId)] || ("товар " + i.tovarId), kolichestvo: Number(i.kolichestvo) }; }),
        foto: d.foto.dataUrl || "", lat: Number(d.lat), lng: Number(d.lng), rasstoyanie_m: geo.distanceM, dopusk_m: geo.radiusM, status: "", prichina: "",
        punkt_lat: p.lat, punkt_lng: p.lng
      };
      if (!geo.ok) {
        rec.status = "otkaz";
        rec.prichina = "Вы далеко от пункта «" + p.nazvanie + "»: примерно " + geo.distanceM + " м, а нужно не дальше " + geo.radiusM + " м. Подойдите к самому месту и повторите.";
        list.push(rec); zavozDemoWrite_(list);
        var e = new Error(rec.prichina); e.otkaz = true; throw e;
      }
      var go = function () {
        var res = ostatkiDemoPrihod(d.items, p.id);
        if (!res || res.success === false) {
          rec.status = "oshibka"; rec.prichina = (res && res.error) || "склад отказал";
          list.push(rec); zavozDemoWrite_(list);
          throw new Error(rec.prichina);
        }
        rec.status = "prinyat";
        list.push(rec); zavozDemoWrite_(list);
        return { success: true, id: rec.id, vremya: rec.vremya, punkt: p.nazvanie, rasstoyanie_m: geo.distanceM };
      };
      // демо-остатки привязаны к списку пунктов (отдел 03): подгружаем его, прежде чем добавлять
      return (typeof ostatkiPunkty === "function" ? ostatkiPunkty() : Promise.resolve()).then(go);
    });
  }

  // Завозы дня. day «гггг-мм-дд», kurierId пусто = все курьеры (владелец). Promise<{date, zavozy:[…]}>, по времени
  function marshrutLoad(day, kurierId) {
    if (ZAVOZ_DEMO) {
      var list = zavozDemoRead_().filter(function (r) {
        return zavozLocalDay(r.vremya) === day && (!kurierId || String(r.kurier_id) === String(kurierId));
      }).sort(function (a, b) { return new Date(a.vremya).getTime() - new Date(b.vremya).getTime(); });
      return Promise.resolve({ date: day, zavozy: list });
    }
    var body = { date: day };
    if (kurierId) body.telegramId = kurierId;
    return apiPost("getMarshrut", body).then(assertOk);
  }
  // Маршрут курьера за день (отдел 06): список завозов по времени и точки на карте.
  // Общий блок обеих страниц: курьер видит свои завозы в витрине, владелец всех курьеров в пульте («Завозы»).
  // Данные: marshrutLoad (отдел 08, getMarshrut). Карта Leaflet подключена в скелетах обеих страниц.
  // opts: { kurierId: "" (все) или id, who: показывать имя курьера, canPhoto: показывать ссылку на фото, tabId: вкладка }
  function renderMarshrutDnya(box, opts) {
    opts = opts || {};
    var day = opts.day || zavozLocalDay(new Date());
    var mapEl = "mr-map-" + Math.floor(Math.random() * 1e6);
    function alive() { return state.tab === opts.tabId && document.body.contains(box); }
    function killMap() { if (box.__mrMap) { try { box.__mrMap.remove(); } catch (e) {} box.__mrMap = null; } }

    function hm(v) {
      var d = new Date(v);
      if (isNaN(d.getTime())) return "";
      function p(n) { return (n < 10 ? "0" : "") + n; }
      return p(d.getHours()) + ":" + p(d.getMinutes());
    }
    function tovaryText(list) {
      return (list || []).map(function (x) { return esc(x.nazvanie || ("товар " + x.tovarId)) + " ×" + esc(x.kolichestvo); }).join(", ");
    }

    function load() {
      killMap();
      box.innerHTML = '<div class="empty-state"><span class="eyebrow">Загрузка</span><p>Загружаем маршрут…</p></div>';
      marshrutLoad(day, opts.kurierId || "").then(function (res) {
        if (alive()) draw((res && res.zavozy) || []);
      }).catch(function (e) {
        if (alive()) box.innerHTML = '<div class="empty-state"><span class="eyebrow">Ошибка</span><p>' + esc(e && e.message ? e.message : "Не удалось загрузить маршрут") + '</p></div>';
      });
    }

    function draw(list) {
      killMap();
      var okList = list.filter(function (z) { return z.status === "prinyat"; });
      var failed = list.length - okList.length;
      box.innerHTML =
        '<div class="row-top" style="margin-bottom:10px;align-items:center;">' +
          '<div><div class="screen-title" style="font-size:15px;margin:0;">' + (opts.title || "Маршрут дня") + '</div>' +
          '<div class="screen-sub" style="margin:0;">' + okList.length + ' завозов' + (failed ? ' · ' + failed + ' отказов' : '') + '</div></div>' +
          '<input type="date" class="mr-day" value="' + esc(day) + '" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;background:var(--surface);color:var(--text);font-size:12px;" />' +
        '</div>' +
        '<div id="' + mapEl + '" style="height:220px;border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:12px;isolation:isolate;display:' + (list.length && typeof L !== "undefined" ? "block" : "none") + ';"></div>' +
        (list.length ? '<div class="row-list">' + list.map(function (z, i) {
          var ok = z.status === "prinyat";
          var n = ok ? okList.indexOf(z) + 1 : 0;
          var foto = "";
          if (z.foto && String(z.foto).indexOf("data:") === 0) foto = '<img src="' + esc(z.foto) + '" alt="Фото завоза" style="width:100%;max-height:140px;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);" />';
          else if (z.foto && opts.canPhoto) foto = '<a class="act-btn" style="text-decoration:none;" href="' + esc(z.foto) + '" target="_blank" rel="noopener">Открыть фото</a>';
          return '<div class="row-card">' +
            '<div class="row-top"><span class="id" style="font-size:14px;">' + (ok ? n + '. ' : '') + hm(z.vremya) + ' · ' + esc(z.punkt_nazvanie) + '</span>' +
              '<span class="pill ' + (ok ? "delivered" : "cancelled") + '"><span class="dot"></span>' + (ok ? "Принят" : (z.status === "otkaz" ? "Отказ" : "Ошибка склада")) + '</span></div>' +
            '<div class="row-sum"><span class="addr" style="white-space:normal;">' + tovaryText(z.tovary) + '</span></div>' +
            '<div class="screen-sub" style="margin:0;">' + (z.rasstoyanie_m != null ? z.rasstoyanie_m + ' м от пункта' : 'расстояние не определено') +
              (opts.who && z.kurier_imya ? ' · ' + esc(z.kurier_imya) : '') + '</div>' +
            (!ok && z.prichina ? '<div style="background:var(--danger-bg);color:var(--danger);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;">' + esc(z.prichina) + '</div>' : '') +
            foto +
          '</div>';
        }).join("") + '</div>' : '<div class="empty-state"><span class="eyebrow">Пусто</span><p>' + (day === zavozLocalDay(new Date()) ? 'Сегодня завозов ещё не было' : 'В этот день завозов не было') + '</p></div>');

      box.querySelector(".mr-day").addEventListener("change", function (e) {
        if (e.target.value) { day = e.target.value; load(); }
      });
      if (list.length && typeof L !== "undefined") buildMap(list, okList);
    }

    function buildMap(list, okList) {
      var el = document.getElementById(mapEl);
      if (!el) return;
      var map = L.map(el);
      box.__mrMap = map;
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);
      var pts = [], line = [];
      okList.forEach(function (z, i) {
        if (z.punkt_lat == null || z.punkt_lng == null) return;
        var ll = [Number(z.punkt_lat), Number(z.punkt_lng)];
        pts.push(ll); line.push(ll);
        var icon = L.divIcon({ className: "", html: '<div style="background:var(--accent,#2563eb);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);">' + (i + 1) + '</div>', iconSize: [24, 24], iconAnchor: [12, 12] });
        L.marker(ll, { icon: icon }).bindTooltip(esc(hm(z.vremya) + " " + z.punkt_nazvanie)).addTo(map);
      });
      if (line.length > 1) L.polyline(line, { color: "#5b6472", weight: 3, dashArray: "6 6" }).addTo(map);
      list.filter(function (z) { return z.status !== "prinyat" && z.lat != null; }).forEach(function (z) {
        var ll = [Number(z.lat), Number(z.lng)];
        pts.push(ll);
        L.circleMarker(ll, { radius: 6, color: "#c0392b", weight: 2, fillOpacity: 0.4 }).bindTooltip("Отказ: " + esc(hm(z.vremya))).addTo(map);
      });
      if (pts.length === 1) map.setView(pts[0], 16);
      else if (pts.length) map.fitBounds(pts, { padding: [24, 24] });
      else map.setView([12.2388, 109.1967], 13);
      setTimeout(function () { if (box.__mrMap === map) map.invalidateSize(); }, 60);
    }

    load();
  }
  // Экран курьера «Привёз» (отдел 08): выбрать пункт, отметить товары и количество, сделать фото.
  // В момент фото берутся геометка и время; сервер сам проверит расстояние до пункта и поставит своё время.
  // В демо геометку подставляют кнопки «Я у пункта» и «Я далеко». Маршрут дня под формой рисует блок отдела 06.
  var zavozForm_ = { open: false, punkt: "", qty: {}, foto: null, geo: null, busy: false, note: "" };

  function zavozResetForm_() { zavozForm_ = { open: false, punkt: "", qty: {}, foto: null, geo: null, busy: false, note: "" }; }

  // Геопозиция телефона. Promise<{lat, lng, acc}>
  function zavozGetGeo_() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) { reject(new Error("Геопозиция недоступна на этом устройстве")); return; }
      navigator.geolocation.getCurrentPosition(function (pos) {
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0) });
      }, function () { reject(new Error("Не удалось определить место: разрешите приложению геопозицию")); }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
    });
  }

  function renderZavozCourier(box) {
    Promise.all([loadPunkty(), zavozTovary().catch(function () { return []; })]).then(function (r) {
      if (state.tab !== "delivery" || !document.body.contains(box)) return;
      state.zavozTovary = r[1];
      draw(r[0] || [], r[1] || []);
    }).catch(function (e) {
      box.innerHTML = '<div class="empty-state"><span class="eyebrow">Ошибка</span><p>' + esc(e && e.message ? e.message : "Не удалось загрузить пункты") + '</p></div>';
    });

    function draw(punkty, tovary) {
      var f = zavozForm_;
      if (f.open && !f.punkt && punkty[0]) f.punkt = String(punkty[0].id);
      var canIssue = can("orders_issue") || can("courier_work");
      box.innerHTML =
        '<div class="card" style="margin-bottom:16px;">' +
          '<span class="eyebrow">Завоз на пункт</span>' +
          (f.open ? form(punkty, tovary) :
            '<div style="margin-top:12px;"><button class="btn-primary" id="zv-open" style="font-size:20px;padding:18px 12px;">Привёз</button>' +
            '<div class="screen-sub" style="margin-top:8px;">Выберите пункт, отметьте товары и сделайте фото на месте</div></div>') +
        '</div>' +
        (canIssue ? '<div class="card" style="margin-bottom:16px;"><span class="eyebrow">Выдача заказов</span>' +
          '<div style="margin-top:10px;"><button class="act-btn" id="zv-issue">Выдать заказ клиенту по коду</button></div></div>' : '') +
        '<div id="zv-route" style="margin-bottom:16px;"></div>';

      renderMarshrutDnya(document.getElementById("zv-route"), { kurierId: zavozKurierId(), tabId: "delivery", canPhoto: false, title: "Мой маршрут за день" });
      var issue = document.getElementById("zv-issue");
      if (issue) issue.addEventListener("click", function () { state.tab = "orders"; renderApp(); });
      var open = document.getElementById("zv-open");
      if (open) open.addEventListener("click", function () { zavozForm_.open = true; draw(punkty, tovary); });
      if (f.open) bind(punkty, tovary);
    }

    function pointOf(punkty) {
      for (var i = 0; i < punkty.length; i++) if (String(punkty[i].id) === String(zavozForm_.punkt)) return punkty[i];
      return null;
    }

    function form(punkty, tovary) {
      var f = zavozForm_;
      if (!punkty.length) return '<div class="empty-state" style="margin-top:12px;"><span class="eyebrow">Нет пунктов</span><p>Пока нет активных пунктов: их ставит картограф</p></div>';
      var geoTxt = f.geo ? ('Геопозиция получена' + (f.geo.acc ? ', точность около ' + f.geo.acc + ' м' : '') + (f.geo.demo ? ' (демо)' : '')) : 'Геопозиция снимается вместе с фото';
      return '<div style="margin-top:12px;">' +
        '<div class="field"><label>Пункт</label><select id="zv-punkt">' + punkty.map(function (p) {
          return '<option value="' + esc(p.id) + '"' + (String(p.id) === String(f.punkt) ? ' selected' : '') + '>' + esc(p.nazvanie) + '</option>';
        }).join("") + '</select><div class="screen-sub" style="margin:0;">' + esc((pointOf(punkty) || {}).adres || "") + '</div></div>' +
        '<div class="field"><label>Что привёз и сколько</label>' + (tovary.length ? tovary.map(function (t) {
          var q = Number(f.qty[String(t.tovarId)] || 0);
          return '<div class="row-top" style="align-items:center;margin-bottom:6px;"><span style="font-size:13px;">' + esc(t.name) + '</span>' +
            '<span style="display:flex;gap:6px;align-items:center;"><button class="act-btn" data-q="-1" data-id="' + esc(t.tovarId) + '" type="button">−</button>' +
            '<input data-qty="' + esc(t.tovarId) + '" type="number" min="0" step="1" inputmode="numeric" value="' + q + '" style="width:56px;text-align:center;" />' +
            '<button class="act-btn" data-q="1" data-id="' + esc(t.tovarId) + '" type="button">+</button></span></div>';
        }).join("") : '<div class="screen-sub">Список товаров не загрузился</div>') + '</div>' +
        '<div class="field"><label>Фото места (обязательно)</label><input type="file" id="zv-file" accept="image/*" capture="environment" />' +
          (f.foto ? '<img src="' + esc(f.foto.dataUrl) + '" alt="Фото" style="margin-top:8px;max-width:100%;max-height:160px;border-radius:var(--radius-sm);border:1px solid var(--border);" />' : '') +
          '<div class="screen-sub" style="margin:0;" id="zv-geo">' + geoTxt + '</div></div>' +
        (ZAVOZ_DEMO ? '<div class="row-actions" style="margin-bottom:12px;"><button class="act-btn" id="zv-near" type="button">Я у пункта</button><button class="act-btn" id="zv-far" type="button">Я далеко</button></div>' : '') +
        (f.note ? '<div id="zv-note" style="background:var(--danger-bg);color:var(--danger);border-radius:var(--radius-sm);padding:8px 10px;font-size:12px;margin-bottom:12px;">' + esc(f.note) + '</div>' : '') +
        '<div class="row-actions"><button class="btn-primary" id="zv-send" type="button"' + (f.busy ? ' disabled' : '') + '>' + (f.busy ? 'Отправляем…' : 'Отправить завоз') + '</button>' +
          '<button class="act-btn" id="zv-cancel" type="button">Отмена</button></div>' +
      '</div>';
    }

    function bind(punkty, tovary) {
      var f = zavozForm_;
      var sel = document.getElementById("zv-punkt");
      if (!sel) return;
      sel.addEventListener("change", function () { f.punkt = sel.value; f.geo = null; f.note = ""; draw(punkty, tovary); });
      box.querySelectorAll("[data-qty]").forEach(function (inp) {
        inp.addEventListener("change", function () { f.qty[inp.getAttribute("data-qty")] = Math.max(0, Math.floor(Number(inp.value) || 0)); });
      });
      box.querySelectorAll("[data-q]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-id");
          f.qty[id] = Math.max(0, (Number(f.qty[id]) || 0) + Number(b.getAttribute("data-q")));
          var inp = box.querySelector('[data-qty="' + id + '"]');
          if (inp) inp.value = f.qty[id];
        });
      });
      document.getElementById("zv-file").addEventListener("change", function (e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        punktFotoFromFile(file).then(function (foto) {
          f.foto = foto; f.note = "";
          // геометка берётся в тот же момент, что и фото (в демо её ставят кнопки)
          if (ZAVOZ_DEMO) { draw(punkty, tovary); return; }
          return zavozGetGeo_().then(function (g) { f.geo = g; }, function (err) { f.geo = null; f.note = err.message; }).then(function () { draw(punkty, tovary); });
        }).catch(function (err) { toast(err && err.message ? err.message : "Фото не принято"); });
      });
      var near = document.getElementById("zv-near"), far = document.getElementById("zv-far");
      if (near) near.addEventListener("click", function () {
        var p = pointOf(punkty); if (!p) return;
        f.geo = { lat: Number(p.lat) + 0.00008, lng: Number(p.lng) + 0.00008, demo: true }; f.note = ""; draw(punkty, tovary);
      });
      if (far) far.addEventListener("click", function () {
        var p = pointOf(punkty); if (!p) return;
        f.geo = { lat: Number(p.lat) + 0.02, lng: Number(p.lng) + 0.02, demo: true }; f.note = ""; draw(punkty, tovary);
      });
      document.getElementById("zv-cancel").addEventListener("click", function () { zavozResetForm_(); draw(punkty, tovary); });
      document.getElementById("zv-send").addEventListener("click", function () {
        if (f.busy) return;
        var items = [];
        Object.keys(f.qty).forEach(function (id) { if (Number(f.qty[id]) > 0) items.push({ tovarId: id, kolichestvo: Number(f.qty[id]) }); });
        if (!items.length) { toast("Отметьте, какие товары привезли и сколько"); return; }
        if (!f.foto) { toast("Сделайте фото места"); return; }
        if (!f.geo) { toast(ZAVOZ_DEMO ? "Нажмите «Я у пункта»: так в демо берётся геометка" : "Нет геометки: разрешите геопозицию и сделайте фото ещё раз"); return; }
        f.busy = true; f.note = ""; draw(punkty, tovary);
        zavozSend({ punkt_id: f.punkt, items: items, foto: f.foto, lat: f.geo.lat, lng: f.geo.lng }).then(function (res) {
          toast("Завоз принят: товар теперь на пункте");
          zavozResetForm_(); state.productsLoaded = false; draw(punkty, tovary);
        }).catch(function (err) {
          f.busy = false; f.note = err && err.message ? err.message : "Завоз не принят";
          if (err && err.otkaz) f.geo = null;   // после отказа геометку снимают заново
          draw(punkty, tovary);
        });
      });
    }
  }
  render();
  loadTexts().then(function () { applyBranding(); render(); });
  // Внутри Telegram роль определяется базой автоматически, без экрана выбора
  if (tg && state.telegramId && !state.role) loginById(state.telegramId);
})();
</script>
</body>
</html>
