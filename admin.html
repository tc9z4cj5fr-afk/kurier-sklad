<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ЦУБ · Центр управления бизнесом</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f5f6f7;
    --surface: #ffffff;
    --surface-2: #eef0f2;
    --text: #14171c;
    --muted: #5b6472;
    --border: #dee2e6;
    --accent: #2b3648;
    --accent-strong: #171d28;
    --accent-soft: #e9ebee;
    --shadow: 0 1px 2px rgba(20, 23, 28, 0.05), 0 4px 16px rgba(20, 23, 28, 0.05);
    --ok: #1f7a52;
    --ok-bg: #e6f4ee;
    --warn: #9a6a10;
    --warn-bg: #f7f0dd;
    --info: #2f5aa3;
    --info-bg: #e9eefb;
    --danger: #ac3038;
    --danger-bg: #fbe9ea;
    --radius-lg: 14px;
    --radius: 10px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  :root[data-theme="dark"] {
    --bg: #101216;
    --surface: #171a1f;
    --surface-2: #1f232a;
    --text: #edeff2;
    --muted: #8b93a1;
    --border: #2a2f37;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    --accent: #c3cbdb;
    --accent-strong: #eef1f7;
    --accent-soft: #232833;
    --ok-bg: #12301f;
    --warn-bg: #332a10;
    --info-bg: #16233c;
    --danger-bg: #3a1a1d;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216;
      --surface: #171a1f;
      --surface-2: #1f232a;
      --text: #edeff2;
      --muted: #8b93a1;
      --border: #2a2f37;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
      --accent: #c3cbdb;
      --accent-strong: #eef1f7;
      --accent-soft: #232833;
      --ok-bg: #12301f;
      --warn-bg: #332a10;
      --info-bg: #16233c;
      --danger-bg: #3a1a1d;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  #root { min-height: 100%; display: flex; justify-content: center; }

  .shell {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  @media (min-width: 600px) {
    body { background: var(--surface-2); padding: 24px 0; }
    .shell {
      min-height: calc(100vh - 48px);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
      border: 1px solid var(--border);
    }
  }

  button, select, input, textarea { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .eyebrow {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- Login ---------- */
  .login {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    color: var(--text);
    padding: 40px 24px 28px;
  }
  .login-head { margin-bottom: 30px; }
  .login-head .mark {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; margin-bottom: 16px; color: var(--text);
  }
  .login-head .mark svg { width: 44px; height: 44px; display: block; }
  .login-head .eyebrow { display: block; margin-bottom: 8px; }
  .login-head h1 { font-size: 21px; font-weight: 700; margin: 0 0 6px; text-wrap: balance; letter-spacing: -0.01em; }
  .login-head p { margin: 0; font-size: 13px; color: var(--muted); }

  .id-field {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
    background: var(--surface-2); margin-bottom: 16px;
  }
  .id-field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .id-field input {
    width: 100%; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 14px;
  }
  .id-field .hint { font-size: 11px; color: var(--muted); margin-top: 7px; }

  /* ---------- Shell after login ---------- */
  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 13px 16px; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--surface); z-index: 5;
  }
  .topbar .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; color: var(--text); flex-shrink: 0;
  }
  .topbar .avatar svg { width: 16px; height: 16px; display: block; }
  .topbar .who { flex: 1; min-width: 0; }
  .topbar .who .name { font-size: 12.5px; font-weight: 700; }
  .topbar .who .role { font-size: 11px; color: var(--muted); }
  .topbar .switch-btn {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: var(--radius-sm); padding: 7px 10px; font-size: 12px; cursor: pointer;
  }
  .topbar .switch-btn:hover { background: var(--surface-2); }

  main { flex: 1; padding: 18px 16px; padding-bottom: 88px; overflow-y: auto; }
  .screen-title { font-size: 17px; font-weight: 700; margin: 2px 0 4px; text-wrap: balance; letter-spacing: -0.01em; }
  .screen-sub { font-size: 12px; color: var(--muted); margin: 0 0 16px; }
  .screen-title + .screen-sub { margin-top: 0; }
  .screen-title-row { margin-bottom: 16px; }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    position: sticky; bottom: 0; left: 0; right: 0;
    display: flex; background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 0 4px calc(0px + env(safe-area-inset-bottom));
    z-index: 5;
  }
  nav.tabbar button {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: none; border: none; border-top: 2px solid transparent; color: var(--muted); font-size: 11.5px; font-weight: 500;
    padding: 13px 2px 11px; cursor: pointer; position: relative;
  }
  nav.tabbar button.active { color: var(--text); font-weight: 700; border-top-color: var(--accent); }

  /* ---------- Cards / rows ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .row-list { display: flex; flex-direction: column; gap: 10px; }
  .row-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px;
    display: flex; flex-direction: column; gap: 8px; background: var(--surface);
  }
  .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .row-top .id { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .row-top .date { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600;
    padding: 4px 9px 4px 7px; border-radius: 999px; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .pill.waiting { background: var(--warn-bg); color: var(--warn); }
  .pill.waiting .dot { background: var(--warn); }
  .pill.transit { background: var(--info-bg); color: var(--info); }
  .pill.transit .dot { background: var(--info); }
  .pill.delivered { background: var(--ok-bg); color: var(--ok); }
  .pill.delivered .dot { background: var(--ok); }
  .pill.cancelled { background: var(--danger-bg); color: var(--danger); }
  .pill.cancelled .dot { background: var(--danger); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field label { font-size: 11px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--muted); }
  .field input, .field textarea, .field select {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 13.5px; background: var(--surface); color: var(--text); font-family: inherit;
  }
  .field textarea { resize: vertical; }

  .btn-primary {
    width: 100%; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700;
    font-size: 14px; padding: 13px; border-radius: var(--radius); cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-secondary {
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    font-weight: 600; font-size: 13px; padding: 10px 14px; border-radius: var(--radius); cursor: pointer;
  }
  .btn-secondary:hover { background: var(--surface-2); }
  .act-btn {
    font-size: 12px; font-weight: 600; border-radius: var(--radius-sm);
    border: 1px solid var(--border); padding: 6px 10px;
    background: var(--surface); color: var(--text); cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center;
  }
  .act-btn:hover { background: var(--surface-2); }
  .act-btn.danger { color: var(--danger); }

  .empty-state { text-align: center; padding: 52px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
  .empty-state .eyebrow { display: block; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; margin: 0; }

  /* ---------- Metrics ---------- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .stat-card .val { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .stat-card .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* ---------- Аналитика ---------- */
  .bars { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-row .lbl { width: 44px; font-size: 11px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .bar-track { flex: 1; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .num { width: 88px; text-align: right; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .pnl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .pnl-row:last-of-type { border-bottom: none; padding-bottom: 2px; }
  .pnl-row .lbl { font-size: 12.5px; color: var(--muted); }
  .pnl-row .num { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pnl-row.total .lbl { color: var(--text); font-weight: 700; }
  .pnl-row.total .num { font-weight: 700; }
  .pnl-row .num.danger, .unit-row .m.danger { color: var(--danger); }

  .unit-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .unit-row:last-of-type { border-bottom: none; padding-bottom: 2px; }
  .unit-row .n { font-size: 13px; font-weight: 600; }
  .unit-row .s { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .unit-row .m { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .unit-row .m .sub { display: block; font-size: 10px; font-weight: 500; }

  /* ---------- ЦУБ specifics ---------- */
  .state-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 10px 0 14px; }
  .state-line { font-size: 16px; font-weight: 700; }
  .link-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .kv-row { display: flex; flex-direction: column; gap: 6px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .kv-row:first-of-type { padding-top: 2px; }
  .kv-row:last-of-type { border-bottom: none; padding-bottom: 2px; }
  .kv-key {
    font-family: var(--mono); font-size: 11px; font-weight: 700;
    letter-spacing: 0.04em; color: var(--muted);
  }
  .kv-row input {
    border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 11px;
    font-size: 13px; background: var(--surface); color: var(--text); width: 100%;
  }
  .legend { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 8px 0 0; }
  .legend code { font-family: var(--mono); font-size: 11px; color: var(--text); }
  .hint-note { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 12px 0 0; }
  .task-text { font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }

  .section-gap { margin-top: 24px; }
  .toast {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
    background: var(--accent-strong); color: var(--surface); font-size: 12.5px; font-weight: 600;
    padding: 10px 16px; border-radius: var(--radius-sm); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 20; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (prefers-reduced-motion: reduce) {
    .toast { transition: none; }
  }
</style>
</head>
<body>
<div id="root"><div class="shell" id="shell"></div></div>

<script>
(function () {
  "use strict";

  var API_URL = "https://script.google.com/macros/s/AKfycbyJERQB9Gh087cRwav4RsMevwp3p1LnZWmoqVK4G8OqidhXML8RPC1GEmSBBJUEyaJo/exec";
  var MARK =
    '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="M4.5 7h15M4.5 12h15M4.5 17h15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>' +
    '<circle cx="9.5" cy="7" r="2.1" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>' +
    '<circle cx="15" cy="12" r="2.1" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>' +
    '<circle cx="8" cy="17" r="2.1" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>' +
    '</svg>';

  var TABS = [
    { id: "status", label: "Статус" },
    { id: "analytics", label: "Аналитика" },
    { id: "texts", label: "Настройки" },
    { id: "products", label: "Товары" },
    { id: "people", label: "Люди" },
    { id: "zones", label: "Зоны" },
    { id: "points", label: "Пункты" },
    { id: "money", label: "Деньги" },
    { id: "zavozy", label: "Завозы" },
    { id: "claude", label: "Чат с админом" }
  ];

  // Какие разрешения открывают вкладку пульта (dogovor/RAZRESHENIYA.md, «Вкладки ЦУБа»): нужно любое из
  var CUB_TAB_NEED = {
    status: ["bot_manage", "settings_edit", "metrics_view"],
    analytics: ["finance_view"],
    texts: ["settings_edit"],
    products: ["products_edit", "stock_edit"],
    people: ["people_view"],
    zones: ["zones_edit"],
    points: ["points_edit"],
    money: ["cash_manage", "cash_handover", "settings_edit"],
    zavozy: ["proof_view"],
    claude: ["tasks_manage"]
  };

  var ROLES = [
    { id: "owner", label: "Владелец" },
    { id: "admin", label: "Администратор" },
    { id: "kladovshchik", label: "Кладовщик" },
    { id: "prodavec", label: "Продавец" },
    { id: "dostavshchik", label: "Доставщик" },
    { id: "client", label: "Клиент" }
  ];

  var tg = (typeof window.Telegram !== "undefined" && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

  var state = {
    cubId: localStorage.getItem("cub_id") || "",
    role: localStorage.getItem("cub_role") || "owner",
    cubToken: localStorage.getItem("cub_token") || "",
    tab: "status",
    texts: {}
  };
  if (state.role === "buh") state.tab = "analytics";
  // Пульт без пропуска бесполезен (сервер откажет) — сразу на экран входа
  if (state.cubId && !state.cubToken) state.cubId = "";

  // ---------------- API ----------------
  function apiPost(action, payload) {
    var body = payload || {};
    // Общего ключа в коде страницы нет. Пропуск выдаёт сервер после пароля владельца и подписывает
    // сам; он живёт ограниченное время (по умолчанию 12 ч), по нему сервер даёт права ЦУБ
    if (state.cubToken) body.cubToken = state.cubToken;
    return fetch(API_URL + "?action=" + encodeURIComponent(action), {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }
  // Пропуск истёк или прав нет — выходим на экран входа, чтобы войти заново
  function cubLogout_() {
    state.cubId = "";
    state.cubToken = "";
    localStorage.removeItem("cub_id");
    localStorage.removeItem("cub_role");
    localStorage.removeItem("cub_token");
    setTimeout(render, 60);
  }
  function assertOk(res) {
    if (res && res.success === false) {
      if (res.authRequired) cubLogout_();
      throw new Error(res.error || "Ошибка сервера");
    }
    return res;
  }

  // ---------------- helpers ----------------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function errMsg(e) {
    return (e && e.message) ? e.message : "Ошибка запроса";
  }
  function money(n) {
    return fmtMoney(n);
  }
  function num(v) {
    var n = parseFloat(v);
    return isFinite(n) ? n : 0;
  }
  function fmtDate(v) {
    if (!v) return "";
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short", year: "numeric" });
  }
  // Список месяцев для отчёта и выгрузка CSV
  var MONTH_NAMES_RU = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];
  function monthKeyNow_() {
    var d = new Date();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
  }
  function monthOptionsHTML_(sel) {
    var out = "";
    var d = new Date();
    for (var i = 0; i < 12; i++) {
      var val = d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2);
      out += '<option value="' + val + '"' + (val === (sel || monthKeyNow_()) ? " selected" : "") + '>' +
        MONTH_NAMES_RU[d.getMonth()] + " " + d.getFullYear() + '</option>';
      d.setDate(1);
      d.setMonth(d.getMonth() - 1);
    }
    return out;
  }
  function csvCell_(v) { return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; }
  // \u0421\u043A\u0430\u0447\u0438\u0432\u0430\u043D\u0438\u0435 \u043D\u0430 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0435: \u0441\u043D\u0430\u0447\u0430\u043B\u0430 \u043F\u0440\u043E\u0431\u0443\u0435\u043C \u0441\u0438\u0441\u0442\u0435\u043C\u043D\u043E\u0435 \u00AB\u041F\u043E\u0434\u0435\u043B\u0438\u0442\u044C\u0441\u044F\u00BB (\u0431\u0440\u0430\u0443\u0437\u0435\u0440 \u0441\u0430\u043C

    var list = null;
    try { list = JSON.parse(localStorage.getItem("cub_perms") || "null"); } catch (e) {}
    state.perms = permsObj_(Array.isArray(list) ? list : permsOfLegacyRole_(state.role));
  })();

  // ---------------- rendering ----------------
  var shell = document.getElementById("shell");

  function render() {
    if (!state.cubId) renderLogin();
    else renderApp();
  }

  function renderLogin() {
    // Открыт как мини-апп пульта внутри Telegram — сам подставляем номер
    // владельца (Telegram его сообщает), остаётся ввести только пароль.
    var tgId = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? String(tg.initDataUnsafe.user.id) : "";
    var prefillId = state.cubId || tgId || "";
    shell.innerHTML =
      '<div class="login">' +
        '<div class="login-head">' +
          '<span class="eyebrow">Центр управления бизнесом</span>' +
          '<div class="mark">' + MARK + '</div>' +
          '<h1>' + esc(t("pub_cub_name")) + '</h1>' +
          '<p>' + esc(t("pub_cub_subtitle")) + '</p>' +
        '</div>' +
        '<div class="id-field">' +
          '<label>Telegram ID' + (tgId ? ' · определён автоматически' : '') + '</label>' +
          '<input id="cub-login-id" type="text" inputmode="numeric" placeholder="Ваш номер" autocomplete="off" value="' + esc(prefillId) + '"' + (tgId ? ' readonly' : '') + ' />' +
          '<label style="margin-top:12px;">Пароль пульта</label>' +
          '<input id="cub-login-pin" type="password" placeholder="Пароль" autocomplete="current-password" />' +
          '<div class="hint" id="cub-login-hint">Доступ только для тех, кому владелец выдал вход в пульт.</div>' +
        '</div>' +
        '<button class="btn-primary" id="cub-login-btn">Войти</button>' +
        // Вход без пароля только в демо (?demo=1), сервер не вызывается
        (CUB_DEMO ? '<button class="btn-secondary" id="cub-demo-btn" style="margin-top:10px;">Демо-вход (без пароля)</button>' : '') +
      '</div>' +
      '<div class="toast" id="toast"></div>';

    var input = document.getElementById("cub-login-id");
    // В Telegram сразу ставим курсор в поле пароля — номер уже подставлен
    if (tgId) { var pinPre = document.getElementById("cub-login-pin"); if (pinPre) setTimeout(function () { pinPre.focus(); }, 60); }
    var btn = document.getElementById("cub-login-btn");
    var hint = document.getElementById("cub-login-hint");

    // Роль и пароль проверяет бэкенд (cubLogin): в браузере такой проверке верить
    // нельзя — раньше пульт пускал по одному номеру, а номер владельца не секрет.
    function doLogin() {
      var id = input.value.trim();
      var pinEl = document.getElementById("cub-login-pin");
      var pin = pinEl ? pinEl.value : "";
      if (!id) { toast("Укажите Telegram ID"); return; }
      if (!pin) { toast("Введите пароль пульта"); return; }
      btn.disabled = true;
      btn.textContent = "Проверяем…";
      apiPost("cubLogin", { telegramId: id, pin: pin })
        .then(assertOk)
        .then(function (res) {
          var granted = res && (Array.isArray(res.permissions) ? res.permissions.indexOf("cub_enter") !== -1 : !!res.role);
          if (!granted) {
            btn.disabled = false;
            btn.textContent = "Войти";
            hint.textContent = "Доступа нет.";
            toast("Доступа нет");
            return;
          }
          cubSetAccess_(res, id);
          render();
        })
        .catch(function (e) {
          btn.disabled = false;
          btn.textContent = "Войти";
          toast(errMsg(e));
        });
    }

    btn.addEventListener("click", doLogin);
    input.addEventListener("keydown", function (ev) { if (ev.key === "Enter") doLogin(); });
    var pinInput = document.getElementById("cub-login-pin");
    if (pinInput) pinInput.addEventListener("keydown", function (ev) { if (ev.key === "Enter") doLogin(); });
    var demoBtn = document.getElementById("cub-demo-btn");
    if (demoBtn) demoBtn.addEventListener("click", function () {
      cubSetAccess_({ role: "owner", token: "demo" }, "demo");
      render();
    });
  }
  // «Смотреть как…» для владельца: меню выбранной должности. Только вид, сервер проверяет права по пропуску как обычно.
  function cubViewAsSet_(id) {
    if (!state.cubRealPerms) return;
    var p = POSITION_PRESETS.filter(function (x) { return x.id === id; })[0];
    state.cubViewAs = p ? id : "";
    state.perms = p ? permsObj_(p.perms) : state.cubRealPerms;
    renderApp();
  }
  function cubViewAsHTML_() {
    if (CUB_DEMO || !state.cubRealPerms) return "";
    return '<button class="switch-btn" id="cub-view-as" title="Смотреть как…">Сменить роль</button>';
  }
  function cubViewAsPick_(onPick, current) {
    var old = document.getElementById("view-as-pick"); if (old) old.remove();
    var box = document.createElement("div");
    box.id = "view-as-pick";
    box.style.cssText = "position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;";
    var list = [{ id: "", name: "Владелец (я)", sub: "Полный контроль системы" }].concat(POSITION_PRESETS.filter(function (p) { return p.id !== "owner"; }));
    box.innerHTML = '<div style="background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);width:100%;max-width:360px;max-height:80vh;overflow:auto;padding:8px;">' +
      '<div style="font-size:12px;padding:8px 10px;opacity:.7;">Смотреть как… Это только вид: права на сервере остаются ваши.</div>' +
      list.map(function (p) {
        return '<button class="switch-btn" data-va="' + esc(p.id) + '" style="display:block;width:100%;text-align:left;margin:4px 0;padding:10px;font-size:14px;' + ((current || "") === p.id ? "font-weight:700;" : "") + '">' + esc(p.name) +
          (p.sub ? '<div style="font-size:11px;opacity:.65;font-weight:400;">' + esc(p.sub) + '</div>' : '') + '</button>';
      }).join("") + '</div>';
    box.addEventListener("click", function (e) {
      var b = e.target.closest ? e.target.closest("[data-va]") : null;
      if (b) { box.remove(); onPick(b.getAttribute("data-va")); }
      else if (e.target === box) box.remove();
    });
    document.body.appendChild(box);
  }

  function renderApp() {
    if (!state.cubViewAs) state.cubRealPerms = cubCan("people_manage") ? state.perms : null;
    // Вкладки по разрешениям человека; сервер всё равно проверяет каждый запрос
    var tabs = TABS.filter(function (tb) { return cubCanAny(CUB_TAB_NEED[tb.id] || []); });
    if (!tabs.length && !state.cubViewAs) { cubLogout_(); return; }
    if (tabs.length && !tabs.some(function (tb) { return tb.id === state.tab; })) state.tab = tabs[0].id;
    // Полные настройки (с ключами для вошедшего) подгружаем один раз после входа
    if (!CUB_DEMO && !state.settingsFull) { state.settingsFull = true; loadSettings().then(function () { renderApp(); }); }
    var roleLabel = (state.positionNames && state.positionNames.length) ? state.positionNames.join(" + ") : (state.role === "buh" ? "Бухгалтер" : state.role === "owner" ? "Владелец" : "Сотрудник");
    shell.innerHTML =
      '<div class="topbar">' +
        '<div class="avatar">' + MARK + '</div>' +
        '<div class="who"><div class="name">' + esc(t("pub_cub_name") || "ЦУБ") + '</div><div class="role">' + esc(roleLabel + (state.cubViewAs ? " · просмотр" : "")) + '</div></div>' +
        cubViewAsHTML_() +
        '<button class="switch-btn" id="cub-logout">Выйти</button>' +
      '</div>' +
      '<main id="main"></main>' +
      '<nav class="tabbar">' +
        tabs.map(function (t) {
          return '<button data-tab="' + t.id + '" class="' + (t.id === state.tab ? "active" : "") + '"><span>' + t.label + '</span></button>';
        }).join("") +
      '</nav>' +
      '<div class="toast" id="toast"></div>';

    var cva = document.getElementById("cub-view-as");
    if (cva) cva.addEventListener("click", function () { cubViewAsPick_(cubViewAsSet_, state.cubViewAs); });
    document.getElementById("cub-logout").addEventListener("click", function () {
      state.cubViewAs = "";
      state.cubRealPerms = null;
      localStorage.removeItem("cub_id");
      localStorage.removeItem("cub_role");
      localStorage.removeItem("cub_token");
      localStorage.removeItem("cub_perms");
      state.settingsFull = false;
      state.cubId = "";
      state.cubToken = "";
      state.role = "owner";
      state.tab = "status";
      render();
    });
    shell.querySelectorAll("[data-tab]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.tab = btn.getAttribute("data-tab");
        renderApp();
      });
    });

    if (!tabs.length) { document.getElementById("main").innerHTML = '<p class="hint-note" style="padding:16px;">У этой должности в пульте вкладок нет: её работа в самом приложении.</p>'; return; }
    renderTab();
  }

  function renderTab() {
    var main = document.getElementById("main");
    if (!main) return;
    main.innerHTML = loadingHTML();
    if (state.tab === "status") return renderStatus(main);
    if (state.tab === "analytics") return renderAnalytics(main);
    if (state.tab === "texts") return renderTexts(main);
    if (state.tab === "products") return renderProducts(main);
    if (state.tab === "people") return renderPeople(main);
    if (state.tab === "zones") return renderZones(main);
    if (state.tab === "points") return renderPunktyCub(main);
    if (state.tab === "money") return renderMoney(main);
    if (state.tab === "zavozy") return renderZavozyCub(main);
    if (state.tab === "claude") return renderClaude(main);
  }

  // ---------------- Статус ----------------
  function renderStatus(main) {
    Promise.all([
      apiPost("getTexts").then(assertOk),
      apiPost("getMetrics", {}).then(assertOk).catch(function (e) { return { __err: errMsg(e) }; })
    ]).then(function (rs) {
      if (state.tab !== "status") return;
      state.texts = (rs[0] && rs[0].texts) || {};
      var m = rs[1] && rs[1].metrics ? rs[1].metrics : null;
      var mErr = rs[1] && rs[1].__err;
      var locked = String(state.texts.site_locked || "") === "1";
      var courierOn = String(state.texts.courier_enabled || "1") !== "0";

      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Статус</div>' +
        '<div class="screen-sub">Состояние приложения и ключевые показатели</div></div>' +

        '<div class="card">' +
          '<span class="eyebrow">Состояние приложения</span>' +
          '<div class="state-row">' +
            '<span class="state-line">' + (locked ? "Приложение закрыто" : "Приложение открыто") + '</span>' +
            (locked
              ? '<span class="pill cancelled"><span class="dot"></span>Закрыт</span>'
              : '<span class="pill delivered"><span class="dot"></span>Открыт</span>') +
          '</div>' +
          (locked
            ? fieldHTML("Текст заглушки (lock_message)",
                '<input id="lock-message" value="' + esc(state.texts.lock_message || "") + '" placeholder="Приложение временно закрыто" />') +
              '<button class="btn-primary" id="lock-toggle" style="background:var(--ok);border-color:var(--ok);">Открыть приложение</button>'
            : '<button class="btn-primary" id="lock-toggle" style="background:var(--danger);border-color:var(--danger);">Закрыть приложение</button>') +
          '<div class="state-row" style="margin-top:12px;">' +
            '<span class="state-line">Курьерская доставка</span>' +
            (courierOn
              ? '<button class="act-btn" id="courier-toggle" style="color:var(--ok);">Включена — выключить</button>' +
                ''
              : '<button class="act-btn" id="courier-toggle" style="color:var(--danger);">Выключена — включить</button>') +
          '</div>' +
          '<p class="hint-note">Выключишь — у клиентов останется только самовывоз, кнопка «Курьер» погаснет. Обратно — в один клик.</p>' +
        '</div>' +

        '<div class="card section-gap">' +
          '<span class="eyebrow">Метрики</span>' +
          (m
            ? '<div class="stat-grid" style="margin-top:12px;">' +
                '<div class="stat-card"><div class="val">' + esc(m.totalOrders != null ? m.totalOrders : "—") + '</div><div class="lbl">Заказы</div></div>' +
                '<div class="stat-card"><div class="val">' + esc(m.completedOrders != null ? m.completedOrders : "—") + '</div><div class="lbl">Выполнено</div></div>' +
                '<div class="stat-card"><div class="val">' + (m.totalRevenue != null ? money(m.totalRevenue) : "—") + '</div><div class="lbl">Выручка</div></div>' +
                '<div class="stat-card"><div class="val">' + esc(m.conversionRate != null ? m.conversionRate : "—") + '</div><div class="lbl">Конверсия</div></div>' +
              '</div>'
            : '<p class="hint-note">Метрики недоступны: ' + esc(mErr || "нет данных") + '</p>') +
        '</div>' +

        '<div class="card section-gap">' +
          '<span class="eyebrow">Telegram-бот</span>' +
          '<div id="bot-block"><p class="hint-note">Проверяем ботов…</p></div>' +
        '</div>' +

        '<div class="card section-gap">' +
          '<span class="eyebrow">Оплата</span>' +
          '<p class="hint-note">Способы оплаты (наличные, QR, криптовалюта) и их реквизиты отмечаются галочками во вкладке «Деньги»; поля криптовалюты появляются там под её галочкой.</p>' +
          '<div class="grid-2">' +
            fieldHTML("Курс: 1 " + currencySym() + " в рублях (например 0,0033)",
              '<input id="rate-rub" inputmode="decimal" value="' + esc(state.texts.rate_vnd_to_rub || "") + '" placeholder="0,0033" />') +
            fieldHTML("Курс: 1 " + currencySym() + " в тенге (например 0,021)",
              '<input id="rate-kzt" inputmode="decimal" value="' + esc(state.texts.rate_vnd_to_kzt || "") + '" placeholder="0,021" />') +
          '</div>' +
          '<p class="hint-note">Курсы — только для подсказки клиенту «сколько это в ₽/₸». Оплата всегда в ' + esc(currencySym()) + ': наличными или по QR. Реквизиты вставляй сам, сохраняются сразу.</p>' +
        '</div>' +

        '<div class="card section-gap">' +
          '<span class="eyebrow">Ссылки</span>' +
          '<div class="link-list">' +
            '<a class="act-btn" href="index.html">Приложение</a>' +
            (/^https:\/\//.test(String(state.texts.sheet_url || ""))
              ? '<a class="act-btn" href="' + esc(state.texts.sheet_url) + '" target="_blank" rel="noopener">Google Таблица</a>' : '') +
          '</div>' +
        '</div>';

      if (mErr) toast(mErr);

      var toggle = document.getElementById("lock-toggle");
      toggle.addEventListener("click", function () {
        toggle.disabled = true;
        apiPost("setText", { key: "site_locked", value: locked ? "0" : "1" })
          .then(assertOk)
          .then(function () {
            toast(locked ? "Приложение открыто" : "Приложение закрыто");
            renderTab();
          })
          .catch(function (e) { toast(errMsg(e)); toggle.disabled = false; });
      });

      var lockMsg = document.getElementById("lock-message");
      if (lockMsg) {
        lockMsg.addEventListener("change", function () {
          apiPost("setText", { key: "lock_message", value: lockMsg.value })
            .then(assertOk)
            .then(function () { toast("Текст заглушки сохранён"); })
            .catch(function (e) { toast(errMsg(e)); });
        });
      }

      var courierToggle = document.getElementById("courier-toggle");
      courierToggle.addEventListener("click", function () {
        var newVal = courierOn ? "0" : "1";
        courierToggle.disabled = true;
        apiPost("setText", { key: "courier_enabled", value: newVal })
          .then(assertOk)
          .then(function () { toast(newVal === "1" ? "Курьерская доставка включена" : "Курьерская доставка выключена"); renderTab(); })
          .catch(function (e) { toast(errMsg(e)); courierToggle.disabled = false; });
      });

      [["rate-rub", "rate_vnd_to_rub"], ["rate-kzt", "rate_vnd_to_kzt"]].forEach(function (p) {
        var el = document.getElementById(p[0]);
        if (!el) return;
        el.addEventListener("change", function () {
          apiPost("setText", { key: p[1], value: el.value })
            .then(assertOk)
            .then(function () { toast("Сохранено"); state.texts[p[1]] = el.value; })
            .catch(function (e) { toast(errMsg(e)); });
        });
      });

      renderBotBlock();
    }).catch(function (e) {
      if (state.tab !== "status") return;
      main.innerHTML = errorHTML(errMsg(e));
      toast(errMsg(e));
    });
  }

  // Блок «Telegram-бот»: состояние основного и запасного, ручное переключение.
  // Сторож в бэкенде проверяет основного каждые 30 минут и при блокировке
  // переключает сам; кнопка — на случай, когда нужно не ждать.
  function renderBotBlock() {
    var box = document.getElementById("bot-block");
    if (!box) return;
    function pill(stateName) {
      if (stateName === "alive") return '<span class="pill delivered"><span class="dot"></span>Работает</span>';
      if (stateName === "blocked") return '<span class="pill cancelled"><span class="dot"></span>Заблокирован</span>';
      return '<span class="pill"><span class="dot"></span>Не настроен</span>';
    }
    apiPost("getBotStatus", {}).then(assertOk).then(function (st) {
      if (!document.getElementById("bot-block")) return;
      var reserves = st.reserves || [];
      var anyAlive = reserves.some(function (r) { return r.state === "alive"; });
      box.innerHTML =
        '<div class="state-row"><span class="state-line">Основной' + (st.mainName ? " · @" + esc(st.mainName) : "") + '</span>' + pill(st.main) + '</div>' +
        reserves.map(function (r, i) {
          return '<div class="state-row"><span class="state-line">Запасной ' + (i + 1) + (r.name ? " · @" + esc(r.name) : "") + '</span>' + pill(r.state) + '</div>';
        }).join("") +
        (anyAlive
          ? '<button class="btn-primary" id="bot-switch" style="background:var(--danger);border-color:var(--danger);">Активировать запасного бота</button>' +
            '<p class="hint-note">Первый живой запасной станет основным, кнопка «Открыть приложение» переедет к нему, остальные подвинутся в очереди. Сторож делает то же сам каждые 30 минут при блокировке.</p>'
          : '<p class="hint-note">Живых запасных нет. Создайте ботов в BotFather и вставьте ключи в строки bot_token_2, bot_token_3, bot_token_4 листа «Тексты» — номер строки соответствует номеру бота.</p>');
      var btn = document.getElementById("bot-switch");
      if (btn) btn.addEventListener("click", function () {
        if (!confirm("Переключить приложение на запасного бота? Основной перестанет использоваться.")) return;
        btn.disabled = true;
        apiPost("switchToReserveBot", {})
          .then(assertOk)
          .then(function (r) { toast("Приложение переключено на @" + (r.username || "нового бота")); renderBotBlock(); })
          .catch(function (e) { toast(errMsg(e)); btn.disabled = false; });
      });
    }).catch(function (e) {
      box.innerHTML = '<p class="hint-note">Не удалось проверить ботов: ' + esc(errMsg(e)) + '</p>';
    });
  }

  // ---------------- Аналитика ----------------
  var EXPENSE_CATS = ["Закупка камней", "Реклама", "Аренда", "Зарплата", "Прочее"];

  function pnlRow(label, value, opts) {
    opts = opts || {};
    return '<div class="pnl-row' + (opts.total ? " total" : "") + '">' +
      '<span class="lbl">' + label + '</span>' +
      '<span class="num' + (opts.danger ? " danger" : "") + '">' + value + '</span>' +
    '</div>';
  }

  function renderAnalytics(main) {
    var monthKey = state.anMonth || monthKeyNow_();
    apiPost("getAnalytics", { month: monthKey }).then(assertOk).then(function (res) {
      if (state.tab !== "analytics") return;
      var a = (res && res.analytics) || {};
      var p = a.panel || {};
      var pnl = a.pnl || {};
      var dds = Array.isArray(a.dds) ? a.dds : [];
      var units = Array.isArray(a.units) ? a.units : [];
      var cats = Array.isArray(a.expensesByCat) ? a.expensesByCat : [];
      var maxIn = dds.reduce(function (mx, d) { return Math.max(mx, Number(d.inflow) || 0); }, 0);
      var debt = Number(p.debtTotal) || 0;
      var net = Number(pnl.netProfit) || 0;

      main.innerHTML =
        '<div class="screen-title-row"><div class="screen-title">Аналитика</div>' +
        '<div class="screen-sub">Финансы магазина за месяц</div></div>' +

        '<div class="card" style="margin-bottom:16px;">' +
          '<div class="grid-2">' +
            fieldHTML("Месяц отчёта", '<select id="an-month">' + monthOptionsHTML_(monthKey) + '</select>') +
            '<div class="field"><label>Отчёт файлом</label><button class="act-btn" id="an-csv" style="width:100%;">Скачать CSV</button></div>' +
          '</div>' +
        '</div>' +

        '<div class="stat-grid">' +
          '<div class="stat-card"><div class="val">' + money(p.revenueMonth) + '</div><div class="lbl">Выручка за месяц</div></div>' +
          '<div class="stat-card"><div class="val">' + esc(p.ordersMonth != null ? p.ordersMonth : 0) + '</div><div class="lbl">Заказы</div></div>' +
          '<div class="stat-card"><div class="val">' + money(p.avgCheck) + '</div><div class="lbl">Средний чек</div></div>' +
          '<div class="stat-card"><div class="val"' + (debt > 0 ? ' style="color:var(--danger);"' : '') + '>' + money(debt) + '</div><div class="lbl">Должники</div></div>' +
        '</div>' +

        '<div class="card section-gap">' +
          '<span class="eyebrow">P&amp;L за месяц</span>' +
          '<div style="margin-top:8px;">' +

  // Деньги (отдел 09, волна Б): способы оплаты галочками, касса пункта, «что требует внимания».
  // Общий блок витрины и пульта: данные, связь с сервером и демо без сервера (?demo=1, хранилище браузера).
  // Контракт: dogovor/09-kassa.md. Сервер: server/09-kassa.gs. Проверка: proverki/09-kassa.js.
  var KASSA_DEMO = /[?&]demo=1/.test(location.search);
  var KASSA_DEMO_KEY = "kurier_demo_kassa";
  var PAYM_DEMO_KEY = "kurier_demo_pay_methods";
  var PAYM_FIELDS_DEMO_KEY = "kurier_demo_pay_fields";

  // Способы оплаты: код, подпись, поля реквизитов (ключ листа «Тексты», подпись). Двойник списка на сервере (PAY_CATALOG_).
  var PAY_CATALOG = [
    { code: "cash", label: "Наличные при получении", fields: [] },
    { code: "qr_vn", label: "QR Вьетнам", fields: [["pay_bank_details", "Реквизиты банка (как есть, в несколько строк)"], ["pay_qr_image", "Ссылка на картинку QR-кода"]] },
    { code: "qr_kz", label: "QR Казахстан", fields: [["pay_qr_kz_details", "Реквизиты банка (как есть, в несколько строк)"], ["pay_qr_kz_image", "Ссылка на картинку QR-кода"]] },
    { code: "qr_ru", label: "QR Россия", fields: [["pay_qr_ru_details", "Реквизиты банка (как есть, в несколько строк)"], ["pay_qr_ru_image", "Ссылка на картинку QR-кода"]] },
    { code: "crypto", label: "Криптовалюта", fields: [["pay_usdt_address", "Адрес кошелька"], ["pay_usdt_network", "Сеть (например TRC20)"], ["rate_vnd_to_usdt", "Курс: сколько USDT в одной основной единице"]] }
  ];
  var PAY_LEGACY = { qr: "qr_vn", usdt: "crypto" };

  function kassaStoreGet_(key, def) {
    try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? def : v; } catch (e) { return def; }
  }
  function kassaStoreSet_(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
  }

  // Те же правила, что на сервере (payMethodsCheck_): пусто нельзя, одну криптовалюту нельзя
  function payMethodsCheck(list) {
    if (!list || !list.length) return "Отметьте хотя бы один способ оплаты";
    if (list.length === 1 && list[0] === "crypto") return "Криптовалюта не может быть единственным способом оплаты: оставьте ещё наличные или QR";
    return "";
  }
  function payMethodLabel(code) {
    code = PAY_LEGACY[code] || code;
    for (var i = 0; i < PAY_CATALOG.length; i++) if (PAY_CATALOG[i].code === code) return PAY_CATALOG[i].label;
    return code || "";
  }
  // Включённые способы в демо: по умолчанию только наличные; сломанный набор читается как «только наличные»
  function payMethodsDemoRead() {
    var list = kassaStoreGet_(PAYM_DEMO_KEY, ["cash"]);
    if (!Array.isArray(list)) list = ["cash"];
    list = PAY_CATALOG.map(function (m) { return m.code; }).filter(function (c) { return list.indexOf(c) !== -1; });
    return payMethodsCheck(list) ? ["cash"] : list;
  }
  function payFieldsDemoRead() { return kassaStoreGet_(PAYM_FIELDS_DEMO_KEY, {}); }

  // Пульт: все способы с галочкой и реквизитами. Promise<{methods, catalog:[{code,label,enabled,fields:[{key,label,value}]}]}>
  function payMethodsLoad() {
    if (KASSA_DEMO) {
      var on = payMethodsDemoRead(), vals = payFieldsDemoRead();
      return Promise.resolve({
        methods: on,
        catalog: PAY_CATALOG.map(function (m) {
          return { code: m.code, label: m.label, enabled: on.indexOf(m.code) !== -1, fields: m.fields.map(function (f) { return { key: f[0], label: f[1], value: vals[f[0]] || "" }; }) };
        })
      });
    }
    return apiPost("getPayMethods", {}).then(assertOk);
  }
  function payMethodsSave(list) {
    var err = payMethodsCheck(list);
    if (err) return Promise.reject(new Error(err));
    if (KASSA_DEMO) { kassaStoreSet_(PAYM_DEMO_KEY, list); return Promise.resolve({ success: true, methods: list }); }
    return apiPost("setPayMethods", { methods: list }).then(assertOk);
  }
  // Реквизит способа (поле под галочкой): в демо в браузере, иначе обычная настройка setText
  function payFieldSave(key, value) {
    if (KASSA_DEMO) { var v = payFieldsDemoRead(); v[key] = value; kassaStoreSet_(PAYM_FIELDS_DEMO_KEY, v); return Promise.resolve(); }
    return apiPost("setText", { key: key, value: value }).then(assertOk);
  }
  // Ответ getPaymentInfo в демо: включённые способы и их реквизиты (клиент видит только отмеченные)
  function payInfoDemo() {
    var on = payMethodsDemoRead(), vals = payFieldsDemoRead(), details = {}, labels = {};
    PAY_CATALOG.forEach(function (m) {
      labels[m.code] = m.label;
      if (m.code !== "cash" && on.indexOf(m.code) !== -1) {
        details[m.code] = { label: m.label, fields: m.fields.map(function (f) { return { key: f[0], label: f[1], value: vals[f[0]] || "" }; }) };
      }
    });
    return { success: true, methods: on, labels: labels, details: details, qrEnabled: on.indexOf("qr_vn") !== -1, bankDetails: vals.pay_bank_details || "", qrImage: vals.pay_qr_image || "", usdtAddress: vals.pay_usdt_address || "", usdtNetwork: vals.pay_usdt_network || "", rates: {} };
  }

  // ---------------- Касса пункта ----------------
  // Журнал: prihod (выдача за наличные, status provedeno), sdacha (ozhidaet -> prinyato | otkloneno).
  // Наличных на пункте = приходы минус принятые сдачи. Ожидающая сдача кассу не меняет.
  function kassaSums(rows) {
    var m = {};
    rows.forEach(function (r) {
      var s = m[r.punkt_id] || (m[r.punkt_id] = { prihod: 0, sdano: 0, ozhidaet: 0, saldo: 0 });
      if (r.tip === "prihod" && r.status === "provedeno") s.prihod += r.summa;
      if (r.tip === "sdacha" && r.status === "prinyato") s.sdano += r.summa;
      if (r.tip === "sdacha" && r.status === "ozhidaet") s.ozhidaet += r.summa;
    });
    Object.keys(m).forEach(function (k) { m[k].saldo = Math.round((m[k].prihod - m[k].sdano) * 100) / 100; });
    return m;
  }
  function kassaDemoRows() {
    var rows = kassaStoreGet_(KASSA_DEMO_KEY, null);
    if (!Array.isArray(rows)) {
      // начальный набор: заказ D-3002 уже выдан за наличные на втором пункте
      rows = [{ id: "KDEMO1", data: new Date(Date.now() - 26 * 3600000).toISOString(), punkt_id: "P-DEMO-2", tip: "prihod", summa: 300000, order_id: "D-3002", kto: "demo", status: "provedeno", podtverdil: "", podtverzhdeno: "" }];
      kassaStoreSet_(KASSA_DEMO_KEY, rows);
    }
    return rows;
  }
  // Демо: выдача заказа за наличные кладёт сумму на пункт (зовёт issueOrder отдела 05). Повтор по тому же заказу ничего не добавляет.
  function kassaDemoVnesti(punktId, orderId, summa) {
    var rows = kassaDemoRows();
    if (!(Number(summa) > 0) || !punktId) return;
    if (rows.some(function (r) { return r.tip === "prihod" && r.order_id === String(orderId); })) return;
    rows.push({ id: "K" + Date.now().toString(36).toUpperCase(), data: new Date().toISOString(), punkt_id: String(punktId), tip: "prihod", summa: Number(summa), order_id: String(orderId), kto: String(state.telegramId || "demo"), status: "provedeno", podtverdil: "", podtverzhdeno: "" });
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
  }
  function kassaPunktNames_() {
    return (typeof loadPunkty === "function" ? loadPunkty() : Promise.resolve([])).then(function (list) {
      var names = {}, ids = [];
      (list || []).forEach(function (p) { names[String(p.id)] = p.nazvanie || p.id; ids.push(String(p.id)); });
      return { names: names, ids: ids };
    }).catch(function () { return { names: {}, ids: [] }; });
  }
  function kassaViewRow_(r, names) {
    return { id: r.id, data: r.data, punktId: r.punkt_id, punktNazvanie: names[r.punkt_id] || r.punkt_id, tip: r.tip, summa: r.summa, orderId: r.order_id, kto: r.kto, ktoImya: r.kto, status: r.status, podtverdil: r.podtverdil, podtverdilImya: r.podtverdil, podtverzhdeno: r.podtverzhdeno };
  }
  // Promise<{punkty:[{punktId, punktNazvanie, saldo, ozhidaet, mozhnoSdat}], total, waiting:[], history:[]}>
  function kassaLoad() {
    if (!KASSA_DEMO) return apiPost("getKassa", {}).then(assertOk);
    return kassaPunktNames_().then(function (pn) {
      var rows = kassaDemoRows(), sums = kassaSums(rows), ids = pn.ids.slice();
      Object.keys(sums).forEach(function (k) { if (ids.indexOf(k) === -1) ids.push(k); });
      var list = ids.map(function (id) {
        var s = sums[id] || { prihod: 0, sdano: 0, ozhidaet: 0, saldo: 0 };
        return { punktId: id, punktNazvanie: pn.names[id] || id, saldo: s.saldo, ozhidaet: s.ozhidaet, prihod: s.prihod, sdano: s.sdano, mozhnoSdat: Math.round((s.saldo - s.ozhidaet) * 100) / 100 };
      }).sort(function (a, b) { return b.saldo - a.saldo; });
      return {
        success: true, punkty: list,
        total: Math.round(list.reduce(function (n, p) { return n + p.saldo; }, 0) * 100) / 100,
        waiting: rows.filter(function (r) { return r.tip === "sdacha" && r.status === "ozhidaet"; }).map(function (r) { return kassaViewRow_(r, pn.names); }),
        history: rows.slice(-40).reverse().map(function (r) { return kassaViewRow_(r, pn.names); })
      };
    });
  }
  // «Сдал»: хозяин пункта или курьер
  function kassaSdat(punktId, summa) {
    summa = Math.round((Number(summa) || 0) * 100) / 100;
    if (!KASSA_DEMO) return apiPost("sdatNalichnye", { punktId: punktId, summa: summa }).then(assertOk);
    if (!(summa > 0)) return Promise.reject(new Error("Сумма сдачи: число больше нуля"));
    var rows = kassaDemoRows(), s = kassaSums(rows)[punktId] || { saldo: 0, ozhidaet: 0 };
    var free = Math.round((s.saldo - s.ozhidaet) * 100) / 100;
    if (summa > free) return Promise.reject(new Error(free > 0 ? "На пункте можно сдать не больше " + free : "На пункте нет наличных к сдаче"));
    rows.push({ id: "K" + Date.now().toString(36).toUpperCase(), data: new Date().toISOString(), punkt_id: punktId, tip: "sdacha", summa: summa, order_id: "", kto: String(state.telegramId || "demo"), status: "ozhidaet", podtverdil: "", podtverzhdeno: "" });
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true, summa: summa });
  }
  // «Принял» (владелец): только теперь сумма списывается с пункта
  function kassaPrinyat(id) {
    if (!KASSA_DEMO) return apiPost("prinyatNalichnye", { id: id }).then(assertOk);
    var rows = kassaDemoRows(), r = rows.filter(function (x) { return x.id === id && x.tip === "sdacha"; })[0];
    if (!r) return Promise.reject(new Error("Сдача не найдена"));
    if (r.status !== "ozhidaet") return Promise.reject(new Error("Сдача уже закрыта"));
    var s = kassaSums(rows)[r.punkt_id] || { saldo: 0 };
    if (r.summa > s.saldo) return Promise.reject(new Error("На пункте меньше наличных, чем в сдаче: отклоните её и сдайте заново"));
    r.status = "prinyato"; r.podtverdil = String(state.telegramId || "demo"); r.podtverzhdeno = new Date().toISOString();
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true });
  }
  // «Не сошлось» (владелец): сдача закрыта, касса не меняется
  function kassaOtklonit(id) {
    if (!KASSA_DEMO) return apiPost("otklonitSdachu", { id: id }).then(assertOk);
    var rows = kassaDemoRows(), r = rows.filter(function (x) { return x.id === id && x.tip === "sdacha"; })[0];
    if (!r) return Promise.reject(new Error("Сдача не найдена"));
    if (r.status !== "ozhidaet") return Promise.reject(new Error("Сдача уже закрыта"));
    r.status = "otkloneno"; r.podtverdil = String(state.telegramId || "demo"); r.podtverzhdeno = new Date().toISOString();
    kassaStoreSet_(KASSA_DEMO_KEY, rows);
    return Promise.resolve({ success: true });
  }

  // ---------------- «Что требует внимания» ----------------
  // Сырые данные: {pustye:[{punktId,punktNazvanie}], prosrochennye:[{orderId,punktId,punktNazvanie,bronDo}], istekshie:n,
  //                kassa:[{punktId,punktNazvanie,saldo,ozhidaet}], sdachi:[ожидающие сдачи]}
  function attentionLoad() {
    if (!KASSA_DEMO) return apiPost("getAttention", {}).then(assertOk);
    return Promise.all([
      kassaPunktNames_(),
      typeof ostatkiPunkty === "function" ? ostatkiPunkty() : Promise.resolve([]),
      kassaLoad(),
      typeof pickupDemoOrders === "function" ? Promise.resolve(pickupDemoOrders()) : Promise.resolve([])
    ]).then(function (r) {
      var punkty = r[1] || [];
      return (typeof ostatkiLoad === "function" ? ostatkiLoad(punkty) : Promise.resolve([])).then(function (rows) {
        var dost = {};
        (rows || []).forEach(function (o) { dost[o.punkt_id] = (dost[o.punkt_id] || 0) + Math.max(0, Number(o.dostupno != null ? o.dostupno : o.kolichestvo - o.bron) || 0); });
        var out = { success: true, pustye: [], prosrochennye: [], istekshie: 0, kassa: [], sdachi: r[2].waiting };
        punkty.forEach(function (p) { if (!(dost[String(p.id)] > 0)) out.pustye.push({ punktId: String(p.id), punktNazvanie: p.nazvanie || p.id }); });
        var now = Date.now();
        r[3].forEach(function (o) {
          if (o.status === "bron_istekla") out.istekshie++;
          if (o.status === "zabronirovan" && Date.parse(o.bronDo) <= now) out.prosrochennye.push({ orderId: o.orderId, punktId: o.punktId, punktNazvanie: r[0].names[o.punktId] || o.punktNazvanie, bronDo: o.bronDo });
        });
        out.kassa = r[2].punkty.filter(function (p) { return p.saldo > 0; }).map(function (p) { return { punktId: p.punktId, punktNazvanie: p.punktNazvanie, saldo: p.saldo, ozhidaet: p.ozhidaet }; });
        return out;
      });
    });
  }
  // Сырые данные -> строки экрана [{kind: "warn" | "info", text}] (общая для демо и боя)
  function attentionItems(a) {
    var out = [];
    (a.pustye || []).forEach(function (p) { out.push({ kind: "warn", text: "На пункте «" + p.punktNazvanie + "» нет товара" }); });
    (a.prosrochennye || []).forEach(function (o) { out.push({ kind: "warn", text: "Бронь " + o.orderId + " просрочена (пункт «" + o.punktNazvanie + "»), товар ещё не вернулся на полку" }); });
    if (Number(a.istekshie) > 0) out.push({ kind: "info", text: "Броней закрыто по сроку: " + a.istekshie });
    (a.sdachi || []).forEach(function (s) { out.push({ kind: "warn", text: "Ждёт вашего «Принял»: сдача " + money(s.summa) + " с пункта «" + s.punktNazvanie + "»" }); });

  function saveCurrencies_() {

      return { code: String(c.code).trim(), symbol: String(c.symbol || "").trim(), rate: String(c.rate == null ? "" : c.rate).trim(), pay: !!c.pay };

  // Остатки по пунктам выдачи (отдел 03): данные, демо-набор подарков, связь с сервером.
  // Общий блок обеих страниц (витрина и пульт). Контракт: otdely/MVP-1.md, лист «Остатки»
  // (tovar_id, punkt_id, kolichestvo, bron; доступно = kolichestvo - bron), dogovor/03-ostatki.md.
  // Для других отделов: ostatkiLoad(), ostatkiDostupno(rows, tovarId, punktId), ostatokSet(), giftsLoad(),
  // katalogSPunktami(); в демо-режиме зеркало серверных операций: ostatkiDemoZabronirovat, ostatkiDemoSnyatBron,
  // ostatkiDemoVydat, ostatkiDemoPrihod (то же, что zabronirovat_, snyatBron_, spisatVydannoe_, prihodNaPunkt_).
  var OSTATKI_DEMO = /[?&]demo=1/.test(location.search);
  var OSTATKI_DEMO_KEY = "kurier_demo_ostatki";

  // Заглушка списка пунктов, пока блок пунктов (отдел 07, punkty-dannye.js) не подключён в страницу
  var PUNKTY_ZAGLUSHKA_ = [
    { id: "p1", nazvanie: "Пункт 1", adres: "", chasy: "" },
    { id: "p2", nazvanie: "Пункт 2", adres: "", chasy: "" },
    { id: "p3", nazvanie: "Пункт 3", adres: "", chasy: "" },
    { id: "p4", nazvanie: "Пункт 4", adres: "", chasy: "" }
  ];

  // Демо-набор: 8 подарков, цена в донгах. q — сколько на 1-м, 2-м, 3-м, 4-м пункте списка.
  // Набор рассчитан на показ: один товар по одной штуке (последняя штука), один нигде не лежит (уходит из каталога).
  var GIFTS_DEMO_ = [
    { tovarId: 1, name: "Чайный набор в коробке", price: 250000, q: [5, 3, 0, 2] },
    { tovarId: 2, name: "Ароматическая свеча", price: 180000, q: [1, 0, 4, 6] },
    { tovarId: 3, name: "Кружка с гравировкой", price: 220000, q: [0, 2, 2, 1] },
    { tovarId: 4, name: "Шёлковый шарф", price: 450000, q: [1, 1, 0, 0] },
    { tovarId: 5, name: "Открытки ручной работы", price: 90000, q: [10, 8, 6, 4] },
    { tovarId: 6, name: "Кокосовое мыло, подарочная коробка", price: 160000, q: [0, 0, 3, 0] },
    { tovarId: 7, name: "Бамбуковая шкатулка", price: 380000, q: [2, 0, 0, 5] },
    { tovarId: 8, name: "Брелок «Нячанг»", price: 70000, q: [0, 0, 0, 0] }
  ];

  function ostatkiRound_(x) { return Math.round(x * 1000) / 1000; }

  // Цены, изменённые руками в демо, лежат в памяти браузера (общие для витрины и пульта)
  var OSTATKI_DEMO_CENY_KEY = "kurier_demo_ceny";
  function giftPricesDemo_() {
    try { return JSON.parse(localStorage.getItem(OSTATKI_DEMO_CENY_KEY) || "{}") || {}; } catch (e) { return {}; }
  }
  function giftPriceDemoSet(tovarId, price) {

  // Подарки для демо в том виде, в каком товары лежат в витрине
  function demoGifts() {
    var over = giftPricesDemo_();
    return GIFTS_DEMO_.map(function (g) {
      var price = isFinite(over[String(g.tovarId)]) && over[String(g.tovarId)] >= 0 ? over[String(g.tovarId)] : g.price;
      return { tovarId: g.tovarId, name: g.name, price: price, stock: g.q.reduce(function (a, b) { return a + b; }, 0), image: "" };
    });

  // Витрина в демо-режиме берёт подарки отсюда, а не из старого набора (другие экраны видят тот же список)
  if (OSTATKI_DEMO && typeof state === "object" && state && "productsLoaded" in state) {
    state.products = demoGifts();
    state.productsLoaded = true;
  }

  // Пункты для остатков: из блока пунктов (отдел 07), если он есть, иначе заглушка. Promise<[{id, nazvanie, adres, chasy}]>
  function ostatkiPunkty() {
    var keep = function (list) { state.punktyDlyaOstatkov = list; return list; };
    if (typeof loadPunkty === "function") {
      return loadPunkty().then(function (list) { return keep(list || []); }).catch(function () { return keep(OSTATKI_DEMO ? PUNKTY_ZAGLUSHKA_.slice() : []); });
    }
    return Promise.resolve(keep(OSTATKI_DEMO ? PUNKTY_ZAGLUSHKA_.slice() : []));
  }

  // ---- демо-хранилище (localStorage, общее для витрины и пульта) ----
  function ostatkiDemoRead_(punkty) {
    var rows = null;
    try { rows = JSON.parse(localStorage.getItem(OSTATKI_DEMO_KEY) || "null"); } catch (e) { rows = null; }
    var ids = (punkty || []).map(function (p) { return String(p.id); });
    var fits = Array.isArray(rows) && rows.some(function (r) { return ids.indexOf(String(r.punkt_id)) !== -1; });
    if (!fits) {
      rows = [];
      GIFTS_DEMO_.forEach(function (g) {
        ids.slice(0, 4).forEach(function (pid, i) {
          if (g.q[i] > 0) rows.push({ tovar_id: String(g.tovarId), punkt_id: pid, kolichestvo: g.q[i], bron: 0 });
        });
      });
      ostatkiDemoWrite_(rows);
    }
    return rows;
  }
  function ostatkiDemoWrite_(rows) {
    try { localStorage.setItem(OSTATKI_DEMO_KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function ostatkiDemoNames_() {
    var m = {};
    GIFTS_DEMO_.forEach(function (g) { m[String(g.tovarId)] = g.name; });
    return m;
  }

  // Строки с посчитанным «доступно». Promise<[{tovar_id, punkt_id, kolichestvo, bron, dostupno}]>
  function ostatkiLoad(punkty) {
    var finish = function (rows) {
      state.ostatki = rows.map(function (r) {
        var k = Number(r.kolichestvo) || 0, b = Number(r.bron) || 0;
        return { tovar_id: String(r.tovar_id), punkt_id: String(r.punkt_id), kolichestvo: k, bron: b, dostupno: ostatkiRound_(k - b) };
      });
      return state.ostatki;
    };
    if (OSTATKI_DEMO) {
      var have = punkty ? Promise.resolve(punkty) : ostatkiPunkty();
      return have.then(function (pl) { return finish(ostatkiDemoRead_(pl)); });
    }
    return apiPost("getOstatki", {}).then(assertOk).then(function (res) {
      if (!res || !Array.isArray(res.data)) throw new Error("bad shape");
      return finish(res.data);
    });
  }

  // Доступно товара на пункте (0, если строки нет)
  function ostatkiDostupno(rows, tovarId, punktId) {
    for (var i = 0; i < rows.length; i++) {
      if (String(rows[i].tovar_id) === String(tovarId) && String(rows[i].punkt_id) === String(punktId)) return rows[i].dostupno;
    }
    return 0;
  }

  // Ручная правка остатка. Promise<строка>. Меньше брони нельзя (так же отвечает сервер).
  function ostatokSet(tovarId, punktId, kol) {
    var q = Number(kol);
    if (String(kol) === "" || kol == null || !isFinite(q) || q < 0) return Promise.reject(new Error("Количество: число от нуля"));
    if (OSTATKI_DEMO) {
      var rows = ostatkiDemoRead_(state.punktyDlyaOstatkov || []), hit = null;
      rows.forEach(function (r) { if (String(r.tovar_id) === String(tovarId) && String(r.punkt_id) === String(punktId)) hit = r; });
      if (hit) {
        if (q < hit.bron - 1e-9) return Promise.reject(new Error("Нельзя поставить меньше брони: забронировано " + hit.bron));
        hit.kolichestvo = ostatkiRound_(q);
      } else {
        hit = { tovar_id: String(tovarId), punkt_id: String(punktId), kolichestvo: ostatkiRound_(q), bron: 0 };
        rows.push(hit);
      }
      ostatkiDemoWrite_(rows);
      return Promise.resolve(hit);
    }
    return apiPost("setOstatok", { tovar_id: tovarId, punkt_id: punktId, kolichestvo: q }).then(assertOk).then(function (res) { return res.data; });
  }

  // Подарки (товары) для экранов: [{tovarId, name, price, image, stock}]. В демо - демо-набор.
  function giftsLoad() {
    if (OSTATKI_DEMO) return Promise.resolve(demoGifts());
    if (typeof loadProducts === "function") return loadProducts();
    return apiPost("getTovary", {}).then(assertOk).then(function (res) {
      return ((res && res.data) || []).map(function (t) { return { tovarId: t.id, name: t.name, price: t.price, stock: t.ostatok, image: t.image || "" }; });
    });
  }

  // Чистая функция каталога: подарки + остатки + активные пункты -> подарки с пунктами.
  // У каждого: punkty = [{id, nazvanie, adres, chasy, dostupno}] только там, где доступно > 0 и пункт активен;
  // stock = сумма доступного. Подарки без единого пункта убираются, если onlyAvailable не false.
  function katalogSPunktami(gifts, rows, punkty, onlyAvailable) {
    var out = [];
    (gifts || []).forEach(function (g) {
      var pl = [], total = 0;
      (punkty || []).forEach(function (p) {
        var d = ostatkiDostupno(rows || [], g.tovarId, p.id);
        if (d > 0) { pl.push({ id: String(p.id), nazvanie: p.nazvanie, adres: p.adres || "", chasy: p.chasy || "", dostupno: d }); total += d; }
      });
      var c = {};
      for (var k in g) c[k] = g[k];
      c.punkty = pl;
      c.stock = ostatkiRound_(total);
      if (pl.length || onlyAvailable === false) out.push(c);
    });
    return out;
  }

  // ---- демо-зеркало серверных операций (для отделов 04, 05, 08 в режиме ?demo=1) ----
  // items: [{tovarId, kolichestvo}] (понимаются и tovar_id/id, qty/quantity); Promise.resolve({success, error?, data?})
  function ostatkiDemoChange_(items, punktId, op) {
    if (!Array.isArray(items) || !items.length) return { success: false, error: "Нет позиций" };
    var pid = String(punktId == null ? "" : punktId).trim();
    if (!pid) return { success: false, error: "Не указан пункт" };
    var sums = {}, order = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      var id = it.tovarId != null ? it.tovarId : (it.tovar_id != null ? it.tovar_id : it.id);
      var raw = it.kolichestvo != null ? it.kolichestvo : (it.qty != null ? it.qty : (it.quantity != null ? it.quantity : 1));
      var n = Number(raw);
      if (id == null || id === "") return { success: false, error: "У позиции нет товара" };
      if (!isFinite(n) || n <= 0) return { success: false, error: "Количество должно быть больше нуля" };
      var key = String(id);
      if (!(key in sums)) { sums[key] = 0; order.push(key); }
      sums[key] = ostatkiRound_(sums[key] + n);
    }
    var rows = ostatkiDemoRead_(state.punktyDlyaOstatkov || []);
    var names = ostatkiDemoNames_(), unit = (typeof unitShort === "function" ? unitShort() : "") || "шт";
    var plan = [];
    for (var j = 0; j < order.length; j++) {
      var tid = order[j], n2 = sums[tid], row = null;
      rows.forEach(function (r) { if (String(r.tovar_id) === tid && String(r.punkt_id) === pid) row = r; });
      var name = names[tid] || ("товар " + tid);
      if (!row) {
        if (op !== "prihod") return { success: false, error: "«" + name + "» на этом пункте нет" };
        row = { tovar_id: tid, punkt_id: pid, kolichestvo: 0, bron: 0, fresh: true };
      }
      var c = { ref: row, kolichestvo: row.kolichestvo, bron: row.bron };
      if (op === "bron") {
        var free = ostatkiRound_(c.kolichestvo - c.bron);
        if (n2 > free + 1e-9) return { success: false, error: "Не хватает «" + name + "» на пункте: доступно " + free + " " + unit + ", нужно " + n2 };
        c.bron += n2;
      } else if (op === "snyat") {
        c.bron = Math.max(0, c.bron - n2);
      } else if (op === "vydat") {
        if (n2 > c.kolichestvo + 1e-9) return { success: false, error: "На пункте нет столько «" + name + "»: есть " + c.kolichestvo + " " + unit + ", нужно " + n2 };
        c.kolichestvo -= n2;
        c.bron = Math.max(0, c.bron - n2);
      } else if (op === "prihod") {
        c.kolichestvo += n2;
      }
      plan.push(c);
    }
    plan.forEach(function (c) {
      c.ref.kolichestvo = ostatkiRound_(c.kolichestvo);
      c.ref.bron = ostatkiRound_(c.bron);
      if (c.ref.fresh) { delete c.ref.fresh; rows.push(c.ref); }
    });
    ostatkiDemoWrite_(rows);
    return { success: true };
  }
  function ostatkiDemoZabronirovat(items, punktId) { return ostatkiDemoChange_(items, punktId, "bron"); }
  function ostatkiDemoSnyatBron(items, punktId) { return ostatkiDemoChange_(items, punktId, "snyat"); }
  function ostatkiDemoVydat(items, punktId) { return ostatkiDemoChange_(items, punktId, "vydat"); }
  function ostatkiDemoPrihod(items, punktId) { return ostatkiDemoChange_(items, punktId, "prihod"); }

  // Панель «Остатки по пунктам» (отдел 03): одна и та же на экране склада витрины и во вкладке «Товары» пульта.
  // Данные и связь с сервером: ostatki-dannye.js. Загрузка: ostatkiPanelLoad() -> Promise<{gifts, punkty, rows}>.
  function ostatkiPanelLoad() {
    return Promise.all([giftsLoad(), ostatkiPunkty()]).then(function (r) {
      return ostatkiLoad(r[1]).then(function (rows) { return { gifts: r[0], punkty: r[1], rows: rows }; });
    });
  }
  function ostatkiRow_(d, g, p) {
    for (var i = 0; i < d.rows.length; i++) {
      if (String(d.rows[i].tovar_id) === String(g) && String(d.rows[i].punkt_id) === String(p)) return d.rows[i];
    }
    return null;
  }
  // Поля берут цвета темы (в пульте у голого input иначе белый фон)
  var OSTATKI_INPUT_STYLE_ = "background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 8px;font:inherit;text-align:right;";
  // opts: { canStock, canPrice }
  function ostatkiPanelHTML(d, opts) {
    var priceLabel = "Цена" + (currencySym() ? ", " + esc(currencySym()) : "") + (unitShort() ? "/" + esc(unitShort()) : "");
    return (!d.punkty.length

  // opts: { savePrice(tovarId, price) -> Promise }
  function ostatkiPanelBind(root, d, opts) {
    root.querySelectorAll("[data-stock]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var g = inp.getAttribute("data-stock"), p = inp.getAttribute("data-punkt");
        var before = ostatkiRow_(d, g, p);
        ostatokSet(g, p, inp.value).then(function (res) {
          var k = Number(res.kolichestvo), b = Number(res.bron) || 0;
          if (before) { before.kolichestvo = k; before.bron = b; before.dostupno = ostatkiRound_(k - b); }
          else d.rows.push({ tovar_id: String(g), punkt_id: String(p), kolichestvo: k, bron: b, dostupno: ostatkiRound_(k - b) });
          var cur = ostatkiRow_(d, g, p);
          var info = root.querySelector('[data-info="' + g + "|" + p + '"]');
          if (info && cur) info.textContent = "в брони " + fmtQty(cur.bron) + " · доступно " + fmtQty(cur.dostupno);
          var tot = root.querySelector('[data-total="' + g + '"]');
          if (tot) tot.textContent = fmtQty(d.punkty.reduce(function (n, pp) { var r = ostatkiRow_(d, g, pp.id); return n + (r ? r.dostupno : 0); }, 0));
          toast("Сохранено");
        }).catch(function (err) {
          inp.value = before ? before.kolichestvo : 0;
          toast(err && err.message ? err.message : "Не удалось сохранить");
        });
      });
    });
    root.querySelectorAll("[data-price]").forEach(function (inp) {
      inp.addEventListener("change", function () {
        var id = inp.getAttribute("data-price"), val = Number(inp.value);
        if (!(val >= 0)) { toast("Цена: число от нуля"); return; }
        var p = opts.savePrice ? opts.savePrice(id, val) : Promise.reject(new Error("Цену здесь менять нельзя"));
        p.then(function () { toast("Сохранено"); }).catch(function (err) { toast(err && err.message ? err.message : "Не удалось сохранить цену"); });
      });
    });
  }
  // Сохранение цены: в демо в памяти браузера, иначе действие updateTovaryPrice
  function giftPriceSave(tovarId, price) {
    if (OSTATKI_DEMO) { giftPriceDemoSet(tovarId, price); return Promise.resolve(); }
    return apiPost("updateTovaryPrice", { tovarId: tovarId, newPrice: price }).then(assertOk).then(function () {
      if (state.products) state.products.forEach(function (p) { if (String(p.tovarId) === String(tovarId)) p.price = price; });
    });
  }

              .then(assertOk)
              .then(function (r) {

              document.querySelector('#new-product [data-f="image"]').value = r.url;

  // ---------------- Люди: люди, должности, разрешения ----------------
  // Должность = набор разрешений (список разрешений фиксированный, см. dogovor/RAZRESHENIYA.md).
  // Должности создаёт и меняет владелец; у человека может быть несколько должностей.
  var OWNER_ONLY_PERMS = ["people_manage", "positions_manage", "bot_manage", "tasks_manage"];
  var peopleData_ = null;     // { users, positions } после загрузки
  var peopleEditId_ = null;   // id должности, которую сейчас правим

  // --- мелкие помощники
  var TRANSLIT_ = { а: "a", б: "b", в: "v", г: "g", д: "d", е: "e", ё: "e", ж: "zh", з: "z", и: "i", й: "y", к: "k", л: "l", м: "m", н: "n", о: "o", п: "p", р: "r", с: "s", т: "t", у: "u", ф: "f", х: "h", ц: "c", ч: "ch", ш: "sh", щ: "sch", ъ: "", ы: "y", ь: "", э: "e", ю: "yu", я: "ya" };
  function positionSlug_(name, taken) {
    var s = String(name).toLowerCase().split("").map(function (c) { return TRANSLIT_[c] != null ? TRANSLIT_[c] : c; }).join("")
      .replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 28) || "dolzhnost";
    var id = s, n = 2;
    while (taken.indexOf(id) !== -1) id = s + "_" + (n++);
    return id;
  }
  function chipStyle_(on) {
    // выбранная: фон-подсветка и рамка акцентом, текст обычный (белый на акценте не читается в тёмной теме)
    return 'flex:0 0 auto;padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid ' +
      (on ? 'var(--accent)' : 'var(--border)') + ';background:' + (on ? 'var(--accent-soft)' : 'var(--surface)') + ';color:var(--text);font-weight:' + (on ? '700' : '500') +
      ';' + (on ? 'box-shadow:inset 0 0 0 1px var(--accent);' : '');
  }
  function posChipsHTML_(positions, selected) {
    return '<div class="pos-chips" style="display:flex;flex-wrap:wrap;gap:6px;">' +
      positions.map(function (p) {
        var on = selected.indexOf(p.id) !== -1;
        return '<button type="button" data-pos="' + esc(p.id) + '" data-on="' + (on ? 1 : 0) + '" style="' + chipStyle_(on) + '">' + esc(p.name) + '</button>';
      }).join("") + '</div>';
  }
  function bindChips_(box, onChange) {
    box.querySelectorAll("[data-pos]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var on = chip.getAttribute("data-on") !== "1";
        chip.setAttribute("data-on", on ? "1" : "0");
        chip.setAttribute("style", chipStyle_(on));
        onChange(box);
      });
    });
  }
  function chosenChips_(box) {
    return Array.prototype.filter.call(box.querySelectorAll("[data-pos]"), function (c) { return c.getAttribute("data-on") === "1"; })
      .map(function (c) { return c.getAttribute("data-pos"); });
  }
  // кэш списка людей после успешного сохранения, чтобы перерисовка не показывала старое
  function setCachedUser_(tgid, field, value) {
    (peopleData_ ? peopleData_.users : []).forEach(function (u) { if (String(u.telegramId) === String(tgid)) u[field] = value; });
  }
  function userPositionIds_(u) {
    if (Array.isArray(u.positions) && u.positions.length) return u.positions.map(function (p) { return p && typeof p === "object" ? p.id : p; });
    return [LEGACY_TO_POSITION[u.role] || "client"];
  }

  // --- экран
  function renderPeople(main) {
    if (!cubCan("people_view")) { main.innerHTML = errorHTML("Нет доступа к разделу «Люди»"); return; }

      peopleApi_("getUsers", {}).then(assertOk),

      (canPeople

            fieldHTML("Telegram ID", '<input data-f="telegramId" type="text" inputmode="numeric" placeholder="Например, 100200300" />') +
            fieldHTML("Имя", '<input data-f="name" placeholder="Имя" />') +
            '<div class="field"><label>Должности</label><div id="new-user-pos">' + posChipsHTML_(positions, ["client"]) + '</div></div>' +
            '<button class="btn-primary" id="add-user">Добавить</button>' +
          '</div></div>'
        : '') +

      '<div class="screen-title-row section-gap"><div class="screen-title">Должности</div>' +
      '<div class="screen-sub">Должность — набор разрешений. Владелец имеет все всегда.</div></div>' +
      '<div class="row-list">' +
        positions.map(function (p) {
          var perms = p.permissions || [];
          if (peopleEditId_ === p.id) return positionEditorHTML_(p);
          var count = users.filter(function (u) { return userPositionIds_(u).indexOf(p.id) !== -1; }).length;
          return '<div class="row-card" data-pid="' + esc(p.id) + '">' +
            '<div class="row-top"><span class="id">' + esc(p.name) + '</span><span class="date">' + (p.id === "owner" ? "все разрешения" : perms.length + ' из ' + ALL_PERMS.length) + ' · людей: ' + count + '</span></div>' +
            (p.sub ? '<div style="font-size:12px;color:var(--muted);margin:4px 0 8px;">' + esc(p.sub) + '</div>' : '') +
            (canPos && p.id !== "owner" ? '<button class="btn-secondary" data-act="pos-edit">Изменить</button>' : '') +
          '</div>';
        }).join("") +
      '</div>' +

      (canPos
        ? '<div class="card section-gap"><span class="eyebrow">Новая должность</span><div style="margin-top:12px;" id="new-pos">' +
            fieldHTML("Название", '<input data-f="name" placeholder="Например, Сменный курьер" />') +

            fieldHTML("Взять разрешения за основу", '<select data-f="tpl"><option value="">Пустая, отмечу сам</option>' +
              templates.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join("") +
              '</select>') +
            '<button class="btn-primary" id="add-pos">Создать должность</button>' +
          '</div></div>'
        : '');

    bindPeople_(main);

  function positionEditorHTML_(p) {
    var groups = [];
    PERMISSIONS.forEach(function (x) { if (groups.indexOf(x[2]) === -1) groups.push(x[2]); });
    var have = p.permissions || [];
    return '<div class="card" data-pid="' + esc(p.id) + '" id="pos-editor">' +
      '<span class="eyebrow">Правка должности</span>' +
